        // 网格便签的初始形态：7 成有翘边/歪斜，且外缘与四角明显更多
        // =====================================================================
        function edgeWeight(r, c, rows, cols) {
            const isCorner = (r === 0 || r === rows - 1) && (c === 0 || c === cols - 1);
            if (isCorner) return 2.1;                              // 四个角：最易翘
            const d = Math.min(r, rows - 1 - r, c, cols - 1 - c);
            if (d === 0) return 1.5;                               // 四边外圈
            if (d === 1) return 0.5;                               // 次外圈
            return 0.28;                                           // 内圈
        }

        // 让整体概率均值落在 0.7。四角原始概率会超过 1，被 0.98 削顶后均值会掉下来，
        // 所以二分求解基准值，使「削顶之后」的均值仍正好是 0.7（否则 6x6 只有 0.66）。
        const CURL_TARGET = 0.7;
        const CURL_CAP = 0.98;
        const _curlTableCache = {};

        function curlProbabilityTable(rows, cols) {
            const key = `${rows}x${cols}`;
            if (_curlTableCache[key]) return _curlTableCache[key];

            const weights = [];
            for (let r = 0; r < rows; r++)
                for (let c = 0; c < cols; c++) weights.push(edgeWeight(r, c, rows, cols));

            let lo = 0, hi = 5;
            for (let it = 0; it < 40; it++) {
                const mid = (lo + hi) / 2;
                const mean = weights.reduce((s, w) => s + Math.min(CURL_CAP, mid * w), 0) / weights.length;
                if (mean < CURL_TARGET) lo = mid; else hi = mid;
            }

            const table = weights.map(w => Math.min(CURL_CAP, ((lo + hi) / 2) * w));
            _curlTableCache[key] = table;
            return table;
        }

        function curlProbability(r, c, rows, cols) {
            return curlProbabilityTable(rows, cols)[r * cols + c];
        }

        // 真便利贴的胶涂在背面靠上的那一横条：上半部分被粘死，下半部分是自由的。
        // 所以下边两角比上边两角容易翘得多，权重差三倍半。
        const GLUE_WEIGHT = { TL: 1, TR: 1, BL: 3.5, BR: 3.5 };

        // 对角线的另一头。翘一只角时顺手拉上它，纸面才像被拧过，
        // 不会一只角孤零零戳在那儿。
        const DIAGONAL = { TL: 'BR', BR: 'TL', TR: 'BL', BL: 'TR' };

        // 切片便签的翘角上限：单角 15px、四角合计 25px。
        // 翘得太狠会盖住底图切片，看着不像一张纸而像一个卷起来的筒。
        const LIFT_MAX_EACH = 15;
        const LIFT_MAX_TOTAL = 25;

        // 主翘角：先挑朝向网格外缘的那些角，再按「胶在上半部分」加权抽
        function pickPrimaryCorner(r, c, rows, cols) {
            const top = r === 0, bottom = r === rows - 1;
            const left = c === 0, right = c === cols - 1;
            const pool = [];
            if (top || left) pool.push('TL');
            if (top || right) pool.push('TR');
            if (bottom || left) pool.push('BL');
            if (bottom || right) pool.push('BR');
            if (pool.length === 0) pool.push('TL', 'TR', 'BL', 'BR');

            const weights = pool.map(k => GLUE_WEIGHT[k]);
            let roll = Math.random() * weights.reduce((a, b) => a + b, 0);
            let i = 0;
            while (i < weights.length - 1 && roll >= weights[i]) { roll -= weights[i]; i++; }
            return pool[i];
        }

        // 上边两角被胶粘着，只翘一点点
        const smallLift = () => 4 + Math.floor(Math.random() * 5);                // 4–8

        // 下边两角才是主要翘的地方：大多 7–11，偶尔来一下狠的（12–15）
        const bottomLift = () => Math.random() < 0.28
            ? 12 + Math.floor(Math.random() * (LIFT_MAX_EACH - 11))
            : 7 + Math.floor(Math.random() * 5);

        // 对角上的小伴角，永远比主翘角小一档
        const companionLift = () => 4 + Math.floor(Math.random() * 4);            // 4–7

        // 一张便签的翘角形状。三条是踩出来的经验：
        //   1. 两只角永远取对角线，不取同一条边上的邻角 —— 同边双翘最像折了
        //   2. 主翘角翘得狠（≥9）时必定带上对角小伴角，否则一只角很突兀
        //   3. 都翘不大时让对角两只一样高，纸面像被轻轻拧了一下，最立体
        // 而且只有主翘角可能大，伴角恒 ≤7，所以「同时两个大翘角」结构上就不存在。
        function randomLiftShape(r, c, rows, cols) {
            const out = { TL: 0, TR: 0, BL: 0, BR: 0 };
            const primary = pickPrimaryCorner(r, c, rows, cols);
            const diag = DIAGONAL[primary];
            const topPrimary = primary === 'TL' || primary === 'TR';
            const v = topPrimary ? smallLift() : bottomLift();

            if (v >= 9) {
                out[primary] = v;                       // 翘得狠，必带伴角
                out[diag] = companionLift();
            } else if (Math.random() < 0.45) {
                out[primary] = v;                       // 对角等量，最立体
                out[diag] = v;
            } else if (Math.random() < 0.55) {
                out[primary] = v;                       // 主角 + 更小的伴角
                out[diag] = companionLift();
            } else {
                out[primary] = v;                       // 单角
            }

            // 兜底：以后再调幅度区间，合计也不许超过 25
            while (out.TL + out.TR + out.BL + out.BR > LIFT_MAX_TOTAL) {
                out[['TL', 'TR', 'BL', 'BR'].reduce((a, b) => out[b] > out[a] ? b : a)] -= 1;
            }
            return out;
        }

        // 生成一个随机初始形态；七成里再分「既翘又歪 / 只翘 / 只歪」
        function randomInitialForm(r, c, rows, cols) {
            const p = default2D();
            p.blur = 12 + Math.round(Math.random() * 6);

            if (Math.random() >= curlProbability(r, c, rows, cols)) return p;  // 平整

            const roll = Math.random();
            let hasCurl, hasSkew;
            if (roll < 0.35)      { hasCurl = true;  hasSkew = true;  }   // 既翘边又歪斜
            else if (roll < 0.70) { hasCurl = true;  hasSkew = false; }   // 只翘边不歪斜
            else                  { hasCurl = false; hasSkew = true;  }   // 只歪斜不翘边

            let maxLift = 0;
            if (hasCurl) {
                const set = randomLiftShape(r, c, rows, cols);
                ['TL', 'TR', 'BL', 'BR'].forEach(k => { p[k] = set[k]; });
                maxLift = Math.max(set.TL, set.TR, set.BL, set.BR);
                p.blur = 13 + Math.round(Math.random() * 10);
            }
            // 规则：翘得狠就别再歪斜了 —— 大翘角叠平面倾斜最难看。
            // 用「取消倾斜」而不是「压小翘角」，这样七成的比例一点没动。
            if (hasSkew && maxLift >= 9) hasSkew = false;
            if (hasSkew) p.rotZ = +(Math.random() * 6 - 3).toFixed(2);    // ±3°
            return p;
        }

        // =====================================================================
        // 2D 便签渲染（CSS 变换 + 阴影 + 四角暗部）
        // =====================================================================
        function buildNoteTransform(p) {
            const avgLift = (p.TL + p.TR + p.BL + p.BR) / 4;
            const rotX = ((p.BL + p.BR) - (p.TL + p.TR)) * 0.8;
            // rotY 的正负：左上/左下抬起时应该把左边拉向观众，原来写反了，
            // 结果倾斜指向的角和角点暗部（buildCornerGradient）指的角刚好左右相反。
            const rotY = ((p.TL + p.BL) - (p.TR + p.BR)) * 0.8;
            return `rotateZ(${p.rotZ}deg) rotateX(${rotX}deg) rotateY(${rotY}deg) translateZ(${avgLift}px)`;
        }

        // 切片便签的固定落影：不翘角、不倾斜时也压在底图上。
        // box-shadow 画在元素自身坐标系里，所以便签 rotateZ 时这层影跟着一起倾斜，
        // 不需要额外处理；翘角产生的影再叠在它上面。
        // 两层：贴边那层保证 4px 缝隙里总有一道暗边，扩散那层给外围垫出深度。
        const SLICE_BASE_SHADOW = '0 3px 6px rgba(0,0,0,0.25), 0 10px 20px rgba(0,0,0,0.15)';

        function buildNoteShadow(p, fixed) {
            const maxLift = Math.max(p.TL, p.TR, p.BL, p.BR);
            const opacity = 0.15 + (maxLift / 25) * 0.25;
            const offsetY = 6 + maxLift * 0.8;
            const curl = `0 ${offsetY}px ${p.blur}px rgba(0,0,0,${opacity}), 0 2px 4px rgba(0,0,0,0.12)`;
            return fixed ? `${SLICE_BASE_SHADOW}, ${curl}` : curl;
        }

        function buildCornerGradient(p) {
            const g = [];
            if (p.BR > 0) g.push(`radial-gradient(circle at 100% 100%, rgba(0,0,0,${p.BR * 0.015}) 0%, transparent 60%)`);
            if (p.BL > 0) g.push(`radial-gradient(circle at 0% 100%, rgba(0,0,0,${p.BL * 0.015}) 0%, transparent 60%)`);
            if (p.TR > 0) g.push(`radial-gradient(circle at 100% 0%, rgba(0,0,0,${p.TR * 0.015}) 0%, transparent 60%)`);
            if (p.TL > 0) g.push(`radial-gradient(circle at 0% 0%, rgba(0,0,0,${p.TL * 0.015}) 0%, transparent 60%)`);
            return g.length ? g.join(', ') : 'none';
        }

        // 把一套参数画到任意 2D 便签 DOM 上（网格便签 / 显示屏预览共用）
        function paint2DNote(el, mat, p, ctx) {
            el.style.setProperty('--note-transform', buildNoteTransform(p));
            // 只有「拼图切片」材质的便签带固定落影（纯色/图片材质维持原样）
            el.style.setProperty('--note-shadow', buildNoteShadow(p, mat.matType === 'slice'));
            el.style.opacity = mat.opacity;

            const shadowLayer = el.querySelector('.corner-shadow');
            if (shadowLayer) shadowLayer.style.background = buildCornerGradient(p);

            const inner = el.querySelector('.sticky-img-inner');
            if (mat.matType === 'color') {
                inner.style.backgroundImage = 'none';
                inner.style.backgroundSize = '';
                inner.style.backgroundPosition = '';
                inner.style.backgroundColor = mat.color;
            } else if (mat.matType === 'image' && mat.imageSrc) {
                inner.style.backgroundColor = '#fff';
                inner.style.backgroundImage = `url(${mat.imageSrc})`;
                inner.style.backgroundSize = 'cover';
                inner.style.backgroundPosition = 'center';
            } else if (ctx) {
                // 拼图切片：整图按网格总尺寸铺开，再按行列偏移 —— 与底图严格对齐
                inner.style.backgroundColor = '#fff';
                inner.style.backgroundImage = `url(${currentSlicedImage.src})`;
                inner.style.backgroundSize = `${ctx.totalW}px ${ctx.totalH}px`;
                inner.style.backgroundPosition = `${-ctx.col * (unitBaseSize + STICKY_GAP)}px ${-ctx.row * (unitBaseSize + STICKY_GAP)}px`;
            }

            const textEl = el.querySelector('.note-text');
            if (mat.textMode === 'sign' && mat.sign) {
                // 手写签名：和打字二选一，有签名就只画签名
                textEl.textContent = '';
                const im = document.createElement('img');
                im.className = 'note-sign';
                im.src = mat.sign;
                textEl.appendChild(im);
            } else if (mat.text && fontState === 'loading') {
                // 字体还在路上：这儿先转圈，不拿系统楷体顶 —— 否则字体一到字形跳变
                textEl.textContent = '';
                const sp = document.createElement('span');
                sp.className = 'font-spinner';
                textEl.appendChild(sp);
            } else if (mat.text && mat.bend) {
                // 弯了的字交给不了 DOM：一行字要逐字转到弧上、按弧长摆，CSS 做不到。
                // 先把字按不弯的样子填进元素（renderNoteTextImage 是从元素上读字体、
                // 颜色、字号的），让它照元素自己的尺寸画成图，再拿图把字换掉 ——
                // 手写签名就是这么贴的。导出那边不用跟着改：导出换图那一趟认的是
                // textContent，这儿换完就空了，克隆体带着这张图原样走。
                textEl.textContent = mat.text;
                textEl.style.fontFamily = fontStack();
                textEl.style.color = mat.textColor;
                textEl.style.fontSize = `${mat.fontSize}px`;
                // 量不出尺寸（预览那格正好是 display:none）就先按直的画，下次重画就好
                if (textEl.clientWidth > 0 && textEl.clientHeight > 0) {
                    const im = document.createElement('img');
                    im.className = 'note-text-img';
                    im.src = renderNoteTextImage(textEl, textEl.clientWidth, textEl.clientHeight, mat.bend);
                    textEl.textContent = '';
                    textEl.appendChild(im);
                }
            } else {
                textEl.textContent = mat.text || '';
                textEl.style.fontFamily = fontStack();
                textEl.style.color = mat.textColor;
                textEl.style.fontSize = `${mat.fontSize}px`;
            }
            textEl.style.transform = `rotate(${mat.textRotZ || 0}deg)`;   // 字和签名都要跟着倾
        }

        // =====================================================================
        // 网格渲染
        // =====================================================================
        // 还没导入照片时的占位：一张纯白图，不分块也不写字
        function createWhitePlaceholderImage(callback) {
            const cvs = document.createElement('canvas');
            cvs.width = 600; cvs.height = 600;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 600, 600);
            const img = new Image();
            img.onload = () => callback(img);
            img.src = cvs.toDataURL();
        }

        function renderGrid() {
            // 换画布的唯一判定口。必须挂在**这个**函数的开头，不能挂进 executeRenderGrid：
            // 这里有一条「还没切图 → 造一张白底占位图 → 异步回调里再调一次」的早返回路径，
            // 挂错地方首次进入就会漏掉这一篇。
            // 挂这儿还有个好处：syncCanvasEpoch 是按值比的、天然幂等，那条路径一来一回
            // 调两次也只翻一篇，不用额外防重。
            syncCanvasEpoch();
            if (!currentSlicedImage) {
                createWhitePlaceholderImage((img) => {
                    currentSlicedImage = img;
                    executeRenderGrid();
                });
                return;
            }
            executeRenderGrid();
        }

        // =====================================================================
        // 窄屏布局：并排装不下就改竖排，并把舞台等比缩到装得下
        // =====================================================================
        // 并排需要的宽度不是舞台那 508，而是**当前**这个网格的：行列上限 6，
        // 6 列时舞台 = 6×120 + 5×4 + 140 = 880，加面板 380、.workspace 的缝 25、
        // body 左右 40，一共 1325。行列一变这数就变，所以每次都现量，
        // 不写死断点 —— 写死的断点在某些行列数下必然是错的。
        //
        // 缩放量写在 body 的行内变量上，不写在 stageContainer 上：
        // stageContainer 会被 cloneNode 抄进导出那份 SVG，它身上的行内样式跟着走；
        // 写在 body 上下面的选择器又只在 body.is-narrow 时生效，而 SVG 里没有 <body>，
        // 所以导出那份一定拿不到缩放（见 CSS 里 .stage-fit 那段的说明）。
        const WORKSPACE_GAP = 25;   // 与 .workspace 的 gap 保持一致
        const BODY_PAD = 40;        // body 左右各 20
        const WORKSPACE_MAX = 1500; // 与 .workspace 的 max-width 保持一致

        function layout() {
            const panel = document.querySelector('.panel');

            // 先摘掉 is-narrow 再量。竖排下面板是 width: 100%，量出来的是「当前视口宽」，
            // 拿它算 need 等于自己把自己撑大 —— 从竖排往宽里拖会卡在竖排出不来（滞后）。
            // 摘掉再加回都在同一次 JS 执行里，浏览器还没绘制，看不到闪。
            document.body.classList.remove('is-narrow');

            // 面板的自然宽也要单独量：它是 .workspace 的 flex item，默认 flex-shrink: 1，
            // 并排装不下时它先被压扁 —— 直接读 offsetWidth 拿到的是压过的值，
            // 代进 need 会跟视口宽互相抵消（need 恒等于 avail），永远判不出该竖排。
            // 临时关掉收缩量一次真实宽度，再原样还回去。
            const prevShrink = panel.style.flexShrink;
            panel.style.flexShrink = '0';
            const panelW = panel.offsetWidth;
            panel.style.flexShrink = prevShrink;

            const avail = document.documentElement.clientWidth;
            const need = stageContainer.offsetWidth + WORKSPACE_GAP + panelW + BODY_PAD;
            const narrow = need > avail;
            document.body.classList.toggle('is-narrow', narrow);

            if (!narrow) {
                // 宽屏下 .stage-fit 是 display: contents，这两个变量没人读，
                // 但清掉更干净 —— 免得以后有人在宽屏下误判它们还生效着
                document.body.style.removeProperty('--stage-scale');
                document.body.style.removeProperty('--stage-fit-h');
                return;
            }

            // offsetWidth / offsetHeight 量的是布局尺寸，不含 transform，
            // 所以这里读到的是舞台的「自然」大小，不会自己吃自己（无反馈环）。
            const natW = stageContainer.offsetWidth || 1;
            const natH = stageContainer.offsetHeight || 1;
            const fitW = Math.min(document.body.clientWidth - BODY_PAD, WORKSPACE_MAX);
            const s = Math.min(1, fitW / natW);
            document.body.style.setProperty('--stage-scale', String(s));
            document.body.style.setProperty('--stage-fit-h', (natH * s) + 'px');
        }

        function executeRenderGrid() {
            const { cols, rows, totalW, totalH } = gridMetrics();

            // 重建网格会清掉便签，先记录当前是否选中了网格便签（选中态失效）
            if (selected && selected.kind === '2D') clearSelection();

            gridEl.innerHTML = '';
            gridNotes = [];
            deletedMatrix = Array.from({ length: rows }, () => Array(cols).fill(false));

            bgContainer.style.width = `${totalW}px`;
            bgContainer.style.height = `${totalH}px`;
            bgImg.style.backgroundImage = `url(${currentSlicedImage.src})`;

            gridEl.style.gridTemplateColumns = `repeat(${cols}, ${unitBaseSize}px)`;
            gridEl.style.gridTemplateRows = `repeat(${rows}, ${unitBaseSize}px)`;
            gridEl.style.gap = `${STICKY_GAP}px`;

            updateBgMask(rows, cols, unitBaseSize, STICKY_GAP);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const el = document.createElement('div');
                    el.className = 'paper-note sticky-note';
                    el.style.width = `${unitBaseSize}px`;
                    el.style.height = `${unitBaseSize}px`;

                    el.innerHTML = `
                        <div class="sticky-img-inner"></div>
                        <div class="corner-shadow"></div>
                        <div class="texture-layer"></div>
                        <div class="note-text"></div>
                    `;

                    const mat = defaultMat();
                    const p2 = randomInitialForm(r, c, rows, cols);
                    const note = { el, mat, p2, row: r, col: c };
                    paint2DNote(el, mat, p2, { row: r, col: c, totalW, totalH });

                    const deleteBtn = document.createElement('div');
                    deleteBtn.className = 'action-btn delete-btn';
                    deleteBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

                    const restoreBtn = document.createElement('div');
                    restoreBtn.className = 'action-btn restore-btn';
                    restoreBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>`;

                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        // 参考文件里没有这一句：整体.html 多一个调试面板，删掉正被调试的那张
                        // 会把面板晾在一个点不到的幽灵上，所以顺手清掉选中态。
                        if (selected && selected.note === note) clearSelection();
                        el.classList.add('deleted');
                        deletedMatrix[r][c] = true;
                        updateBgMask(rows, cols, unitBaseSize, STICKY_GAP);
                    });

                    restoreBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        el.classList.remove('deleted');
                        deletedMatrix[r][c] = false;
                        updateBgMask(rows, cols, unitBaseSize, STICKY_GAP);
                    });

                    el.appendChild(deleteBtn);
                    el.appendChild(restoreBtn);

                    el.addEventListener('click', () => {
                        if (el.classList.contains('deleted')) return;   // 幽灵态不参与选中
                        // 再点一下已经选中的切片 = 取消选中。
                        // 触屏上「选中」同时是「放大 + 冒出垃圾桶」，选上之后没有别的
                        // 退出口：只能去点舞台空白，或者点另一张把它顶掉。手指本来就
                        // 压在它上面，再点一次是最自然的收手动作，所以做成开合。
                        // 删除钮和还原钮都 stopPropagation，走不到这里。
                        if (selected && selected.note === note) clearSelection();
                        else select2DNote(note);
                    });

                    gridEl.appendChild(el);
                    gridNotes.push(note);
                }
            }

            // 网格尺寸刚变过，并排还装不装得下得重新算 —— 这一句必须在便签都挂上去
            // 之后（量的就是它们的总尺寸）
            layout();
        }

        // 无缝抠图：删除便签时连右下缝隙一并清掉（照抄 gemini-code-1789620403052.html）
        function updateBgMask(rows, cols, noteSize, gapSize) {
            const totalWidth = cols * noteSize + (cols - 1) * gapSize;
            const totalHeight = rows * noteSize + (rows - 1) * gapSize;

            const maskCanvas = document.createElement('canvas');
            maskCanvas.width = totalWidth;
            maskCanvas.height = totalHeight;
            const ctx = maskCanvas.getContext('2d');

            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, totalWidth, totalHeight);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (deletedMatrix[r][c]) {
                        const x = c * (noteSize + gapSize);
                        const y = r * (noteSize + gapSize);
                        let cutWidth = noteSize + (c < cols - 1 ? gapSize : 0);
                        let cutHeight = noteSize + (r < rows - 1 ? gapSize : 0);
                        ctx.clearRect(x, y, cutWidth, cutHeight);
                    }
                }
            }

            const maskDataUrl = maskCanvas.toDataURL();
            bgContainer.style.webkitMaskImage = `url(${maskDataUrl})`;
            bgContainer.style.maskImage = `url(${maskDataUrl})`;
        }

        // =====================================================================
        // 3D 自由便签（真 WebGL 曲面弯曲）
        // =====================================================================
        function create3DNoteInstance(container, size) {
            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(size, size);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
            // 相机钉在远处不动，姿态一律转纸（见 applyBendingToMesh 的 rotation.x）。
            // 参考页 调试器效果.html 也是这么做的。
            camera.position.set(0, 0, NOTE3D_DIST);

            const geometry = new THREE.PlaneGeometry(2.2, 2.2, 32, 32);
            const originalPositions = geometry.attributes.position.clone();

            const material = new THREE.MeshPhysicalMaterial({
                map: null,                 // 建好就立刻被 buildFusedTextureCanvas 烘的贴图替换
                side: THREE.DoubleSide,
                roughness: 0.85,
                transparent: true,
                opacity: 1.0
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            scene.add(mesh);

            scene.add(new THREE.AmbientLight(0xffffff, NOTE3D_AMBIENT));
            const dir = new THREE.DirectionalLight(0xffffff, NOTE3D_DIR);
            dir.position.set(...NOTE3D_LIGHT_POS);
            dir.castShadow = true;
            scene.add(dir);

            const shadowPlane = new THREE.Mesh(
                new THREE.PlaneGeometry(NOTE3D_SHADOW_SIZE, NOTE3D_SHADOW_SIZE),
                new THREE.ShadowMaterial({ opacity: NOTE3D_SHADOW_OPACITY })
            );
            shadowPlane.position.z = -0.05;
            shadowPlane.receiveShadow = true;
            scene.add(shadowPlane);

            // ---- 舞台相机的自动退让。显示屏那颗相机不跑这套，故意的 ----
            // 为什么要它：NOTE3D_DIST 是按【平板】定的 —— 纸占画布高 75%，四周各留
            // 25% 余量。但投影大小是 x' = x / ((d - z)·tan(fov/2)·aspect)，倾斜和卷角
            // 都会把顶点往镜头方向推（z 变大），d - z 跟着变小、投影被放大，那 25% 的
            // 余量被吃掉，角度一大纸就被画布边裁掉。
            //
            // 做法：拿【弯曲之后】的实际顶点求包围盒（卷角和收缩都已经烘进坐标里了），
            // 8 个角点逐个代入取景约束，取所需距离的最大值：
            //   |y| <= (d - z)·tan(fov/2)         ->  d >= z + |y| / tan(fov/2)
            //   |x| <= (d - z)·tan(fov/2)·aspect  ->  d >= z + |x| / (tan(fov/2)·aspect)
            // 最后和基准距离取大 —— 这一步是关键：静止时算出来 2.79 < 3.5408，相机
            // 纹丝不动，纸还是 120px，默认观感和以前逐像素一致；只有真会裁的角度相机
            // 才退，退多少刚好够。
            //
            // 代价：退让时纸的投影按比例缩小（60° 纯倾斜缩到 93%，25° 倾斜再加一个
            // 满卷角约 90%）。这是"装得下"本身的代价 —— 画布固定、相机固定时，投影
            // 比框大就只能裁，要装下就必须让投影变小。显示屏不跑这套，所以极端角度下
            // 两边不再一模一样，这是有意的：显示屏接受裁，舞台不裁。
            const _fitBox = new THREE.Box3();
            const _fitRot = new THREE.Matrix4();
            const _fitVec = new THREE.Vector3();
            const fitCamera = () => {
                _fitBox.setFromBufferAttribute(geometry.attributes.position);
                // 纸的姿态只由 mesh 的旋转决定（没有位移、没有缩放），乘一个纯旋转
                // 矩阵就够，不用绕 matrixWorld。
                _fitRot.makeRotationFromEuler(mesh.rotation);
                const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
                let need = 0;
                for (let i = 0; i < 8; i++) {
                    _fitVec.set(
                        (i & 1) ? _fitBox.max.x : _fitBox.min.x,
                        (i & 2) ? _fitBox.max.y : _fitBox.min.y,
                        (i & 4) ? _fitBox.max.z : _fitBox.min.z
                    ).applyMatrix4(_fitRot);
                    need = Math.max(need,
                        _fitVec.z + Math.abs(_fitVec.y) / tanV,
                        _fitVec.z + Math.abs(_fitVec.x) / (tanV * camera.aspect));
                }
                camera.position.z = Math.max(NOTE3D_DIST, need * NOTE3D_FIT_MARGIN);
            };

            return {
                renderer, scene, camera, geometry, originalPositions, material, mesh,
                updateMesh() {
                    applyBendingToMesh(this.geometry, this.originalPositions, this.mesh, this.params);
                    fitCamera();
                    this.renderer.render(this.scene, this.camera);
                }
            };
        }

        // 照抄 调试器效果.html 的连续曲面算法
        function applyBendingToMesh(geometry, originalPositions, mesh, p) {
            const pos = geometry.attributes.position;

            if (p.mode === 'corner') {
                const br = p.BR / 100, bl = p.BL / 100, tr = p.TR / 100, tl = p.TL / 100;
                for (let i = 0; i < pos.count; i++) {
                    const x = originalPositions.getX(i), y = originalPositions.getY(i);
                    const fBR = Math.max(0, x / 1.1) * Math.max(0, -y / 1.1) * br;
                    const fBL = Math.max(0, -x / 1.1) * Math.max(0, -y / 1.1) * bl;
                    const fTR = Math.max(0, x / 1.1) * Math.max(0, y / 1.1) * tr;
                    const fTL = Math.max(0, -x / 1.1) * Math.max(0, y / 1.1) * tl;
                    const zBend = (Math.pow(fBR, 1.5) + Math.pow(fBL, 1.5) + Math.pow(fTR, 1.5) + Math.pow(fTL, 1.5)) * 0.7;
                    pos.setZ(i, zBend);
                    pos.setX(i, x * (1 - zBend * 0.08));
                    pos.setY(i, y * (1 - zBend * 0.08));
                }
            } else {
                const bTop = p.Top / 100, bBottom = p.Bottom / 100, bLeft = p.Left / 100, bRight = p.Right / 100;
                for (let i = 0; i < pos.count; i++) {
                    const x = originalPositions.getX(i), y = originalPositions.getY(i);
                    const fTop = Math.max(0, y / 1.1) * bTop;
                    const fBottom = Math.max(0, -y / 1.1) * bBottom;
                    const fRight = Math.max(0, x / 1.1) * bRight;
                    const fLeft = Math.max(0, -x / 1.1) * bLeft;
                    const zBend = (Math.pow(fTop, 1.8) + Math.pow(fBottom, 1.8) + Math.pow(fRight, 1.8) + Math.pow(fLeft, 1.8)) * 0.55;
                    pos.setZ(i, zBend);
                    pos.setX(i, x * (1 - zBend * 0.06));
                    pos.setY(i, y * (1 - zBend * 0.06));
                }
            }

            geometry.computeVertexNormals();
            geometry.attributes.position.needsUpdate = true;
            mesh.rotation.z = THREE.MathUtils.degToRad(p.rotZ);
            // 俯仰必须转在纸上，不能只转相机：相机一转，纸和灯光的相对关系没变，
            // 卷角的高光/明暗就还是平的；参考页也是这么写的（paperMesh.rotation.x）。
            // 舞台那颗相机是钉死的，所以少了这一行，舞台上的纸永远正对镜头。
            mesh.rotation.x = -THREE.MathUtils.degToRad(p.rotX || 0);
        }

        // canvas 的 fillText 既不自动折行也不认 \n，得自己按宽度断。
        // 规则对齐 .note-text 的 white-space: pre-wrap + word-break: break-word：
        //   \n 强制换行；一行放不下时优先在空格处断；整段没有空格（中文）或者
        //   单个词自己就超宽，就逐字符断。逐字符用 for...of 走码点，
        //   这样 emoji、生僻字不会被从中间劈开。
        function wrapCanvasText(ctx, text, maxW) {
            const out = [];
            for (const para of String(text).split('\n')) {
                const paraStart = out.length;   // 这一段已经吐出去几行
                const words = para.split(/(\s+)/).filter(s => s !== '');
                let line = '';
                // 断行时行尾的空格丢掉，跟浏览器软换行的观感一致
                const pushLine = () => { out.push(line.replace(/\s+$/, '')); line = ''; };
                for (const w of words) {
                    if (/^\s+$/.test(w)) {
                        // 空白词是单词间的分隔，留着；段首那一串是缩进（pre-wrap
                        // 也留着），也得留着。软换行之后行首那个空格才是真该丢的 ——
                        // 它是断行断出来的，不是打出来的。
                        if (line || out.length === paraStart) line += w;
                        continue;
                    }
                    // 放不下就先把当前行收了（line 里一个字都没有时没什么可收的，跳过）。
                    // 判的是 trim 而不是 line 本身：段首那串缩进会让 line 非空但全是空白，
                    // 拿它去 pushLine 会挤出一行空行 —— 浏览器那边缩进是跟着首行走的。
                    if (line.trim() && ctx.measureText(line + w).width > maxW) pushLine();
                    if (ctx.measureText(w).width > maxW) {
                        // 这个词自己就超一整行 —— 中文整段没空格、或者超长的英文单词
                        // 都会走到这儿，逐字符拆。注意这一步不能放在上面那个
                        // if 里面：行首那个词同样可能是超宽的。
                        for (const ch of w) {
                            if (line.trim() && ctx.measureText(line + ch).width > maxW) pushLine();
                            line += ch;
                        }
                        continue;
                    }
                    line += w;
                }
                out.push(line);
            }
            return out;
        }

        // 一行字沿圆弧铺开 —— 便签文字的「弯曲」。调用方负责把 ctx 摆好：
        // (x, y) 是这一行不弯时的落笔点，textAlign 得是 center，字体字号也已经设好。
        //
        // 弯的是「行」不是「字」：每个字自己还是正的（glyph 不做拉伸/斜切），
        // 只是按弧长摆到弧上、再跟着弧的切线转一下 —— 就像一行字写在一张被掰弯的
        // 纸上。按弧长摆所以字间距不变，不会两边挤中间抻。
        //
        // 半径按字号算，不按行宽：一个便签里每行长短不一，按行宽算会变成长行弯得
        // 缓、短行弯得急，几行叠在一起看着不像同一张纸。行特别长时再兜一道
        // （total * 0.7），免得小字号长行绕过大半圈，两头的字倒过来。
        // bend > 0 向上弯，< 0 向下弯，绝对值是弯曲量，满量程 ±1。
        function drawTextLine(ctx, line, x, y, bend, fpx) {
            if (!line) return;
            if (!bend) { ctx.fillText(line, x, y); return; }      // 没弯就是原来那条路
            const chars = [...line];                              // 按码点拆，别把 emoji 劈两半
            // 逐字量宽再累加：弧长参数得是「这个字到行中心多少距离」，只能是逐字的。
            // 代价是少了字距微调（kerning），西文会比整行量出来略宽一点点 —— 中文没有
            // kerning，影响就到这里为止。
            const adv = chars.map((ch) => ctx.measureText(ch).width);
            const total = adv.reduce((a, b) => a + b, 0);
            const R = Math.max(fpx * 3, total * 0.7) / Math.abs(bend);
            const sgn = bend > 0 ? 1 : -1;
            const A = total / 2 / R;                              // 行首对应的圆心角
            let d = -total / 2;                                   // 这个字的左边缘，到行中心的距离
            for (let i = 0; i < chars.length; i++) {
                const a = (d + adv[i] / 2) / R;                   // 字心对应的圆心角，带正负
                d += adv[i];
                // 弧的两端落在原来那条基线上，中间才鼓出去 R(1-cosA) —— 跟掰弯一张
                // 纸条一样。（字是照切线摆的，所以最边上那个字的盒子外沿会差出一个
                // 亚像素的矢高，24px 字号满量程 0.6px，看不见）
                ctx.save();
                ctx.translate(x + R * Math.sin(a), y + sgn * R * (Math.cos(A) - Math.cos(a)));
                ctx.rotate(sgn * a);
                ctx.fillText(chars[i], 0, 0);
                ctx.restore();
            }
        }

        // 3D 便签的贴图：图案 + 纸纹 + 手写文字 烘焙到一张 canvas
        function buildFusedTextureCanvas(mat, callback) {
            const cvs = document.createElement('canvas');
            cvs.width = 512; cvs.height = 512;
            const ctx = cvs.getContext('2d');

            // 贴图是 512px，便签实际只有 unitBaseSize(120)px，所以 2D 那边的 px 值
            // 乘 K 才是贴图里的 px。以前文字分支写的是固定的 *2，等于把字缩到
            // 2 / 4.267 = 0.469 倍 —— 3D 便签的字看起来比 2D 小一半多，就是这个系数。
            const TEX = cvs.width;
            const K = TEX / unitBaseSize;     // ≈ 4.267
            const PAD = 6 * K;                // .note-text 的 padding: 6px

            const finish = (signImg) => {
                // 纸纹：参数和 2D 便签的 .texture-layer 逐条对应 ——
                //   mix-blend-mode: multiply  -> globalCompositeOperation = 'multiply'
                //   filter: grayscale(100%)   -> ctx.filter（贴图本身已纯灰，空转）
                //   opacity: 0.7              -> globalAlpha
                //   background-size: 100% 100%-> 贴图里就是 PAPER_TEX_DATA 这张全铺
                // 改一边记得改另一边，不然 2D 和 3D 的颗粒就会不一样。
                // 底下不铺任何算法杂色：2D 便签的底是 .sticky-img-inner 的纯 #ffffff，
                // 3D 这边也得是纯白，只靠这一层纸纹出颗粒。
                if (paperTexImg.complete && paperTexImg.naturalWidth) {
                    ctx.globalCompositeOperation = 'multiply';
                    ctx.globalAlpha = 0.7;
                    ctx.filter = 'grayscale(100%)';
                    ctx.drawImage(paperTexImg, 0, 0, 512, 512);
                    ctx.filter = 'none';
                    ctx.globalAlpha = 1.0;
                }
                if (signImg) {
                    // 手写签名：占据便签上「字」的那块地方 —— 也就是 .note-text 的
                    // 内容区（inset 0 再让开 6px 的 padding）
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.save();
                    ctx.translate(TEX / 2, TEX / 2);
                    ctx.rotate((mat.textRotZ || 0) * Math.PI / 180);
                    ctx.translate(-TEX / 2, -TEX / 2);
                    ctx.drawImage(signImg, PAD, PAD, TEX - PAD * 2, TEX - PAD * 2);
                    ctx.restore();
                } else if (mat.text && fontState === 'loading') {
                    // 同上：烘焙进贴图的字也得等字体到位，先画个静止的圈。
                    // 折行要靠 measureText 量宽度，字体没到位量出来的是 fallback 字体的
                    // 宽度，断行位置会跟 2D 对不上 —— 所以这一分支不能绕过去。
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.strokeStyle = 'rgba(0,0,0,0.28)';
                    ctx.lineWidth = 6;
                    ctx.beginPath();
                    ctx.arc(TEX / 2, TEX / 2, 26, -Math.PI / 2, Math.PI * 1.5);
                    ctx.stroke();
                } else if (mat.text) {
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.save();
                    ctx.translate(TEX / 2, TEX / 2);          // 原点挪到便签中心
                    ctx.rotate((mat.textRotZ || 0) * Math.PI / 180);

                    // 字号：2D 的 fontSize 打在 120px 的便签上，这边打在 512px 的贴图上，
                    // 所以要乘 K 才是同一个视觉大小。
                    const fpx = mat.fontSize * K;
                    ctx.font = `bold ${fpx}px ${fontStack()}`;
                    ctx.fillStyle = mat.textColor;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // 必须在设好 font 之后再量，否则量的是上一个字体
                    const lines = wrapCanvasText(ctx, mat.text, TEX - PAD * 2);
                    const lh = fpx * 1.25;                 // 对齐 .note-text 的 line-height: 1.25

                    // 整个文字块垂直居中，和 .note-text 的 flex 居中一致：
                    // 首行在块顶往下半个行高处，块高 = 行数 * 行距
                    let y = -(lines.length - 1) * lh / 2;
                    for (const line of lines) {
                        drawTextLine(ctx, line, 0, y, mat.bend || 0, fpx);
                        y += lh;                            // 空行也要占一行的高度
                    }
                    ctx.restore();
                }
                callback(new THREE.CanvasTexture(cvs));
            };

            // 贴图要等两个东西：底图，以及（手写模式下的）签名图。
            // 两个都到齐才 finish，不然签名会画在还没铺好的底上。
            const needSign = mat.textMode === 'sign' && mat.sign;
            let signImg = null;
            const done = () => finish(signImg);
            const start = () => {
                if (!needSign) return done();
                const im = new Image();
                im.onload = () => { signImg = im; done(); };
                im.onerror = () => done();
                im.src = mat.sign;
            };

            if (mat.matType === 'image' && mat.imageSrc) {
                const img = new Image();
                img.onload = () => { ctx.drawImage(img, 0, 0, 512, 512); start(); };
                img.src = mat.imageSrc;
            } else {
                ctx.fillStyle = mat.matType === 'color' ? mat.color : '#ffffff';
                ctx.fillRect(0, 0, 512, 512);
                start();
            }
        }

        function addFreeNote() {
            const el = document.createElement('div');
            el.className = 'sticky-node-3d';
            el.style.position = 'absolute';
            el.style.zIndex = '100';
            el.style.left = '40px';
            el.style.top = '40px';
            // 渲染框 160px，纸在里面占 120px —— 见 NOTE3D_BOX 的注释
            el.style.width = `${NOTE3D_BOX}px`;
            el.style.height = `${NOTE3D_BOX}px`;

            const noteObj = create3DNoteInstance(el, NOTE3D_BOX);
            const note = { el, noteObj, mat: defaultMat(), p3: default3D() };
            note.mat.matType = 'color';
            noteObj.params = note.p3;

            buildFusedTextureCanvas(note.mat, (tex) => {
                noteObj.material.map = tex;
                noteObj.material.needsUpdate = true;
                noteObj.updateMesh();
            });

            const delBtn = document.createElement('button');
            delBtn.className = 'node-action-btn btn-del-node';
            delBtn.textContent = '✕';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if (selected && selected.note === note) clearSelection();
                el.remove();
                freeNotes = freeNotes.filter(n => n !== note);
            };
            el.appendChild(delBtn);

            // 选中放在 pointerdown 上，不只挂在 click 上：拖拽那边 preventDefault()
            // 掉了 pointerdown，触屏下随之而来的兼容 click 不保证还会发。
            //
            // 手机上「点一下选中、再点一下取消」，跟舞台切片一致。两处都做开合的话
            // 一次点击会被翻两次、净效果为零，所以分工：pointerdown 只负责选中，
            // 并记下这一下之前它是不是已经选中；click 只在「之前就已选中」而且
            // 「几乎没移动」时才取消。
            // 那条位移判断是给拖拽让路的 —— 拖完 pointerup 之后 click 照样会发，
            // 不判位移的话，拖动一个已选中的便签会顺手把选中拖没。
            let wasSelected = false;
            let downX = 0, downY = 0;
            el.addEventListener('pointerdown', (e) => {
                wasSelected = !!(selected && selected.note === note);
                downX = e.clientX; downY = e.clientY;
                select3DNote(note);
            });
            el.addEventListener('click', (e) => {
                if (!wasSelected) return;
                wasSelected = false;
                if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
                clearSelection();
            });
            makeDraggable(el);

            stageContainer.appendChild(el);
            freeNotes.push(note);
        }

        // 自由便签的拖拽。走 pointer 事件而不是 mouse —— 手机上手指按下去不产生
        // mousedown，原来那套在触屏上完全没反应（pointer 事件对两者都通吃）。
        // 起点取一次、位移按起点算，不去读 offsetLeft：那个值会被浏览器取整，
        // 每帧回读一次还会顺带触发一次强制布局。
        function makeDraggable(el) {
            el.addEventListener('pointerdown', (e) => {
                if (e.target.classList.contains('node-action-btn')) return;
                e.preventDefault();
                const x0 = el.offsetLeft, y0 = el.offsetTop;
                const sx = e.clientX, sy = e.clientY;
                const move = (ev) => {
                    el.style.left = (x0 + (ev.clientX - sx)) + 'px';
                    el.style.top = (y0 + (ev.clientY - sy)) + 'px';
                };
                const up = () => {
                    window.removeEventListener('pointermove', move);
                    window.removeEventListener('pointerup', up);
                    window.removeEventListener('pointercancel', up);
                };
                window.addEventListener('pointermove', move);
                window.addEventListener('pointerup', up);
                window.addEventListener('pointercancel', up);
            });
        }

u+1EQsJdBPAAAAABJRU5ErkJggg==" }
            /*PIN_END*/
        ];

        const PIN_BASE = 120;        // scale=1 时，别针最长边的像素
        const PIN_MIN_SCALE = 0.2;
        const PIN_MAX_SCALE = 5;
        const PIN_UI_PAD = 6;        // 选中框比别针外扩多少（虚线框 + 角上的按钮就落在这圈上）

        let pinNotes = [];
        let selectedPin = null;
        let pinZ = 300;              // 别针压在便利贴（z-index 100）上面
        // 按素材 id 缓存长宽比。早先按下标缓存，现在素材是动态的（用户能加能删），
        // 下标会串位，只能拿 id 当键。
        const pinSizes = new Map();

        // 把某一项的长宽比量出来存进 pinSizes，顺手把图解码进内存 ——
        // 解码过之后 createPin 里那个 <img> 拿到同一个 URL 就能立刻画出来。
        // 正在量的 id 记在 pinWarming 里，别为同一张图反复起 probe。
        const pinWarming = new Set();
        function warmPinSize(item) {
            if (pinWarming.has(item.id) || pinSizes.has(item.id)) return;
            pinWarming.add(item.id);
            const probe = new Image();
            probe.onload = () => {
                pinWarming.delete(item.id);
                const r = (probe.naturalWidth / probe.naturalHeight) || 1;
                const size = r >= 1 ? { w: PIN_BASE, h: PIN_BASE / r }
                                    : { w: PIN_BASE * r, h: PIN_BASE };
                pinSizes.set(item.id, size);
                // 万一有人抢在解码前就把它点上台了：台上那几枚当场改成正确比例
                pinNotes.filter(p => p.item === item).forEach((p) => {
                    p.w = size.w; p.h = size.h;
                    applyPinTransform(p);
                });
            };
            probe.onerror = () => pinWarming.delete(item.id);
            probe.src = stickerSrc(item);
        }

        function pinSize(item) {
            let size = pinSizes.get(item.id);
            if (!size) {
                // 库里那个格子已经把同一份图加载过了，这里通常能直接同步拿到尺寸
                const probe = new Image();
                probe.src = stickerSrc(item);
                const r = (probe.naturalWidth / probe.naturalHeight) || 1;
                size = r >= 1 ? { w: PIN_BASE, h: PIN_BASE / r }
                              : { w: PIN_BASE * r, h: PIN_BASE };
                // 图还没解码完时 naturalWidth 是 0，0/0 得 NaN 被 || 1 兜成 1 ——
                // 量出来的是个假的 120×120 方框。这种值千万不能写进缓存：pinSizes
                // 只在把素材从库里删掉时才清，写错了这张图这一整个会话就都是方的。
                // 先拿它顶着，同时排一个 warmPinSize，等真尺寸出来再改。
                if (probe.naturalWidth) pinSizes.set(item.id, size);
                else warmPinSize(item);
            }
            return size;
        }

        // 把尺寸、位置、角度一次性写进 DOM。
        // 注意控件层的尺寸用的是「显示尺寸」(w×scale)，所以它自己不再缩放 ——
        // 反向缩放会让按钮的 translate 偏移也跟着被放大，越大的别针按钮越偏。
        function applyPinTransform(pin) {
            const dw = pin.w * pin.scale, dh = pin.h * pin.scale;
            pin.el.style.left = pin.x + 'px';
            pin.el.style.top = pin.y + 'px';

            pin.img.style.width = pin.w + 'px';
            pin.img.style.height = pin.h + 'px';
            pin.img.style.transform =
                `translate(-50%, -50%) rotate(${pin.rot}deg) scale(${pin.scale})`;

            pin.ui.style.width = (dw + PIN_UI_PAD * 2) + 'px';
            pin.ui.style.height = (dh + PIN_UI_PAD * 2) + 'px';
            pin.ui.style.transform = `translate(-50%, -50%) rotate(${pin.rot}deg)`;

            // 按钮反着转回来，保持正立。控件层没有缩放，所以这里不需要反向缩放。
            const back = `translate(-50%, -50%) rotate(${-pin.rot}deg)`;
            pin.ctls.forEach(c => { c.style.transform = back; });
        }

        function bringPinToFront(pin) {
            pin.z = ++pinZ;
            pin.el.style.zIndex = pin.z;
        }

        function deselectPins() {
            if (!selectedPin) return;
            selectedPin.el.classList.remove('selected');
            selectedPin = null;
        }

        function selectPin(pin) {
            if (selectedPin === pin) return;
            // 顺序要紧：clearSelection() 会把页面上「所有」.selected 摘掉，
            // 包括别针刚加上的那个，所以必须先清便利贴、再给别针加。
            // 别针没有材质/翘角参数可调，右侧面板留空即可，
            // 否则会继续显示上一个便利贴的数据，看着像是别针的。
            clearSelection();
            deselectPins();
            selectedPin = pin;
            pin.el.classList.add('selected');
            bringPinToFront(pin);
        }

        // 别针中心在屏幕上的位置。.pin-sticker 是 0×0 的锚点，
        // 所以它自己的矩形就是一个点，不用去算缩放旋转后的包围盒。
        function pinCenter(pin) {
            const r = pin.el.getBoundingClientRect();
            return { x: r.left, y: r.top };
        }

        // 统一的拖拽：按下时记起点，移动时只把「屏幕位移」交给回调，
        // 旋转缩放的具体换算留在各自的回调里
        // 正在进行的拖拽怎么撤。双指手势开始时要把单指那条拖拽掐掉 ——
        // 不然第一根手指还在拖位置、第二根手指已经在缩放旋转，两边同时改同一个别针。
        let pinDragAbort = null;

        function pinDrag(e, onMove, onEnd) {
            e.preventDefault();
            const sx = e.clientX, sy = e.clientY;
            const move = (ev) => onMove(ev.clientX - sx, ev.clientY - sy, ev);
            const up = () => {
                window.removeEventListener('pointermove', move);
                window.removeEventListener('pointerup', up);
                window.removeEventListener('pointercancel', up);
                pinDragAbort = null;
                if (onEnd) onEnd();
            };
            window.addEventListener('pointermove', move);
            window.addEventListener('pointerup', up);
            window.addEventListener('pointercancel', up);
            pinDragAbort = up;
        }

        // =====================================================================
        // 双指缩放 / 旋转（触屏）
        // =====================================================================
        // 手机上右下角那个缩放手柄只有 24px，两根手指捏合自然得多。
        // 落点不限在贴纸上：别针本体是 0×0 的锚点，能接事件的只有里面那张图，
        // 手机上撑死 80px 见方，两根手指挤不进去。所以规矩是「只要台上有选中的
        // 别针，在舞台范围内随便哪里双指都能缩放旋转它」。
        // 只管缩放和旋转，不管移动 —— 移动仍然只有单指拖这一条路。
        //
        // 舞台外面的东西一概不算：顶栏、素材库面板、右侧面板都在 .stage-container
        // 之外，它们的 pointerdown 不会冒泡到这里，所以在那些地方做双指手势
        // 不会误操作到贴纸。反过来，确实也没法一边捏合一边滚页面 ——
        // .stage-container 上的 touch-action: pan-x pan-y 就是为这个写的。
        const gesturePts = new Map();   // pointerId -> 落点，只收落在舞台上的手指
        let gestureBase = null;         // 手势基准量；null = 当前没有双指手势
        let gestureUsed = false;        // 这一轮触摸里发生过双指手势（空白处取消选中要看它）

        function gesturePair() {
            const it = [...gesturePts.values()];
            return it.length >= 2 ? [it[0], it[1]] : null;
        }

        function gestureBegin() {
            const pair = gesturePair();
            if (!pair || gestureBase || !selectedPin) return;
            // 第一根手指落下来时可能已经把别针拖起来了，撤掉那条拖拽，改由手势接管
            if (pinDragAbort) pinDragAbort();
            const [a, b] = pair;
            gestureBase = {
                pin: selectedPin,
                d: Math.hypot(b.x - a.x, b.y - a.y) || 1,
                a: Math.atan2(b.y - a.y, b.x - a.x),
                scale: selectedPin.scale,
                rot: selectedPin.rot
            };
            gestureUsed = true;
        }

        stageContainer.addEventListener('pointerdown', (e) => {
            if (gesturePts.size === 0) gestureUsed = false;   // 新一轮触摸，重新计
            gesturePts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            gestureBegin();          // 第二根手指落下的这一下才真正开始
        });

        window.addEventListener('pointermove', (e) => {
            if (!gesturePts.has(e.pointerId)) return;
            gesturePts.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (!gestureBase) return;
            const pair = gesturePair();
            if (!pair) return;
            const [a, b] = pair;
            const p = gestureBase.pin;
            const d = Math.hypot(b.x - a.x, b.y - a.y) || 1;
            const ang = Math.atan2(b.y - a.y, b.x - a.x);
            // 缩放跟着两指距离的比值走，旋转跟着两指连线的转角走 ——
            // 都是相对「手势开始那一刻」算的，不是逐帧累加，所以中途松开一根
            // 再重新捏合不会漂。上下限跟右下角那个手柄共用一套常量。
            p.scale = Math.min(PIN_MAX_SCALE,
                Math.max(PIN_MIN_SCALE, gestureBase.scale * (d / gestureBase.d)));
            p.rot = gestureBase.rot + (ang - gestureBase.a) * 180 / Math.PI;
            applyPinTransform(p);
        });

        function gestureEnd(e) {
            if (!gesturePts.delete(e.pointerId)) return;
            // 松掉一根就整段结束，剩下那根不接着用 —— 否则松手后继续拖会突然又转起来
            if (gesturePts.size < 2) gestureBase = null;
        }
        window.addEventListener('pointerup', gestureEnd);
        window.addEventListener('pointercancel', gestureEnd);

        // 控件里的图标。内联 SVG，不引图标库；颜色写死在 stroke 上，尺寸按按钮内径给。
        const ICON_COPY =
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#007bff"' +
            ' stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
            '<rect x="9" y="9" width="12" height="12" rx="2.5"/>' +
            '<path d="M5.5 15h-1A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5v1"/>' +
            '</svg>';
        const ICON_TRASH =
            '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff"' +
            ' stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M3.5 6.5h17"/>' +
            '<path d="M8.5 6.5V4.8A1.8 1.8 0 0 1 10.3 3h3.4a1.8 1.8 0 0 1 1.8 1.8v1.7"/>' +
            '<path d="M6 6.5l1 13.2A1.8 1.8 0 0 0 8.8 21.5h6.4A1.8 1.8 0 0 0 17 19.7l1-13.2"/>' +
            '<path d="M10.3 10.5v6.5M13.7 10.5v6.5"/>' +
            '</svg>';

        function createPin(item, preset) {
            const size = preset || pinSize(item);
            const el = document.createElement('div');
            el.className = 'pin-sticker';

            const img = document.createElement('img');
            img.className = 'pin-img';
            img.src = stickerSrc(item);
            // 兜底句子，不是名字：图真裂了浏览器会把 alt 当正文画出来（导出也照抄），
            // 写文件名就等于在舞台上贴一串 IMG_2026….jpg。名字只在 item.label 里躺着。
            img.alt = '贴纸素材';
            img.draggable = false;

            const ui = document.createElement('div');
            ui.className = 'pin-ui';
            ui.innerHTML =
                '<button class="pin-ctl pin-copy" title="复制">' + ICON_COPY + '</button>' +
                '<button class="pin-ctl pin-del" title="删除">' + ICON_TRASH + '</button>' +
                '<div class="pin-ctl pin-handle pin-scale" title="拖动缩放"></div>' +
                '<div class="pin-ctl pin-handle pin-rotate" title="拖动旋转（按住 Shift 吸附 15°）"></div>';
            const [copyBtn, delBtn, scaleH, rotateH] = ui.children;

            el.append(img, ui);

            const pin = {
                el, img, ui, item,
                w: size.w, h: size.h,
                // 落在舞台中央，带一点随机抖动和初始倾斜：连点几个不会完全叠住，
                // 微微歪着也更像手工拼贴。想要绝对规整就把这两个随机量去掉。
                x: stageContainer.clientWidth / 2 + (Math.random() * 140 - 70),
                y: stageContainer.clientHeight / 2 + (Math.random() * 140 - 70),
                scale: 1,
                rot: Math.random() * 14 - 7,
                z: 0
            };
            pin.ctls = [copyBtn, delBtn, scaleH, rotateH];
            applyPinTransform(pin);

            // --- 拖本体 = 移动位置 ---
            el.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.pin-ctl')) return;   // 角上的按钮有自己的活
                selectPin(pin);
                const x0 = pin.x, y0 = pin.y;
                pinDrag(e, (dx, dy) => {
                    pin.x = x0 + dx;
                    pin.y = y0 + dy;
                    applyPinTransform(pin);
                });
            });

            // --- 拖右下角 = 绕中心缩放 ---
            scaleH.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                selectPin(pin);
                const c = pinCenter(pin);
                const d0 = Math.hypot(e.clientX - c.x, e.clientY - c.y) || 1;
                const s0 = pin.scale;
                pinDrag(e, (dx, dy, ev) => {
                    const d = Math.hypot(ev.clientX - c.x, ev.clientY - c.y);
                    pin.scale = Math.min(PIN_MAX_SCALE,
                        Math.max(PIN_MIN_SCALE, s0 * (d / d0)));
                    applyPinTransform(pin);
                });
            });

            // --- 拖下方圆点 = 绕中心旋转 ---
            rotateH.addEventListener('pointerdown', (e) => {
                e.stopPropagation();
                selectPin(pin);
                const c = pinCenter(pin);
                const a0 = Math.atan2(e.clientY - c.y, e.clientX - c.x);
                const r0 = pin.rot;
                pinDrag(e, (dx, dy, ev) => {
                    const a = Math.atan2(ev.clientY - c.y, ev.clientX - c.x);
                    let deg = r0 + (a - a0) * 180 / Math.PI;
                    if (ev.shiftKey) deg = Math.round(deg / 15) * 15;
                    pin.rot = deg;
                    applyPinTransform(pin);
                });
            });

            copyBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
            copyBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                // 复制体往右下错开一点，不然正好压在原件上看不出多了一个
                const copy = createPin(pin.item, { w: pin.w, h: pin.h });
                copy.x = pin.x + 26;
                copy.y = pin.y + 26;
                copy.scale = pin.scale;
                copy.rot = pin.rot;
                applyPinTransform(copy);
                selectPin(copy);
            });

            delBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
            delBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (selectedPin === pin) selectedPin = null;
                el.remove();
                pinNotes = pinNotes.filter(n => n !== pin);
            });

            stageContainer.appendChild(el);
            pinNotes.push(pin);
            selectPin(pin);
            return pin;
        }

        // =====================================================================
        // 贴纸素材库
        // =====================================================================
        // 内置的 4 个别针和用户上传的素材排在一个列表里。每项的形状：
        //   内置 —— { id, label, builtin: true, src: 'data:...' }
        //   上传 —— { id, label, builtin: false, orig: Blob, matted: Blob|null, useMatted }
        // 上传项的 URL 不预先建：原图 / 抠图两版各按需建一次 objectURL 挂在自己身上复用，
        // 来回拨那个开关才不会每拨一次就新建一个，把内存攒爆。
        function stickerSrc(item) {
            if (item.builtin) return item.src;
            if (!item._urlOrig) item._urlOrig = URL.createObjectURL(item.orig);
            if (!item.matted) return item._urlOrig;
            if (!item._urlMatted) item._urlMatted = URL.createObjectURL(item.matted);
            return item.useMatted ? item._urlMatted : item._urlOrig;
        }

        const BUILTIN_ITEMS = PIN_SOURCES.map((p, i) => ({
            id: 'builtin-' + i, label: p.label, builtin: true, src: p.src,
        }));
        let userItems = [];
        const libItems = () => BUILTIN_ITEMS.concat(userItems);

        // ---- IndexedDB ----
        // file:// 下 IndexedDB 是能用的（Edge/Chrome 都放行，配额按 GB 算），
        // 但 file:// 属于不透明源、所有本地 html 共用同一个库。对个人小工具无所谓，
        // 只是要清楚：它图的是「方便」，不是「备份」—— 清浏览器数据就没了。
        const STICKER_DB = 'stickerLib';
        const STICKER_STORE = 'stickers';
        let stickerDB = null;

        function openStickerDB() {
            if (stickerDB) return Promise.resolve(stickerDB);
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(STICKER_DB, 1);
                req.onupgradeneeded = () => {
                    const db = req.result;
                    if (!db.objectStoreNames.contains(STICKER_STORE)) {
                        db.createObjectStore(STICKER_STORE, { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => { stickerDB = req.result; resolve(stickerDB); };
                req.onerror = () => reject(req.error);
            });
        }

        function stickerTx(mode, fn) {
            return openStickerDB().then((db) => new Promise((resolve, reject) => {
                const tx = db.transaction(STICKER_STORE, mode);
                const req = fn(tx.objectStore(STICKER_STORE));
                // 等事务提交再 resolve：put 的请求成功不等于数据已经落盘
                tx.oncomplete = () => resolve(req ? req.result : undefined);
                tx.onerror = () => reject(tx.error);
                tx.onabort = () => reject(tx.error);
            }));
        }
        const dbAllStickers = () => stickerTx('readonly', (s) => s.getAll());
        const dbPutSticker = (rec) => stickerTx('readwrite', (s) => s.put(rec));
        const dbDelSticker = (id) => stickerTx('readwrite', (s) => s.delete(id));

        // ---- 面板开关 ----
        const stickerWrap = document.getElementById('stickerWrap');
        const btnSticker = document.getElementById('btnSticker');
        const stickerLib = document.getElementById('stickerLib');
        let stickerCloseTimer = null;

        function openStickerLib() {
            clearTimeout(stickerCloseTimer);
            stickerWrap.classList.add('open');
            btnSticker.setAttribute('aria-expanded', 'true');
        }
        function closeStickerLib() {
            clearTimeout(stickerCloseTimer);
            stickerWrap.classList.remove('open');
            btnSticker.setAttribute('aria-expanded', 'false');
        }
        // 延迟关闭。鼠标从按钮挪到面板的途中有一瞬间两边都不在，
        // 没有这个缓冲就会「路过即关」，格子根本点不到。
        function delayedCloseStickerLib() {
            clearTimeout(stickerCloseTimer);
            stickerCloseTimer = setTimeout(closeStickerLib, 220);
        }

        // 悬停开、移开延迟关 —— 只挂在真有悬停的设备上。
        // 触屏上手指按下去就算「进入」，浏览器会先发一个 pointerenter，
        // 紧接着 pointerup 之后又发 pointerleave（手指离开了），最后才轮到 click。
        // 三条撞在一起的结果是：按下即开 → 排一个 220ms 后关 → click 一看是开着的
        // 又把它关掉，一次点击净效果是「什么都没发生」。所以触屏只留 click 那次开合，
        // 悬停这套在这儿根本不挂。
        if (window.matchMedia('(hover: hover)').matches) {
            stickerWrap.addEventListener('pointerenter', openStickerLib);
            stickerWrap.addEventListener('pointerleave', delayedCloseStickerLib);
        }
        // 触屏没有悬停，所以按钮本身也能点着开合
        btnSticker.addEventListener('click', (e) => {
            e.stopPropagation();
            if (stickerWrap.classList.contains('open')) closeStickerLib();
            else openStickerLib();
        });
        document.addEventListener('pointerdown', (e) => {
            if (!stickerWrap.contains(e.target)) closeStickerLib();
        });

        // ---- 面板渲染 ----
        const ICON_PLUS24 =
            '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
            ' stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
        const ICON_X10 =
            '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor"' +
            ' stroke-width="3.4" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>';

        // 点素材 = 加到舞台上。素材库平时不出声：图上了台就是回执，何况库里已经不显示
        // 名字了，报一句「已添加 XXX」等于念一个你没见过的名字。
        // 唯一的出口是失败。素材的 Blob 没了（清过浏览器数据、库里留下半条记录）时，
        // stickerSrc 要么当场抛错，要么造出一个 src 是死的 img —— 后者浏览器会把 alt
        // 当正文画在舞台上，正是「导出来是文件名」的那张脸。两条都接住，把坏别针撤掉
        // 再说话。
        function addStickerToStage(item) {
            let pin;
            try {
                pin = createPin(item);
            } catch (err) {
                console.warn('素材上台失败：', err);
                showToast('加载失败');
                return;
            }
            pin.img.addEventListener('error', () => {
                if (selectedPin === pin) selectedPin = null;
                pin.el.remove();
                pinNotes = pinNotes.filter((n) => n !== pin);
                showToast('加载失败');
            });
        }

        function renderStickerLib() {
            stickerLib.innerHTML = '';
            libItems().forEach((item) => {
                const tile = document.createElement('div');
                tile.className = 'sticker-tile';
                // 名字不上界面，悬停提示也不给（原来 title 报的就是名字）。缩略图同样
                // 不给 alt —— 图一裂浏览器就把 alt 当文字画出来，又是满屏文件名。名字
                // 还在 item.label 里（库记录用它），只是不摆出来了。

                const im = document.createElement('img');
                // 库里某条记录的 Blob 没了的话，stickerSrc 这里就会抛。接住它，只让这
                // 一格空着，别把后面几格连「＋」一起带走；点它时再跳失败提示。
                try {
                    im.src = stickerSrc(item);
                } catch (err) {
                    console.warn('素材缩略图加载失败：', err);
                }
                im.alt = '';
                im.draggable = false;
                tile.appendChild(im);

                tile.addEventListener('click', () => addStickerToStage(item));

                // 删除入口只给上传的素材：内置那 4 个是代码里写死的，删了也没法恢复
                if (!item.builtin) {
                    const kill = document.createElement('button');
                    kill.className = 'sticker-kill';
                    kill.title = '从素材库删除';
                    kill.innerHTML = ICON_X10;
                    kill.addEventListener('pointerdown', (e) => e.stopPropagation());
                    kill.addEventListener('click', (e) => {
                        e.stopPropagation();
                        removeSticker(item);
                    });
                    tile.appendChild(kill);
                }
                stickerLib.appendChild(tile);
            });

            // 「＋」永远排在最后。字写在格子里，不靠 title ——
            // 库里别的格子是素材缩略图（没地方放字），这个是动作，得有字
            const add = document.createElement('div');
            add.className = 'sticker-tile sticker-tile-add';
            add.innerHTML = ICON_PLUS24 + '<span class="sticker-add-cap">导入</span>';
            add.addEventListener('click', startStickerImport);
            stickerLib.appendChild(add);
        }

        function removeSticker(item) {
            userItems = userItems.filter((x) => x !== item);
            // 舞台上还有别针在用这张图的话，URL 不能撤 —— 撤了图就当场裂掉。
            // 这种就让它多留一份，等页面关掉自然回收。
            const inUse = pinNotes.some((p) => p.item === item);
            if (!inUse) {
                if (item._urlOrig) URL.revokeObjectURL(item._urlOrig);
                if (item._urlMatted) URL.revokeObjectURL(item._urlMatted);
            }
            pinSizes.delete(item.id);
            dbDelSticker(item.id).catch(() => {});
            renderStickerLib();
            // 不出声：格子当场没了就是回执。名字本来也不在界面上，报出来没人对得上号。
        }

        // =====================================================================
        // 导入素材：选文件 → 裁剪 → 问要不要抠图 → 预览+开关 → 入库
        // =====================================================================
        const importModal = document.getElementById('importModal');
        const impPreview = document.getElementById('impPreview');
        const impTitle = document.getElementById('impTitle');
        const impHint = document.getElementById('impHint');
        const impAsk = document.getElementById('impAsk');
        const impSwitch = document.getElementById('impSwitch');
        const impConfirm = document.getElementById('impConfirm');
        const btnMatteToggle = document.getElementById('btnMatteToggle');
        let importState = null;
        let pendingName = '';

        function startStickerImport() {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'image/*';
            inp.addEventListener('change', () => {
                const f = inp.files && inp.files[0];
                if (!f) return;
                pendingName = (f.name || '').replace(/\.[^.]+$/, '') || '我的素材';
                const url = URL.createObjectURL(f);
                const img = new Image();
                img.onload = () => {
                    URL.revokeObjectURL(url);
                    // 素材走自由选框那一套（openFreeCrop）：框没有固定比例，能在图上拖和拉，
                    // 默认整张图。另外三个导入口的框都带固定比例，继续用 openCropModal。
                    // out.size 收一下：素材最终只是几十像素的贴纸，存 1400px 足够，
                    // 再大只会让 IndexedDB 和抠图都白白变慢。
                    openFreeCrop(img, beginMatteChoice, null,
                                 { size: 1400, type: 'image/png' });
                };
                img.onerror = () => { URL.revokeObjectURL(url); showToast('这张图打不开'); };
                img.src = url;
            });
            inp.click();
        }

        function beginMatteChoice(dataUrl) {
            const img = new Image();
            img.onload = () => {
                importState = { img, origUrl: dataUrl, mattedUrl: null, mattedBlob: null,
                                useMatted: true, name: pendingName };
                impPreview.src = dataUrl;
                impTitle.textContent = '导入贴纸';
                // 白底那句提示只归这一步。抠图失败退回来时也走这里，所以要显式打开，
                // 不能只靠「打开弹窗时它是初始状态」。
                impHint.hidden = false;
                impAsk.hidden = false;
                impSwitch.hidden = true;
                impConfirm.hidden = true;
                importModal.style.display = 'flex';
            };
            img.onerror = () => showToast('裁剪结果读不出来');
            img.src = dataUrl;
        }

        // 「点击抠图」
        async function runMatteImport() {
            if (!importState) return;
            // 提示跟着这一步一起收掉：接下来是「抠图 / 原图」那一页，不再讲白底
            impHint.hidden = true;
            impAsk.hidden = true;
            impTitle.textContent = '正在抠图…';
            // 抠图是同步的一大段计算，会把主线程占满。先让浏览器把上面这两句画出来，
            // 否则「正在抠图…」要等算完才出现，等于没提示。

        // =====================================================================
        // 浏览器版抠图
        // =====================================================================
        // 照搬 抠图工具.py 的四步：
        //   1. 从四边洪泛填充，跟边界连通的近白像素判为背景
        //   2. 剩下那些「被围住的近白块」按外接框填充率分：镂空孔挖掉，金属高光条留下
        //   3. 羽化 alpha
        //   4. 去白边（半透明像素里混进去的白底减掉）
        // 跟 Python 版的差别：不做 2× 放大（浏览器里原图一般已经够大），
        // 也不追求跟 OpenCV 逐像素一致 —— 边缘会有些许出入。
        const CUT_WHITE = 236;      // 判定「白」的通道下限
        const CUT_MIN_AREA = 50;    // 前景块最小面积，比这小的当噪点
        const CUT_MIN_HOLE = 200;   // 镂空孔最小面积
        const CUT_HOLE_FILL = 0.35; // 填充率分界：镂空孔 ≥0.35，金属高光条 ≤0.20
        const CUT_DARK_MIN = 170;   // 块里最暗的像素要比这更暗，否则判为水印/灰渍
        const CUT_FAINT_MAX = 200;  // 但「不够暗就算水印」这条只对小碎块生效，见下
        const CUT_FEATHER = 1;      // 羽化半径（像素）
        const CUT_MAX_SIDE = 1600;  // 工作分辨率上限，纯粹为了控住计算时间
        const clamp255 = (v) => Math.max(0, Math.min(255, Math.round(v)));

        // 4 邻接连通块。label 里 0 表示不属于任何块。
        // 传了 lum 就顺带统计每块最暗的像素值 —— 水印和灰渍整块都不够暗，靠这个挑掉。
        function labelComponents(mask, w, h, lum) {
            const n = w * h;
            const label = new Int32Array(n);
            const stack = new Int32Array(n);   // 每个像素最多入栈一次，n 个位置够用
            const stats = [];
            let next = 0;
            for (let start = 0; start < n; start++) {
                if (!mask[start] || label[start]) continue;
                const id = ++next;
                let sp = 0;
                stack[sp++] = start;
                label[start] = id;
                let area = 0, minX = w, minY = h, maxX = -1, maxY = -1, darkest = 255;
                while (sp > 0) {
                    const p = stack[--sp];
                    const y = (p / w) | 0, x = p - y * w;
                    area++;
                    if (x < minX) minX = x;
                    if (x > maxX) maxX = x;
                    if (y < minY) minY = y;
                    if (y > maxY) maxY = y;
                    if (lum && lum[p] < darkest) darkest = lum[p];
                    if (x > 0     && mask[p - 1] && !label[p - 1]) { label[p - 1] = id; stack[sp++] = p - 1; }
                    if (x < w - 1 && mask[p + 1] && !label[p + 1]) { label[p + 1] = id; stack[sp++] = p + 1; }
                    if (y > 0     && mask[p - w] && !label[p - w]) { label[p - w] = id; stack[sp++] = p - w; }
                    if (y < h - 1 && mask[p + w] && !label[p + w]) { label[p + w] = id; stack[sp++] = p + w; }
                }
                stats.push({ id, area, minX, minY, maxX, maxY, darkest });
            }
            return { label, stats };
        }

        // 可分离箱式模糊，跑两遍近似高斯。只用来把 alpha 边缘软一下。
        function boxBlur(a, w, h, r, passes) {
            if (r < 1) return;
            const tmp = new Float32Array(a.length);
            const win = r * 2 + 1;
            const cl = (v, hi) => v < 0 ? 0 : (v > hi ? hi : v);
            for (let pass = 0; pass < passes; pass++) {
                for (let y = 0; y < h; y++) {
                    const row = y * w;
                    let sum = 0;
                    for (let x = -r; x <= r; x++) sum += a[row + cl(x, w - 1)];
                    for (let x = 0; x < w; x++) {
                        tmp[row + x] = sum / win;
                        sum += a[row + cl(x + r + 1, w - 1)] - a[row + cl(x - r, w - 1)];
                    }
                }
                for (let x = 0; x < w; x++) {
                    let sum = 0;
                    for (let y = -r; y <= r; y++) sum += tmp[cl(y, h - 1) * w + x];
                    for (let y = 0; y < h; y++) {
                        a[y * w + x] = sum / win;
                        sum += tmp[cl(y + r + 1, h - 1) * w + x] - tmp[cl(y - r, h - 1) * w + x];
                    }
                }
            }
        }

        function cutoutToBlob(img) {
            const k = Math.min(1, CUT_MAX_SIDE / Math.max(img.width, img.height));
            const W = Math.max(1, Math.round(img.width * k));
            const H = Math.max(1, Math.round(img.height * k));
            const cvs = document.createElement('canvas');
            cvs.width = W; cvs.height = H;
            const ctx = cvs.getContext('2d', { willReadFrequently: true });
            // 先铺一层白底再画。源图如果自带透明（比如拿一张已经抠过的图再来抠一遍），
            // 直接画上去透明区会留着，下面「近白=背景」那套判断就落空了。
            ctx.fillStyle = '#fff';
            ctx.fillRect(0, 0, W, H);
            ctx.drawImage(img, 0, 0, W, H);

            const id = ctx.getImageData(0, 0, W, H);
            const d = id.data;
            const n = W * H;

            // --- 近白掩码 + 亮度 ---
            const nearWhite = new Uint8Array(n);
            const lum = new Uint8Array(n);
            for (let i = 0, p = 0; i < n; i++, p += 4) {
                const r = d[p], g = d[p + 1], b = d[p + 2];
                const mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
                nearWhite[i] = mn >= CUT_WHITE ? 1 : 0;
                lum[i] = (r * 299 + g * 587 + b * 114) / 1000 | 0;
            }

            // --- 1. 从四边洪泛，跟边界连通的近白像素 = 背景 ---
            const isBg = new Uint8Array(n);
            const stack = new Int32Array(n);
            let sp = 0;
            const push = (i) => { if (nearWhite[i] && !isBg[i]) { isBg[i] = 1; stack[sp++] = i; } };
            for (let x = 0; x < W; x++) { push(x); push((H - 1) * W + x); }
            for (let y = 0; y < H; y++) { push(y * W); push(y * W + W - 1); }
            while (sp > 0) {
                const p = stack[--sp];
                const y = (p / W) | 0, x = p - y * W;
                if (x > 0) push(p - 1);
                if (x < W - 1) push(p + 1);
                if (y > 0) push(p - W);
                if (y < H - 1) push(p + W);
            }

            // --- 2. 被围住的近白块：镂空孔挖掉，高光条留下 ---
            // 这两样颜色一模一样，只能靠形状分：镂空孔是实心的一块（填充率高），
            // 高光条是细长条（填充率低）。星形回形针中间那个孔就归这类。
            const holeMask = new Uint8Array(n);
            for (let i = 0; i < n; i++) holeMask[i] = (nearWhite[i] && !isBg[i]) ? 1 : 0;
            const holes = labelComponents(holeMask, W, H);
            const holeIds = new Set();
            for (const st of holes.stats) {
                if (st.area < CUT_MIN_HOLE) continue;
                const bw = st.maxX - st.minX + 1, bh = st.maxY - st.minY + 1;
                if (st.area / (bw * bh) < CUT_HOLE_FILL) continue;
                holeIds.add(st.id);
            }
            for (let i = 0; i < n; i++) {
                const lb = holes.label[i];
                if (lb && holeIds.has(lb)) isBg[i] = 1;
            }

            // --- 3. 前景块：太小、或整块都不够暗的，判为噪点/水印 ---
            const fgMask = new Uint8Array(n);
            for (let i = 0; i < n; i++) fgMask[i] = isBg[i] ? 0 : 1;
            const fg = labelComponents(fgMask, W, H, lum);
            const dropIds = new Set();
            for (const st of fg.stats) {
                if (st.area < CUT_MIN_AREA) { dropIds.add(st.id); continue; }
                // 整块都不够暗 → 大概率是水印或灰渍。但这条只对「小块」成立：
                // 一块面积很大的浅色区域（白贴纸、米色纸片、浅灰素材）本来就该留着，
                // 一刀切会把它整个抹掉。抠图工具.py 里没这个问题 —— 那边只处理特定几张
                // 别针照片，高光条总跟暗色金属丝连成一块，块里有暗像素，判不死；
                // 换成通用导入器就撞上了。
                if (st.darkest > CUT_DARK_MIN && st.area < CUT_FAINT_MAX) dropIds.add(st.id);
            }

            const alpha = new Float32Array(n);
            const hard = new Uint8Array(n);
            for (let i = 0; i < n; i++) {
                const lb = fg.label[i];
                if (lb && !dropIds.has(lb)) { hard[i] = 1; alpha[i] = 255; }
            }
            boxBlur(alpha, W, H, CUT_FEATHER, 2);
            // 羽化只该作用在边界上。上面那一下是把整片都糊了 —— 大片实心的内部糊完还是 255，
            // 看不出问题，但**细特征的核心会被一起压下去**：4px 宽的条子核心只剩 227，
            // 细线、细笔画抠完就是发灰发透的。所以腐蚀一下硬掩膜，把「连自己带周围
            // (2r+1)² 全是前景」的像素钉回 255 —— 腐蚀剩下的是核心，凸角上那一两个像素
            // 不算核心，照样保留羽化后的值，该软的角还是软的。
            const er = CUT_FEATHER;
            for (let y = er; y < H - er; y++) {
                for (let x = er; x < W - er; x++) {
                    const i = y * W + x;
                    if (!hard[i]) continue;
                    let solid = true;
                    for (let dy = -er; dy <= er && solid; dy++) {
                        const row = (y + dy) * W;
                        for (let dx = -er; dx <= er; dx++) {
                            if (!hard[row + x + dx]) { solid = false; break; }
                        }
                    }
                    if (solid) alpha[i] = 255;
                }
            }

            // --- 4. 写回：定 alpha，再把半透明像素里的白底减掉 ---
            for (let i = 0, p = 0; i < n; i++, p += 4) {
                const a = alpha[i];
                if (a <= 0) { d[p + 3] = 0; continue; }
                const av = a > 255 ? 255 : a;
                d[p + 3] = Math.round(av);
                if (av < 255) {
                    // 合成的结果是 C = (a/255)·C' + (1−a/255)·255，反解出 C'。
                    // 不减这一下，抠完边缘会挂一圈白边。
                    const f = av / 255;
                    const inv = (1 - f) * 255;
                    d[p]     = clamp255((d[p]     - inv) / f);
                    d[p + 1] = clamp255((d[p + 1] - inv) / f);
                    d[p + 2] = clamp255((d[p + 2] - inv) / f);
                }
            }
            ctx.putImageData(id, 0, 0);
            return new Promise((resolve, reject) => {
                cvs.toBlob((b) => b ? resolve(b) : reject(new Error('导出 PNG 失败')), 'image/png');
            });
        }

        // ---- 启动 ----
        (function initStickerLib() {
            renderStickerLib();
            // 预先把内置素材的长宽比量出来，省得第一次点击才去等解码

                    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
                    .map((r) => Object.assign({ builtin: false }, r, { useMatted: !!r.useMatted }));
                // 自己导入的素材也要预热。原来只有内置那 4 个有这一步，用户传的没有 ——
                // 「自带的点一下就对、自己的第一下什么都不出来」就是这一行之差：
                // pinSize() 同步读 naturalWidth，图没解码完读到 0，量出个假的方框，

                // 放在开机这里而不是 renderStickerLib 里：开机就开始解码，

                console.warn('素材库读取失败，本次只用内置素材：', err);
                showToast('素材库读取失败，本次只能用内置素材');

        // 点舞台空白处收起别针的选中框。

        let stageTapPointer = null;

        // =====================================================================
        // 显示屏：2D / 3D 两套互斥渲染

        // 弯曲量在面板上写成有符号的度数：0° 不弯、40° 上弯、-40° 下弯。
        // 早先写的是「上弯 40 / 下弯 40」，两个字加一个空格，滑块拉到哪儿都要先读
        // 一遍才知道往哪边弯；负号本身就说清了方向，跟旁边「平面倾斜度: -15°」
        // 也是同一套读法，面板里凡是角度一律带 °。

        // 这支配的不是真的圆心角 —— 同样满量程，长行弯得缓、短行弯得急（半径按字号
        // 和行宽取，见 drawTextLine），所以它是个 -100…100 的弯曲刻度，单位借度数来读。
        function bendLabel(bend) {

        // =====================================================================

        // 顶栏那排选项。初始状态写在 HTML 里（三栏 hidden、选中那格
        // aria-selected="true"、其余 tabindex="-1"），这里只管点下去之后的事 ——
        // 这样脚本还没跑起来的那一瞬间不会四栏齐刷刷亮一下。
        const deckTabs = Array.from(document.querySelectorAll('.deck-tab'));
        function selectDeckTab(tab) {
            deckTabs.forEach((t) => {
                const on = t === tab;

        deckTabs.forEach((t) => {
            t.addEventListener('click', () => selectDeckTab(t));
            // tablist 的键盘约定：左右键换栏。不做的话键盘用户被卡在第一格上
            t.addEventListener('keydown', (e) => {
                const step = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
                if (!step) return;

        matTypeBtns.forEach((b) => b.addEventListener('click', () => {

        // =====================================================================
        // 应用：把显示屏里的参数写回选中的便利贴
        // =====================================================================
        document.getElementById('btnApplyToNote').addEventListener('click', () => {
            if (!selected) {

            }

            if (selected.kind === '2D') {
                const note = selected.note;
                note.mat = clone(dbgMat);
                note.p2 = clone(dbg2D);

                return;
            }

            const note = selected.note;
            note.mat = clone(dbgMat);
            note.p3 = clone(dbg3D);
            note.noteObj.params = note.p3;
            buildFusedTextureCanvas(note.mat, (tex) => {
                note.noteObj.material.map = tex;
                note.noteObj.material.opacity = note.mat.opacity;
                note.noteObj.material.needsUpdate = true;

        // =====================================================================
        // 图像裁剪
        // =====================================================================
        // 一个弹窗服务三处：2D 调试器的单张图（固定 300×300 方框）、切片照片
        // （框的比例跟着当前行列走）、以及导出背景图（框照舞台的比例走）。
        // 裁剪框的宽高比由调用方给。
        let rawLoadedImg = null;
        let cropZoom = 1.0, cropMinZoom = 1.0;
        let cropPanX = 0, cropPanY = 0;
        let cropBoxW = 300, cropBoxH = 300;
        let cropOnConfirm = null, cropOnSkip = null, cropOnCancel = null;
        let cropOut = null;      // 可选的输出规格，见 renderCropOut
        const cropModal = document.getElementById('cropModal');
        const cropCanvas = document.getElementById('cropCanvas');
        const cropCtx = cropCanvas.getContext('2d');
        const cropTitle = document.getElementById('cropTitle');

        // 裁剪框的尺寸按屏幕宽收一下：切片框最宽 320px、单张图框固定 300px，
        // 加上弹窗自己的内边距在窄屏上就顶出屏幕了（iPhone 上是刚好卡着，
        // 再窄一点的机型就露不全）。
        // 收的是画布的像素尺寸、不是 CSS 尺寸 —— 两者一直保持相等，
        // 框里的平移量才能拿屏幕位移直接当画布位移用。
        function fitCropBox(w, h) {
            const limit = window.innerWidth - 56;   // 56 = 弹窗内边距 + 两边留白
            const k = Math.min(1, limit / Math.max(w, h));
            if (k >= 1) return { w, h };
            return { w: Math.max(1, Math.round(w * k)), h: Math.max(1, Math.round(h * k)) };
        }

        // onCancel 是「×」和 Esc 那条路：一个回调都不调，只把弹窗收掉。
        // 三个导入口要改的状态全写在 onConfirm/onSkip 里，所以「不调用」
        // 天然就等于「回到打开弹窗之前」—— 不需要谁再写一份还原逻辑。
        function openCropModal(img, boxW, boxH, onConfirm, onSkip, out, onCancel) {
            rawLoadedImg = img;
            const box = fitCropBox(boxW, boxH);
            boxW = box.w; boxH = box.h;
            cropBoxW = boxW; cropBoxH = boxH;
            cropOnConfirm = onConfirm; cropOnSkip = onSkip;
            cropOnCancel = onCancel || null;
            cropOut = out || null;
            cropCanvas.width = boxW; cropCanvas.height = boxH;
            // 「图片宽高不小于框」就落在这个缩放下限上。按 cover 取两个方向的较大者：
            // 再缩一点图片就有一条边贴不满框，框里要露白边了。
