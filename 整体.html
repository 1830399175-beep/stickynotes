<body>

    <div class="top-bar">
        <!-- 四栏：切片 / 照片 / 添加 / 导出。顶上那排选项就是这四栏的名字，
             点哪个下面就换成哪一栏。栏里每个控件都带字，没有一处含义只活在
             title 里（触屏看不见 title）。
             初始选中「添加」——它是这个工具最常做的一件事，也让那颗唯一的实心
             按钮一打开就在眼前。初始状态直接写在 HTML 上（三栏 hidden、选中的
             那格 aria-selected="true"），脚本没跑起来之前也不会闪一下全部栏。 -->
        <div class="deck">

            <div class="deck-tabs" role="tablist" aria-label="顶栏分组">
                <button class="deck-tab" type="button" role="tab" id="tabGrid"
                        aria-controls="secGrid" aria-selected="false" tabindex="-1">切片</button>
                <button class="deck-tab" type="button" role="tab" id="tabPhoto"
                        aria-controls="secPhoto" aria-selected="false" tabindex="-1">照片</button>
                <button class="deck-tab" type="button" role="tab" id="tabAdd"
                        aria-controls="secAdd" aria-selected="true" tabindex="0">添加</button>
                <button class="deck-tab" type="button" role="tab" id="tabExport"
                        aria-controls="secExport" aria-selected="false" tabindex="-1">导出</button>
            </div>

            <!-- ① 切片：摆几张、每张什么形态。行列装在一个凹槽里读成「3 × 3」，
                     随机紧跟其后 —— 它重 roll 的就是这个网格。 -->
            <div class="deck-sec" id="secGrid" role="tabpanel" aria-labelledby="tabGrid" hidden>

                <div class="deck-pair">
                    <label class="deck-field" for="rowSelect">行
                        <select id="rowSelect">
                            <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        </select>
                    </label>
                    <label class="deck-field" for="colSelect">列
                        <select id="colSelect">
                            <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
                            <option value="4">4</option><option value="5">5</option><option value="6">6</option>
                        </select>
                    </label>
                </div>

                <!-- 照 切片立体感 调试器.html 的骰子：给网格便签重 roll 一套初始形态。
                     viewBox 贴着笔画裁（骰子外框含描边占 2~22），这样它跟旁边的图标
                     一样按 16px 画出来；写 0 0 24 24 的话只有 14.2px，会小一圈 -->
                <button id="btnReroll" class="chip">
                    <svg viewBox="2 2 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="4"/>
                        <circle cx="8.4" cy="8.4" r="1.35" fill="currentColor" stroke="none"/>
                        <circle cx="15.6" cy="8.4" r="1.35" fill="currentColor" stroke="none"/>
                        <circle cx="12" cy="12" r="1.35" fill="currentColor" stroke="none"/>
                        <circle cx="8.4" cy="15.6" r="1.35" fill="currentColor" stroke="none"/>
                        <circle cx="15.6" cy="15.6" r="1.35" fill="currentColor" stroke="none"/>
                    </svg>
                    <span class="chip-name">随机</span>
                </button>
            </div>

            <!-- ② 照片：导入一张照片当底，以及「底座」和「重新裁剪」两个后续动作。
                     后两件都是绕着刚导入的那张转的，所以同栏。 -->
            <div class="deck-sec" id="secPhoto" role="tabpanel" aria-labelledby="tabPhoto" hidden>

                <label for="fileInput" class="chip">
                    <svg viewBox="2 2 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4.5" width="18" height="15" rx="2.5"/>
                        <circle cx="8.4" cy="9.8" r="1.4" fill="currentColor" stroke="none"/>
                        <path d="M4.6 17.6 9.8 12.4l3.4 3.4 2.6-2.6 3.6 3.6"/>
                    </svg>
                    <span class="chip-name">导入照片</span>
                </label>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">

                <!-- 照片底座：开/关两个字由 CSS 按 .active 写出来（JS 只翻类名），
                     图标是「叠着两层」——它说的是这张照片垫在便签下面 -->
                <button id="toggleBgBtn" class="chip chip-state chip-toggle active">
                    <svg viewBox="2 2 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3.6 20.4 8.2 12 12.8 3.6 8.2z"/>
                        <path d="M4.4 12.4 12 16.6l7.6-4.2"/>
                    </svg>
                    <span class="chip-name">底座</span>
                    <span class="chip-val"></span>
                </button>

                <!-- 重新裁剪：原图还留在内存里，改主意不用重新选文件。导入前不显示。
                     viewBox 贴着笔画裁（含描边占的 1 个单位），这样图标居中就是真居中 -->
                <button id="btnRecropSlice" class="chip" style="display:none;">
                    <svg viewBox="1 1 22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6.5 2v13.5a2 2 0 0 0 2 2H22"/>
                        <path d="M17.5 22V8.5a2 2 0 0 0-2-2H2"/>
                    </svg>
                    <span class="chip-name">重新裁剪</span>
                </button>
            </div>

            <!-- ③ 添加：往舞台上添东西。这一整条里只有「便利贴」是实心的 ——
                     它是这个工具最常做的一件事，扫一眼就知道从哪儿开始。 -->
            <div class="deck-sec" id="secAdd" role="tabpanel" aria-labelledby="tabAdd">

                <button id="btnAddSingleNote" class="chip chip-primary">
                    <svg viewBox="2 2 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                        <path d="M12 4.5v15M4.5 12h15"/>
                    </svg>
                    <span class="chip-name">便利贴</span>
                </button>

                <!-- 贴纸入口。那 4 个内置别针已经并进素材库，顶栏只留这一个：
                     悬停展开（触屏点了也开），面板里的格子由 JS 渲染（内置 + 用户上传）。 -->
                <div class="sticker-wrap" id="stickerWrap">
                    <button class="chip" id="btnSticker" aria-haspopup="true" aria-expanded="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="7.6" height="7.6" rx="1.6"/>
                            <rect x="13.4" y="3" width="7.6" height="7.6" rx="1.6"/>
                            <rect x="3" y="13.4" width="7.6" height="7.6" rx="1.6"/>
                            <path d="M17.2 13.4v7.6M13.4 17.2h7.6"/>
                        </svg>
                        <span class="chip-name">贴纸库</span>
                    </button>
                    <div class="sticker-lib" id="stickerLib"></div>
                </div>
            </div>

            <!-- ④ 导出：把舞台出成图。背景归在这里，因为它决定的是「导出来那张
                     图的底长什么样」—— 透明档在屏幕上也只是层衬底。 -->
            <div class="deck-sec" id="secExport" role="tabpanel" aria-labelledby="tabExport" hidden>

                <!-- 背景：舞台那层的底（透明 / 纯色 / 图片），选中了就叠一层纸纹。
                     色块实时显示当前选的是哪一档，旁边再把这档的名字写出来。 -->
                <div class="bg-wrap">
                    <button id="btnBg" class="chip chip-state">
                        <span id="bgSwatch" class="bg-swatch is-none"></span>
                        <span class="chip-name">背景</span>
                        <span id="bgModeName" class="chip-val">纯色</span>
                    </button>

                    <!-- 面板跟着按钮走，点外面或按 Esc 收起来 -->
                    <div id="bgPanel" class="bg-panel" hidden>
                        <label><input type="radio" name="bgMode" value="none">透明</label>
                        <label>
                            <input type="radio" name="bgMode" value="color">纯色
                            <input type="color" id="bgColorInput" value="#9aa4bc">
                        </label>
                        <label>
                            <input type="radio" name="bgMode" value="image">图片
                            <button id="btnBgPick" class="mini-btn" type="button">选择图片…</button>
                            <button id="btnBgRecrop" class="mini-btn" type="button" hidden>重新裁剪</button>
                            <img id="bgThumb" class="bg-thumb" alt="" hidden>
                        </label>
                        <p id="bgHint" class="bg-hint"></p>
                        <input type="file" id="bgFileInput" accept="image/*" style="display:none;">
                    </div>
                </div>

                <!-- 单图：舞台上这一张。跟旁边「多图导出」配一对 —— 一个出当前这张，
                     一个出攒下来的那叠，名字里就写着差别，不用靠猜。 -->
                <button id="btnExport" class="chip">
                    <svg viewBox="2 2 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3.5v11"/>
                        <path d="M7.2 10.2 12 15l4.8-4.8"/>
                        <path d="M4 19.5h16"/>
                    </svg>
                    <span class="chip-name">单图导出</span>
                </button>

                <!-- 多图：点开顶栏和舞台之间的横条 -->
                <button id="btnMulti" class="chip">
                    <svg viewBox="2 2 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                        <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/>
                        <rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/>
                        <rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
                        <rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>
                    </svg>
                    <span class="chip-name">多图导出</span>
                </button>
            </div>

        </div>
    </div>

    <!-- 多图导出：把满意的舞台一张张存进格子，最后打包成 ZIP 或合成 MP4。
         位置在顶栏和舞台之间、走正常文档流 —— 它不能挡住舞台，见 CSS 里的说明。
         四个按钮里「保存」不设 disabled：攒满 20 张时点它要弹一句提示（而不是点不动），
         所以「满」的状态靠 #shotCount 变色来表达。 -->
    <div id="shotStrip" class="shot-strip" hidden>
        <div class="shot-bar">
            <span class="shot-title">多图导出</span>
            <span id="shotCount" class="shot-count">0/20</span>
            <span class="spacer"></span>
            <button id="btnShotSave" class="mini-btn btn-shot" type="button">保存</button>
            <button id="btnShotZip" class="mini-btn btn-shot" type="button">导出全部</button>
            <button id="btnShotVideo" class="mini-btn btn-shot" type="button">导出视频</button>
            <button id="btnShotReset" class="mini-btn btn-shot" type="button">刷新</button>
        </div>
        <div id="shotGrid" class="shot-grid"></div>
    </div>

    <div class="workspace">
        <!-- 宽屏下 display: contents，整个消失，桌面布局一个像素不变；
             只有窄屏（body.is-narrow）才成为实体盒子，用来把缩放后的舞台的
             布局盒收成实际尺寸。见 CSS 里 .stage-fit 那段。 -->
        <div class="stage-fit">
        <div class="stage-container">
            <!-- 舞台自己的纸纹，垫在所有东西下面（z-index:0）。
                 照片底座是 368×368、只盖住中间，外面那圈舞台露出来的就是它 -->
            <div class="stage-tex"></div>
            <div id="bgContainer">
                <div id="bgImg" class="bg-img">
                    <div class="texture-layer"></div>
                </div>
            </div>
            <div id="stickyGrid"></div>
        </div><!-- /.stage-container -->
        </div><!-- /.stage-fit -->

        <div class="panel">
            <div class="panel-title">
                <span>便利贴调试器</span>
            </div>

            <!-- 最上方显示屏：2D / 3D 两套互斥渲染 -->
            <div class="stage-preview">
                <div id="emptyDisplayTip" class="empty-display-tip">点击舞台上的任意便利贴<br>即可在此显示并实时调试</div>
                <div id="preview2D"></div>
                <canvas id="webgl-canvas"></canvas>
                <div id="badge2D" class="preview-badge">2D 调试 · CSS 平面变换</div>
                <div id="badge3D" class="preview-badge">3D 调试 · WebGL 曲面弯曲</div>
            </div>

            <!-- 标签栏：点哪个标签，下面只留那一组控件。
                 「翘角」的内容跟着选中的便签走 —— 网格便签给 2D 那套、自由便签给 3D 那套。 -->
            <div id="panelTabs" class="mode-switch">
                <button class="mode-btn active" data-tab="look">外观</button>
                <button class="mode-btn" data-tab="text">文字</button>
                <button class="mode-btn" id="tabShape" data-tab="shape">翘角</button>
            </div>

            <!-- ===== 外观（两种便签共用） ===== -->
            <div id="groupMaterial" class="control-group">
                <!-- 材质类型：跟「打字/手写」同一种选框。
                     「拼图切片」只有网格便签有，自由便签那一格会藏起来。 -->
                <div class="mode-switch sub" id="matTypeSwitch">
                    <button class="mode-btn" data-mtype="slice">拼图切片</button>
                    <button class="mode-btn" data-mtype="color">纯色</button>
                    <button class="mode-btn" data-mtype="image">导入图片</button>
                </div>

                <div id="colorOptionRow" class="row-flex">
                    <label style="font-size:12px; font-weight:600;">选取颜色:</label>
                    <input type="color" id="debugColorPicker" value="#ffffff" style="width:28px; height:28px; cursor:pointer;">
                </div>

                <div id="imageOptionRow" class="row-flex" style="display:none;">
                    <label for="debugImageInput" class="action-btn-main" style="padding:4px 10px; font-size:12px;">选取图片</label>
                    <input type="file" id="debugImageInput" accept="image/*" style="display:none;">
                </div>

                <div class="control-item">
                    <label>透明度: <span id="valOpacity">1.00</span></label>
                    <input type="range" id="sliderOpacity" min="10" max="100" value="100">
                </div>
            </div>

            <!-- ===== 手写文字（共用） ===== -->
            <div id="groupText" class="control-group" style="display:none;">
                <!-- 打字 / 手写二选一。另一种的内容留着，切回去还在，只是便签上只画当前这种 -->
                <div class="mode-switch sub" id="textModeSwitch">
                    <button class="mode-btn active" data-tmode="type">打字</button>
                    <button class="mode-btn" data-tmode="sign">手写</button>
                </div>

                <div class="row-flex" style="margin-top:8px;">
                    <label style="font-size:12px;">文字颜色:</label>
                    <input type="color" id="debugTextColor" value="#545454" style="width:24px; height:24px;">
                </div>

                <!-- 打字 -->
                <div id="typePane">
                    <div class="control-item">
                        <textarea id="debugTextInput" rows="1" placeholder="在此输入文字..."></textarea>
                    </div>
                    <div class="control-item">
                        <label>字号: <span id="valFontSize">24px</span></label>
                        <input type="range" id="sliderFontSize" min="10" max="48" value="24">
                    </div>
                    <div class="control-item">
                        <label>弯曲: <span id="valBend">0°</span></label>
                        <input type="range" id="sliderBend" min="-100" max="100" value="0">
                    </div>
                    <div id="fontStatus" class="font-status">
                        <span class="font-spinner"></span><span id="fontStatusText">手写字体加载中…</span>
                    </div>
                </div>

                <!-- 手写签名：画布比例跟着选中的便利贴走 -->
                <div id="signPane" style="display:none;">
                    <canvas id="signPad" class="sign-pad"></canvas>
                    <div class="row-flex" style="margin-top:6px;">
                        <label style="font-size:12px;">笔粗:</label>
                        <input type="range" id="sliderPen" min="2" max="16" value="5" style="flex:1;">
                        <button id="btnUndoSign" class="action-btn-main" style="padding:4px 10px; font-size:12px; background:#888;">撤回</button>
                        <button id="btnClearSign" class="action-btn-main" style="padding:4px 10px; font-size:12px; background:#888;">清空</button>
                    </div>
                </div>

                <div class="control-item">
                    <label>平面倾斜度: <span id="valTextRot">0°</span></label>
                    <input type="range" id="sliderTextRotZ" min="-30" max="30" value="0">
                </div>
            </div>

            <!-- ===== 2D 参数组（网格便签）===== -->
            <div id="group2D" class="control-group" style="display:none;">
                <div class="control-item"><label>左上角翘起: <span id="val2TL">0px</span></label><input type="range" id="slider2TL" min="0" max="25" value="0"></div>
                <div class="control-item"><label>右上角翘起: <span id="val2TR">0px</span></label><input type="range" id="slider2TR" min="0" max="25" value="0"></div>
                <div class="control-item"><label>左下角翘起: <span id="val2BL">0px</span></label><input type="range" id="slider2BL" min="0" max="25" value="0"></div>
                <div class="control-item"><label>右下角翘起: <span id="val2BR">0px</span></label><input type="range" id="slider2BR" min="0" max="25" value="0"></div>
                <div class="control-item"><label>平面倾斜: <span id="val2RotZ">0°</span></label><input type="range" id="slider2RotZ" min="-15" max="15" value="0"></div>
                <div class="control-item"><label>悬浮阴影扩散: <span id="val2Blur">15px</span></label><input type="range" id="slider2Blur" min="5" max="40" value="15"></div>
                <button class="mini-reset" id="reset2D">重置 2D 参数</button>
            </div>

            <!-- ===== 3D 参数组（自由便签） ===== -->
            <div id="group3D" class="control-group" style="display:none;">
                <div class="mode-switch sub">
                    <button class="mode-btn active" id="btnCornerMode">四角卷曲模式</button>
                    <button class="mode-btn" id="btnEdgeMode">四边卷曲模式</button>
                </div>

                <div id="cornerGroup" class="control-group">
                    <div class="control-item"><label>左上角弧度: <span id="valTL">0.00</span></label><input type="range" id="sliderTL" min="0" max="100" value="0"></div>
                    <div class="control-item"><label>右上角弧度: <span id="valTR">0.00</span></label><input type="range" id="sliderTR" min="0" max="100" value="0"></div>
                    <div class="control-item"><label>左下角弧度: <span id="valBL">0.00</span></label><input type="range" id="sliderBL" min="0" max="100" value="0"></div>
                    <div class="control-item"><label>右下角弧度: <span id="valBR">0.00</span></label><input type="range" id="sliderBR" min="0" max="100" value="0"></div>
                </div>

                <div id="edgeGroup" class="control-group" style="display: none;">
                    <div class="control-item"><label>上边弧度: <span id="valTop">0.00</span></label><input type="range" id="sliderTop" min="0" max="100" value="0"></div>
                    <div class="control-item"><label>下边弧度: <span id="valBottom">0.00</span></label><input type="range" id="sliderBottom" min="0" max="100" value="0"></div>
                    <div class="control-item"><label>左边弧度: <span id="valLeft">0.00</span></label><input type="range" id="sliderLeft" min="0" max="100" value="0"></div>
                    <div class="control-item"><label>右边弧度: <span id="valRight">0.00</span></label><input type="range" id="sliderRight" min="0" max="100" value="0"></div>
                </div>

                <div class="control-item"><label>平面倾斜: <span id="valRotZ">0°</span></label><input type="range" id="sliderRotZ" min="-30" max="30" value="0"></div>

                <div class="control-item">
                    <label>平面俯仰 (X-Tilt): <span id="valTilt">0°</span></label>
                    <input type="range" id="sliderTilt" min="0" max="60" value="0">
                </div>
                <button class="mini-reset" id="reset3D">重置 3D 参数</button>
            </div>

            <!-- 「翘角」没选中便签时的占位：标签始终在，只是这时候没有可调的参数 -->
            <div id="shapeHint" class="control-group" style="display:none; font-size:12px; color:#999; text-align:center;">
                先点一下舞台上的便利贴，再来调翘角
            </div>

            <button id="btnApplyToNote" class="apply-btn">应用到选中的便利贴</button>
        </div>
    </div>

    <div id="toast"></div>

    <!-- 导出前没准备完时挡一层，准备好就自己消失。见 ensureExportReady()。
         它在 .stage-container 外面，导出克隆舞台时带不上，不会进成品。 -->
    <div id="exportWait" role="status" aria-live="polite">
        <div class="wait-box"><span class="font-spinner"></span><span id="exportWaitText">请稍等，正在准备…</span></div>
    </div>

    <div class="crop-modal" id="cropModal">
        <div class="crop-box">
            <button id="btnCloseCrop" class="crop-close" title="关闭（Esc）" aria-label="关闭">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                    <path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/>
                </svg>
            </button>
            <h4 id="cropTitle" style="font-size:14px; color:#333;">图像裁剪</h4>
            <!-- 操作提示是每次打开都一样的话，就写死在这儿，别再让 JS 传一遍 -->
            <div id="cropHint" style="font-size:11px; color:#888; margin-top:-8px; text-align:center;">滚轮缩放，拖拽平移</div>
            <canvas id="cropCanvas" width="300" height="300"></canvas>
            <div class="row-flex">
                <button id="btnCancelCrop" class="action-btn-main" style="background:#888;">不裁剪直接拉伸</button>
                <button id="btnConfirmCrop" class="action-btn-main" style="background:#28a745;">确认裁剪</button>
            </div>
        </div>
    </div>

    <!-- 素材裁剪：跟上面那个分开一套，别的三个导入口继续用它。那三处的框都带固定比例
         （便签背景 300×300、导出背景图按舞台比例、切片按便签宽高），素材没有 —— 素材要的是
         「在图上框出一块」，所以模型是反的：图整张摊开不动，框在上面拖、在上面拉。
         共用一套的话，canvas 那堆 wheel/pointer 处理器里到处要加「自由模式不算」的早退，而且
         两边对 cropPanX / cropZoom 的语义要求正好相反（那边是图动框不动），迟早互相绊。
         拆开之后老的那套一行都不用改。
         没有「不裁剪直接拉伸」：那个出口在素材这条本来就是死的（onSkip 传的是 null，按下去
         什么都不发生，导入还就没了），素材也没有「拉伸进某个固定比例」这回事。 -->
    <div class="crop-modal" id="freeCropModal">
        <div class="crop-box">
            <button id="btnCloseFreeCrop" class="crop-close" title="关闭（Esc）" aria-label="关闭">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                    <path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/>
                </svg>
            </button>
            <h4 id="freeCropTitle" style="font-size:14px; color:#333;">裁剪素材</h4>
            <!-- 提示写死在这儿，理由跟上面那个一样 -->
            <div id="freeCropHint" style="font-size:11px; color:#888; margin-top:-8px; text-align:center;">拖框里移动，拖四角或四边缩放</div>
            <!-- 框外压暗是靠 marquee 的 box-shadow 铺满这一层，所以这层必须 overflow:hidden：
                 不然那道阴影会以 stage 为圆心铺到整个页面上，把弹窗自己都盖了 -->
            <div class="free-crop-stage" id="freeCropStage">
                <canvas id="freeCropCanvas"></canvas>
                <div class="free-crop-marquee" id="freeMarquee">
                    <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i>
                    <i data-h="w"></i><i data-h="e"></i>
                    <i data-h="sw"></i><i data-h="s"></i><i data-h="se"></i>
                </div>
            </div>
            <div class="row-flex">
                <button id="btnCancelFreeCrop" class="action-btn-main" style="background:#888;">取消</button>
                <button id="btnConfirmFreeCrop" class="action-btn-main" style="background:#28a745;">确认裁剪</button>
            </div>
        </div>
    </div>

    <!-- 导入贴纸：裁剪确认后弹这个。先给两个出口（点击抠图 / 导入原图），
         抠完再给一个开关在「抠图/原图」之间切。
         选过抠图的素材两版都会存下来，所以那个开关不是一次性的，入库之后仍然能改主意。 -->
    <div class="crop-modal" id="importModal">
        <div class="crop-box" style="width: 344px;">
            <button id="btnCloseImport" class="crop-close" title="关闭（Esc）" aria-label="关闭">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
                    <path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/>
                </svg>
            </button>
            <h4 id="impTitle" style="font-size:14px; color:#333;">导入贴纸</h4>
            <!-- 抠图是按颜色抠的，不是识别主体，只认白底。这句话得写在脸上：不然拿一张
                 彩色背景的图去抠，看着像坏了。写在预览上面，位置跟裁剪页那句提示对齐。
                 抠完就收走（runMatteImport 里把 impHint 一起 hidden）—— 到那一步预览已经
                 摆在那儿了，抠干净没有一眼就看得出来，不再需要用文字预告；
                 这一页留着开关和「加入素材库」就够。
                 括号里的数字是实测：浅灰 #c8c8c8、纯蓝底都是透明像素 0%，白底+红圆 80%。 -->
            <div class="imp-hint" id="impHint">只支持<b>白底抠图</b></div>
            <div class="imp-stage"><img id="impPreview" alt=""></div>
            <!-- 这一步不写问句。「点击抠图 / 导入原图」两个按钮本身就是那两句问话的答案，
                 再来一行「这张图要不要抠掉背景？」是把同一件事说两遍。 -->
            <div id="impAsk">
                <div class="row-flex">
                    <button id="btnImportMatte" class="action-btn-main" style="background:#007bff;">点击抠图</button>
                    <button id="btnImportKeep" class="action-btn-main" style="background:#888;">导入原图</button>
                </div>
            </div>
            <div class="imp-switch" id="impSwitch" hidden>
                <span>抠图</span>
                <button class="imp-track" id="btnMatteToggle" role="switch" aria-checked="true" title="切换用哪一版">
                    <span class="imp-knob"></span>
                </button>
                <span>原图</span>
            </div>
            <div class="row-flex" id="impConfirm" hidden>
                <button id="btnConfirmImport" class="action-btn-main" style="background:#28a745;">加入素材库</button>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // 常量与全局状态
        // =====================================================================
        const unitBaseSize = 120;      // 网格便签边长，2D 网格的格子尺寸由它决定
        const STICKY_GAP = 4;          // 便签间距

        // ---- 3D 便签的渲染参数：显示屏和舞台共用这一套，两边只有画布像素数不同 ----
        // 纸在画布上占多高只由相机距离决定：
        //   纸像素高 = 2.2 * H / (2 * d * tan(22.5°)) = 2.6556 * H / d
        // 2D 显示屏里便签是 unitBaseSize 经 scale(1.5) = 180px，放在 240px 高的框里
        // 正好 75%。取 d = 2.6556 * 4/3 = 3.5408，3D 便签在显示屏里也是
        // 240 * 0.75 = 180px，和 2D 便签一样大。舞台画布开 160px，纸仍是
        // 160 * 0.75 = 120px（尺寸没变），多出来的边距正好留给纸后面的投影。
        // 以前舞台画布就是 120px、纸占满整格，投影被裁在框外，所以舞台上从来
        // 看不到阴影 —— 这是把格子放大到 160 的唯一原因。
        const NOTE3D_DIST = 3.5408;
        // 舞台相机自动退让的安全余量，详见 create3DNoteInstance 里的 fitCamera。
        // 1.05 = 刚好装下之后再留 5%，防浮点误差、也防阴影正好压在框线上。
        const NOTE3D_FIT_MARGIN = 1.05;
        const NOTE3D_BOX = Math.round(unitBaseSize / 0.75);   // 160：3D 便签的渲染框
        const NOTE3D_CANVAS_W = 340, NOTE3D_CANVAS_H = 240;   // 显示屏的渲染分辨率
        const NOTE3D_LIGHT_POS = [3, 5, 4];
        // 光的增益。这两个数不是推出来的，是对着实测反推的：把 .texture-layer 那套
        // CSS 和烘焙用的 canvas 并排渲一遍，两者输出完全相同（平均 229.5、范围
        // 212~239），所以要让 3D 便签跟 2D 便签长得一样，WebGL 这边的总增益必须是
        // 1.0 —— 即光把贴图原样打出来，不加亮也不压暗。实测 0.82+0.36 得到的增益是
        // 1.024（整张便签白 5 个色阶），按比例缩到 0.80+0.351 才是 1.0。
        // 注意这一对数值是绑死在一起的，改其中一个就得按比例改另一个。
        const NOTE3D_AMBIENT = 0.80;
        const NOTE3D_DIR = 0.351;
        const NOTE3D_SHADOW_SIZE = 8;      // 接影子的地板，比纸大得多才接得住
        const NOTE3D_SHADOW_OPACITY = 0.15;

        const gridEl = document.getElementById('stickyGrid');
        const stageContainer = document.querySelector('.stage-container');
        const bgContainer = document.getElementById('bgContainer');
        const bgImg = document.getElementById('bgImg');

        let currentSlicedImage = null;          // 整图（拼图底图）
        let deletedMatrix = [];
        let showBackground = true;

        let gridNotes = [];   // 网格便签: { el, mat, p2, row, col }
        let freeNotes = [];   // 自由便签: { el, noteObj, mat, p3 }
        let selected = null;  // { kind:'2D', note } | { kind:'3D', note }

        function clone(o) { return JSON.parse(JSON.stringify(o)); }

        function defaultMat() {
            return {
                matType: 'slice',      // 'slice' | 'color' | 'image'
                color: '#ffffff',
                imageSrc: null,        // 自定义裁剪图 dataURL
                opacity: 1.0,
                // bend：打字文字的弯曲量，-1 全下弯 / 0 不弯 / +1 全上弯。
                // 只作用于打字，签名那条路不认它（签名是画出来的，弯了也没意义）
                text: '', textColor: '#545454', fontSize: 24, textRotZ: 0, bend: 0,
                // 打字和手写签名二选一：两个内容都留着，由 textMode 决定便签上画哪个
                sign: null, textMode: 'type'
            };
        }
        function default2D() {
            return { TL: 0, TR: 0, BL: 0, BR: 0, rotZ: 0, blur: 15 };
        }
        function default3D() {
            // 全 0：新增的便签是平整、不卷角、不旋转的，滑块的默认位置也就是 0。
            // （以前这里抄了 调试器效果.html 的开页值 BR=35 / rotZ=3，于是每次新建
            //   便签都自带一个右下角卷起，选中它滑块还跳到 35 和 3，看不出来是为什么。）
            return { mode: 'corner', TL: 0, TR: 0, BL: 0, BR: 0, Top: 0, Bottom: 0, Left: 0, Right: 0, rotZ: 0, rotX: 0 };
        }

        // =====================================================================
        // 手写字体
        // =====================================================================
        // 本地 ttf。file:// 下 fetch/XHR 会被 CORS 挡死，但 FontFace.load() 走的是
        // 字体加载那条路，实测能过 —— 所以这里只能用它，别改成 fetch + ArrayBuffer。
        // 路径是 ../HTML素材/...，字体在项目目录外：把 整体.html 挪走字体就没了。
        const HAND_FONT_FAMILY = 'JinNianYeYaoJiaYouYa';
        const HAND_FONT_URL = '../HTML素材/字体/Foreign-look-Various/JinNianYeYaoJiaYouYa.ttf';
        const FALLBACK_FONT = '"Kaiti SC", "STKaiti", "PingFang SC", sans-serif';

        let fontState = 'loading';   // loading | ready | failed

        // 只有 ready 才把本地字体排在最前；failed 就老实退回系统字体
        function fontStack() {
            return fontState === 'ready' ? `"${HAND_FONT_FAMILY}", ${FALLBACK_FONT}` : FALLBACK_FONT;
        }

        let toastTimer = null;
        function showToast(msg, ms) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.display = 'block';
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms || 4000);
        }

        function syncFontUI() {
            const box = document.getElementById('fontStatus');
            const txt = document.getElementById('fontStatusText');
            if (fontState === 'loading') {
                box.className = 'font-status on';
                box.querySelector('.font-spinner').style.display = '';
                txt.textContent = '手写字体加载中…';
            } else if (fontState === 'failed') {
                box.className = 'font-status on err';
                box.querySelector('.font-spinner').style.display = 'none';
                txt.textContent = '字体加载失败，已改用系统字体';
            } else {
                box.className = 'font-status';
            }
        }

        function loadHandFont() {
            syncFontUI();
            let face;
            try {
                face = new FontFace(HAND_FONT_FAMILY, `url("${HAND_FONT_URL}")`);
            } catch (e) {
                fontState = 'failed';
                onFontSettled('手写字体加载失败（浏览器不支持 FontFace），已改用系统字体');
                return;
            }
            face.load().then((f) => {
                document.fonts.add(f);
                fontState = 'ready';
                onFontSettled(null);
            }).catch((err) => {
                fontState = 'failed';
                onFontSettled('手写字体加载失败，已改用系统字体：' + (err && err.message ? err.message : err));
            });
        }

        function onFontSettled(errMsg) {
            syncFontUI();
            if (errMsg) showToast(errMsg, 6000);
            repaintAllText();
        }

        // =====================================================================
        // 签名框：手指/鼠标直接画
        // =====================================================================
        // 画布分辨率跟显示尺寸脱钩（显示 220px，画布 480px），缩放系数在每次落笔时
        // 按实际显示宽度算，所以笔粗在屏幕上是恒定的。
        const signPad = document.getElementById('signPad');
        const signCtx = signPad.getContext('2d');
        const SIGN_RES = 480;
        let signHasInk = false;      // 画布上有没有笔迹（空画布 toDataURL 也会出图，得自己记）
        let signLoadToken = 0;       // 灌图期间又换了便签，旧的那张就别再盖上去
        // 撤回：落笔之前先存一张，弹一张回去就是撤一笔（点出来的那个点也算一笔）。
        // 存 PNG 不存 getImageData —— 签名大半是透明的，压出来几 KB；ImageData 一张
        // 就 480×480×4 ≈ 900KB，几十笔能吃到上百兆。ink 记的是「这一笔之前有没有
        // 笔迹」，撤回后才判断得出该不该把 dbgMat.sign 清成 null。
        // 存的是像素不是笔画，所以换过颜色之后再撤回，留下的笔迹会带回旧颜色。
        const signUndo = [];
        const SIGN_UNDO_MAX = 50;
        let signUndoToken = 0;

        // 签名框的比例跟着选中的便利贴走 —— 便签什么样框就什么样，画上去才不变形
        function signAspect() {
            const el = selected && selected.note && selected.note.el;
            const w = el ? el.offsetWidth : unitBaseSize;
            const h = el ? el.offsetHeight : unitBaseSize;
            return (w && h) ? w / h : 1;
        }

        // 返回 true 表示尺寸变了、画布被清空，调用方得重新灌内容
        function layoutSignPad() {
            const a = signAspect();
            signPad.style.aspectRatio = `${a}`;
            const w = a >= 1 ? SIGN_RES : Math.round(SIGN_RES * a);
            const h = a >= 1 ? Math.round(SIGN_RES / a) : SIGN_RES;
            if (signPad.width === w && signPad.height === h) return false;
            signPad.width = w; signPad.height = h;
            return true;
        }

        function clearSignPad() {
            signCtx.clearRect(0, 0, signPad.width, signPad.height);
            signHasInk = false;
            // 换便签、换尺寸、点清空，都是重新开一张纸，上一张的笔迹撤不回来
            signUndo.length = 0;
            syncSignUndoBtn();
        }

        function syncSignUndoBtn() {
            document.getElementById('btnUndoSign').disabled = signUndo.length === 0;
        }

        function pushSignUndo() {
            signUndo.push({ url: signPad.toDataURL('image/png'), ink: signHasInk });
            if (signUndo.length > SIGN_UNDO_MAX) signUndo.shift();
            syncSignUndoBtn();
        }

        function undoSign() {
            const snap = signUndo.pop();
            if (!snap) return;
            const token = ++signUndoToken;
            const im = new Image();
            im.onload = () => {
                // 连点撤回时两张图会先后到，只认最后发出去的那张
                if (token !== signUndoToken) return;
                signCtx.clearRect(0, 0, signPad.width, signPad.height);
                signCtx.drawImage(im, 0, 0, signPad.width, signPad.height);
                signHasInk = snap.ink;
                syncSignUndoBtn();
                commitSign();
            };
            im.src = snap.url;
        }

        function loadSignToPad() {
            signLoadToken++;
            clearSignPad();
            if (!dbgMat.sign) return;
            const token = signLoadToken;
            const im = new Image();
            im.onload = () => {
                if (token !== signLoadToken) return;
                signCtx.drawImage(im, 0, 0, signPad.width, signPad.height);
                signHasInk = true;
            };
            im.src = dbgMat.sign;
        }

        // 画布坐标 ↔ 屏幕坐标：画布 480 宽、显示 220 宽，不换算笔会偏到姥姥家
        function padPoint(e) {
            const r = signPad.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) * (signPad.width / r.width),
                y: (e.clientY - r.top) * (signPad.height / r.height),
                scale: r.width ? signPad.width / r.width : 1
            };
        }

        let signDrawing = false, signLast = null;
        signPad.addEventListener('pointerdown', (e) => {
            if (!e.isPrimary) return;               // 多指时只认第一根手指
            e.preventDefault();
            pushSignUndo();
            signDrawing = true;
            signLast = padPoint(e);
            try { signPad.setPointerCapture(e.pointerId); } catch (err) { /* 老浏览器 */ }
            // 点一下也要留个点，不然「点」等于没画
            const w = penWidth() * signLast.scale;
            signCtx.fillStyle = dbgMat.textColor;
            signCtx.beginPath();
            signCtx.arc(signLast.x, signLast.y, w / 2, 0, Math.PI * 2);
            signCtx.fill();
            signHasInk = true;
        });
        signPad.addEventListener('pointermove', (e) => {
            if (!signDrawing || !e.isPrimary) return;
            e.preventDefault();
            const p = padPoint(e);
            signCtx.strokeStyle = dbgMat.textColor;
            signCtx.lineWidth = penWidth() * p.scale;
            signCtx.lineCap = 'round';
            signCtx.lineJoin = 'round';
            signCtx.beginPath();
            signCtx.moveTo(signLast.x, signLast.y);
            signCtx.lineTo(p.x, p.y);
            signCtx.stroke();
            signLast = p;
        });
        const endStroke = () => {
            if (!signDrawing) return;
            signDrawing = false;
            commitSign();
        };
        signPad.addEventListener('pointerup', endStroke);
        signPad.addEventListener('pointercancel', endStroke);
        signPad.addEventListener('pointerleave', endStroke);

        function penWidth() {
            return parseInt(document.getElementById('sliderPen').value);
        }

        function commitSign() {
            dbgMat.sign = signHasInk ? signPad.toDataURL('image/png') : null;
            refreshPreview();
        }

        // 换颜色时把已有的笔迹一起改色，不然一条签名会花掉。
        // source-in 只保留 alpha、重刷 RGB，正好当「保留笔迹形状重新上色」用。
        function retintSign(newColor) {
            if (!signHasInk) return;
            const tmp = document.createElement('canvas');
            tmp.width = signPad.width; tmp.height = signPad.height;
            tmp.getContext('2d').drawImage(signPad, 0, 0);
            signCtx.clearRect(0, 0, signPad.width, signPad.height);
            signCtx.drawImage(tmp, 0, 0);
            signCtx.globalCompositeOperation = 'source-in';
            signCtx.fillStyle = newColor;
            signCtx.fillRect(0, 0, signPad.width, signPad.height);
            signCtx.globalCompositeOperation = 'source-over';
        }

        document.getElementById('btnClearSign').addEventListener('click', () => {
            clearSignPad();
            commitSign();
        });
        document.getElementById('btnUndoSign').addEventListener('click', undoSign);
        syncSignUndoBtn();

        // --- 打字 / 手写 切换：只换显示哪套控件，两边的数据都不动 ---
        const textModeBtns = [...document.querySelectorAll('#textModeSwitch .mode-btn')];

        function syncTextModeUI(mode) {
            textModeBtns.forEach(b => b.classList.toggle('active', b.dataset.tmode === mode));
            document.getElementById('typePane').style.display = mode === 'sign' ? 'none' : 'block';
            document.getElementById('signPane').style.display = mode === 'sign' ? 'block' : 'none';
        }

        function setTextMode(mode) {
            dbgMat.textMode = mode;
            syncTextModeUI(mode);
            refreshPreview();
        }

        textModeBtns.forEach(b => b.addEventListener('click', () => setTextMode(b.dataset.tmode)));

        // 字体到场/失败后，所有已经画出去的字都得重画一遍。
        // 注意别图省事调 renderGrid()：那是整块重建，里面第一件事就是 clearSelection()，
        // 字体加载完的瞬间会把用户选中的便签清掉。这里只重画现有 DOM。
        function repaintAllText() {
            const { totalW, totalH } = gridMetrics();
            gridNotes.forEach((n) => paint2DNote(n.el, n.mat, n.p2, { row: n.row, col: n.col, totalW, totalH }));
            if (selected) refreshPreview();
            freeNotes.forEach((n) => {
                buildFusedTextureCanvas(n.mat, (tex) => {
                    n.noteObj.material.map = tex;
                    n.noteObj.material.needsUpdate = true;
                    n.noteObj.updateMesh();
                });
            });
        }

        // 显示屏里正在编辑的参数（点"应用"后写回便签）
        let dbgMat = defaultMat();
        let dbg2D = default2D();
        let dbg3D = default3D();
        let dbgSliceCtx = null;   // 2D 显示屏复刻「拼图切片」所需的行列信息

        // =====================================================================
        // 纸张肌理
        // =====================================================================

        function gridMetrics() {
            const cols = parseInt(document.getElementById('colSelect').value);
            const rows = parseInt(document.getElementById('rowSelect').value);
            return {
                cols, rows,
                totalW: cols * unitBaseSize + (cols - 1) * STICKY_GAP,
                totalH: rows * unitBaseSize + (rows - 1) * STICKY_GAP
            };
        }
