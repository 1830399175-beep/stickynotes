            cropMinZoom = Math.max(boxW / img.width, boxH / img.height);
            cropZoom = cropMinZoom;
            cropPanX = 0; cropPanY = 0;
            cropTitle.textContent = '图像裁剪';
            cropModal.style.display = 'flex';
            drawCropPreview();
        }

        // 平移也要夹紧：图片边缘不许缩进框里，否则「不小于框」等于白说 ——
        // 拖到头还是能拖出一圈空白，那跟不裁剪直接拉伸有什么区别。
        function clampCropPan() {
            const slackX = Math.max(0, (rawLoadedImg.width * cropZoom - cropBoxW) / 2);
            const slackY = Math.max(0, (rawLoadedImg.height * cropZoom - cropBoxH) / 2);
            cropPanX = Math.min(slackX, Math.max(-slackX, cropPanX));
            cropPanY = Math.min(slackY, Math.max(-slackY, cropPanY));
        }

        function drawCropPreview() {
            if (!rawLoadedImg) return;
            clampCropPan();
            cropCtx.clearRect(0, 0, cropBoxW, cropBoxH);
            const w = rawLoadedImg.width * cropZoom;
            const h = rawLoadedImg.height * cropZoom;
            cropCtx.drawImage(rawLoadedImg, (cropBoxW - w) / 2 + cropPanX, (cropBoxH - h) / 2 + cropPanY, w, h);
        }

        // 把框里那块区域按更大的分辨率重画一张。out 传了才走这儿（{size, type, quality}）：
        // 单张图和切片照片要的就是框里的像素，照抄 cropCanvas 正合适；导出背景图不一样，
        // 它得铺满整个舞台，而导出时舞台还要再放大 EXPORT_SCALE 倍，拿 320px 的框去铺
        // 会明显发糊。
        // k 是「导出要的像素」和「原图还剩多少真像素」里小的那个：1 / cropZoom 就是
        // 源图 1px 顶框里几 px，再往上放大只是把插值出来的糊点存成更大的糊点。
        function renderCropOut(out) {
            const k = Math.max(1, Math.min(out.size / Math.max(cropBoxW, cropBoxH), 1 / cropZoom));
            const cvs = document.createElement('canvas');
            cvs.width = Math.round(cropBoxW * k);
            cvs.height = Math.round(cropBoxH * k);
            // 框里那块对应的源区域，把上面 drawImage 那行倒过来解就是这两句
            const sw = cropBoxW / cropZoom;
            const sh = cropBoxH / cropZoom;
            const sx = (rawLoadedImg.width - sw) / 2 - cropPanX / cropZoom;
            const sy = (rawLoadedImg.height - sh) / 2 - cropPanY / cropZoom;
            cvs.getContext('2d').drawImage(rawLoadedImg, sx, sy, sw, sh, 0, 0, cvs.width, cvs.height);
            return cvs.toDataURL(out.type || 'image/png', out.quality);
        }

        cropCanvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if (!rawLoadedImg) return;
            cropZoom = Math.max(cropMinZoom, cropZoom + (e.deltaY < 0 ? 0.05 : -0.05));
            drawCropPreview();
        });

        // 框里的平移和双指缩放。走 pointer 事件而不是 mouse：手机上手指按下去
        // 不产生 mousedown，原来那套在触屏上是死的。
        // 平移量直接加在 cropPanX/Y 上，单位就是画布像素 —— 画布的 CSS 尺寸和它的
        // width/height 属性始终相等（openCropModal 按屏宽收过），屏幕位移即画布位移。
        const cropPointers = new Map();   // pointerId -> 该指最后的位置
        let cropPinchDist = 0;            // 上一帧两指间距，不足两指时是 0

        function cropPinchDistNow() {
            const pts = [...cropPointers.values()];
            if (pts.length < 2) return 0;
            return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        }

        cropCanvas.addEventListener('pointerdown', (e) => {
            // 捕获一下：手指滑出画布也不会断线，不用再往 document 上挂move
            cropCanvas.setPointerCapture(e.pointerId);
            cropPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            cropPinchDist = 0;
        });

        cropCanvas.addEventListener('pointermove', (e) => {
            const prev = cropPointers.get(e.pointerId);
            if (!prev) return;
            cropPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
            if (!rawLoadedImg) return;

            const dist = cropPinchDistNow();
            if (dist) {
                // 两指：只缩放，跟滚轮一个口径（都以框中心为原点）
                if (cropPinchDist) {
                    cropZoom = Math.max(cropMinZoom, cropZoom * (dist / cropPinchDist));
                    drawCropPreview();
                }
                cropPinchDist = dist;
                return;
            }

            cropPanX += e.clientX - prev.x;
            cropPanY += e.clientY - prev.y;
            drawCropPreview();
        });

        function endCropPointer(e) {
            cropPointers.delete(e.pointerId);
            cropPinchDist = 0;   // 少一指就作废，免得剩下的那指拿旧间距比出一次跳变
        }
        cropCanvas.addEventListener('pointerup', endCropPointer);
        cropCanvas.addEventListener('pointercancel', endCropPointer);

        // 回调先取出来再关弹窗（关的时候会把回调清掉），也别让回调里的
        // 异常把弹窗卡在打开状态
        function closeCropModal() {
            cropModal.style.display = 'none';
            cropOnConfirm = null; cropOnSkip = null; cropOnCancel = null; cropOut = null;
        }

        document.getElementById('btnConfirmCrop').addEventListener('click', () => {
            const cb = cropOnConfirm;
            // 先出图再关弹窗：关的时候会把回调连同 cropOut 一起清掉
            const src = cropOut ? renderCropOut(cropOut) : cropCanvas.toDataURL();
            closeCropModal();
            if (cb) cb(src);
        });

        document.getElementById('btnCancelCrop').addEventListener('click', () => {
            const cb = cropOnSkip;
            closeCropModal();
            if (cb) cb();
        });

        // 关闭（× 和 Esc 共用）：跟上面两个不一样，出口是「谁都不叫」。
        // 回调先取出来再关是因为 closeCropModal 会把它们清掉。
        function cancelCrop() {
            const cb = cropOnCancel;
            closeCropModal();
            if (cb) cb();
        }
        document.getElementById('btnCloseCrop').addEventListener('click', cancelCrop);

        // =====================================================================
        // 素材裁剪：自由选框（跟上面那套分开，为什么分开见 HTML 里那段注释）
        // 模型是反的：图整张摊开不动（contain，不是 cover），框在上面拖和拉，
        // 任意长宽比，框不许出图。老那套是图动框不动，两套互不引用。
        // =====================================================================
        const freeCropModal = document.getElementById('freeCropModal');
        const freeCropStage = document.getElementById('freeCropStage');
        const freeCropCanvas = document.getElementById('freeCropCanvas');
        const freeMarquee = document.getElementById('freeMarquee');
        const FC_MIN = 8;                 // 选框最小边长（图片像素），再小出图就是一张废图

        let fcImg = null;                 // 正在裁的原图
        let fcScale = 1;                  // 显示像素 / 图片像素
        let fcBox = { x: 0, y: 0, w: 0, h: 0 };   // 选框，单位是**图片像素**
        let fcOnConfirm = null, fcOnCancel = null, fcOut = null;
        let fcDrag = null;

        // 框存图片像素，不存屏幕像素：出图直接 drawImage(img, x, y, w, h, …)，不用像老那套
        // 那样把 drawImage 反解回去。fcScale 只管显示和挑选手感 —— 图小的时候显示大一点好
        // 抓把手，最大 2 倍；放大不会凭空多出像素，出图那步仍然按真像素封顶。
        function freeCropFit(w, h) {
            const limW = Math.min(340, window.innerWidth - 56);      // 56 = 弹窗内边距 + 两边留白
            const limH = Math.min(420, window.innerHeight - 220);    // 220 = 标题 + 提示 + 按钮 + 留白
            return Math.min(limW / w, limH / h, 2);
        }

        function layoutFreeMarquee() {
            freeMarquee.style.left = (fcBox.x * fcScale) + 'px';
            freeMarquee.style.top = (fcBox.y * fcScale) + 'px';
            freeMarquee.style.width = (fcBox.w * fcScale) + 'px';
            freeMarquee.style.height = (fcBox.h * fcScale) + 'px';
        }

        // 先夹尺寸再夹位置：拖过头时先保底 FC_MIN，免得框翻面（左跑到右、上跑到下）
        function clampFreeBox() {
            fcBox.w = Math.min(Math.max(FC_MIN, fcBox.w), fcImg.width);
            fcBox.h = Math.min(Math.max(FC_MIN, fcBox.h), fcImg.height);
            fcBox.x = Math.min(Math.max(0, fcBox.x), fcImg.width - fcBox.w);
            fcBox.y = Math.min(Math.max(0, fcBox.y), fcImg.height - fcBox.h);
        }

        function openFreeCrop(img, onConfirm, onCancel, out) {
            fcImg = img;
            fcOnConfirm = onConfirm; fcOnCancel = onCancel || null; fcOut = out || null;
            const s = freeCropFit(img.width, img.height);
            const dw = Math.max(1, Math.round(img.width * s));
            const dh = Math.max(1, Math.round(img.height * s));
            // 取两个方向里小的那个比例，图就一定在画布内，富余的那不到 1px 留白
            fcScale = Math.min(dw / img.width, dh / img.height);
            freeCropCanvas.width = dw; freeCropCanvas.height = dh;
            freeCropStage.style.width = dw + 'px';
            freeCropStage.style.height = dh + 'px';
            freeCropCanvas.getContext('2d').drawImage(img, 0, 0, dw, dh);
            // 默认整张图 —— 跟老那套打开就是「整张」一个意思，所以进来直接点确认 = 不裁
            fcBox = { x: 0, y: 0, w: img.width, h: img.height };
            layoutFreeMarquee();
            freeCropModal.style.display = 'flex';
        }

        // 关的时候把 fcImg / fcOut 一起清掉，两个出口都得先把要用的东西取出来再关
        function closeFreeCrop() {
            freeCropModal.style.display = 'none';
            fcOnConfirm = null; fcOnCancel = null; fcOut = null; fcImg = null; fcDrag = null;
        }

        freeMarquee.addEventListener('pointerdown', (e) => {
            if (!fcImg) return;
            e.preventDefault();          // 否则浏览器当成「拖拽图片 / 划选文字」，drag 会截走指针
            // 捕获一下，指针滑出框也不断线。合成事件（自动测试里那种）没有活跃指针，这一句
            // 会抛 NotFoundError —— 抛了也只是失去「滑出去还跟着」这一条，不该把整次拖拽带崩。
            try { freeMarquee.setPointerCapture(e.pointerId); } catch (err) { /* 没有活跃指针，照样拖 */ }
            // 按在把手上是缩放，按在框里其它地方是整体移动
            const h = e.target.dataset ? e.target.dataset.h : '';
            fcDrag = { h: h || '', x: e.clientX, y: e.clientY, box: { ...fcBox } };
        });

        freeMarquee.addEventListener('pointermove', (e) => {
            if (!fcDrag || !fcImg) return;
            const dx = (e.clientX - fcDrag.x) / fcScale;
            const dy = (e.clientY - fcDrag.y) / fcScale;
            const b0 = fcDrag.box, h = fcDrag.h;
            if (!h) {
                fcBox.x = b0.x + dx; fcBox.y = b0.y + dy;
            } else {
                // 拉哪条边只动哪条边，对边钉死。nw 这种角同时含两个方向，两段都走到
                let l = b0.x, t = b0.y, r = b0.x + b0.w, b = b0.y + b0.h;
                if (h.indexOf('w') >= 0) l = b0.x + dx;
                if (h.indexOf('e') >= 0) r = b0.x + b0.w + dx;
                if (h.indexOf('n') >= 0) t = b0.y + dy;
                if (h.indexOf('s') >= 0) b = b0.y + b0.h + dy;
                // 拖穿了就停在 FC_MIN 上，别让左边越过右边（越过之后 clampFreeBox 也救不回来）
                if (r - l < FC_MIN) { if (h.indexOf('w') >= 0) l = r - FC_MIN; else r = l + FC_MIN; }
                if (b - t < FC_MIN) { if (h.indexOf('n') >= 0) t = b - FC_MIN; else b = t + FC_MIN; }
                fcBox = { x: l, y: t, w: r - l, h: b - t };
            }
            clampFreeBox();
            layoutFreeMarquee();
        });

        function endFreeDrag() { fcDrag = null; }
        freeMarquee.addEventListener('pointerup', endFreeDrag);
        freeMarquee.addEventListener('pointercancel', endFreeDrag);

        function freeCropOutput() {
            const sw = Math.min(Math.round(fcBox.w), fcImg.width);
            const sh = Math.min(Math.round(fcBox.h), fcImg.height);
            const sx = Math.min(Math.round(fcBox.x), fcImg.width - sw);
            const sy = Math.min(Math.round(fcBox.y), fcImg.height - sh);
            // 选框本来就是图片像素，所以出图只有「别超过真像素」这一条 —— 老那套还得除掉
            // cropZoom，因为那边的框量的是屏幕像素。放大过的框不会因此变糊，只是不涨像素。
            const k = Math.min(1, ((fcOut && fcOut.size) || 1400) / Math.max(sw, sh));
            const cvs = document.createElement('canvas');
            cvs.width = Math.round(sw * k);
            cvs.height = Math.round(sh * k);
            cvs.getContext('2d').drawImage(fcImg, sx, sy, sw, sh, 0, 0, cvs.width, cvs.height);
            return cvs.toDataURL((fcOut && fcOut.type) || 'image/png', fcOut && fcOut.quality);
        }

        document.getElementById('btnConfirmFreeCrop').addEventListener('click', () => {
            const cb = fcOnConfirm;
            // 先出图再关弹窗：关的时候会把 fcImg / fcOut 一起清掉
            const src = freeCropOutput();
            closeFreeCrop();
            if (cb) cb(src);
        });

        // 「取消」和「×」是同一条路：谁都不叫，回到打开弹窗之前
        function cancelFreeCrop() {
            const cb = fcOnCancel;
            closeFreeCrop();
            if (cb) cb();
        }
        document.getElementById('btnCancelFreeCrop').addEventListener('click', cancelFreeCrop);
        document.getElementById('btnCloseFreeCrop').addEventListener('click', cancelFreeCrop);

        document.getElementById('debugImageInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    // 单张图没有网格比例可依，仍旧用 300×300 的方框
                    openCropModal(img, 300, 300, (src) => {
                        dbgMat.imageSrc = src;
                        refreshPreview();
                    }, () => {
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = 512; tempCanvas.height = 512;
                        tempCanvas.getContext('2d').drawImage(img, 0, 0, 512, 512);
                        dbgMat.imageSrc = tempCanvas.toDataURL();
                        refreshPreview();
                    });
                };
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        // =====================================================================
        // 切片照片导入：裁剪 / 直接拉伸
        // =====================================================================
        let rawSliceImg = null;                  // 原图，留给「重新裁剪」

        // 弹窗里那个框按长边 320px 缩一下就行（3 行 4 列时会是个 320×239 的横框）——
        // 这只决定框在屏幕上看着多大，实际出图的尺寸在 openSliceCrop 的 out 里另算。
        function sliceBoxSize() {
            const { totalW, totalH } = gridMetrics();
            const k = 320 / Math.max(totalW, totalH);
            return { w: Math.round(totalW * k), h: Math.round(totalH * k) };
        }

        // 「这张图被采用了」那点收尾：确认和直接拉伸都要走，取消（×）不走。
        // rawSliceImg 是留给「重新裁剪」的原图；按钮必须写成 flex —— .chip 是
        // inline-flex，图标和字都靠它居中，写成 inline-block 会把这行覆盖掉，
        // 图标就贴到左边去，不居中。
        // 这两行原本搁在打开弹窗之前，于是取消根本取消不掉：「重新裁剪」按钮已经亮
        // 起来了，而它认的图其实没被采用，再点一次裁的是一张不在台上的图。
        function adoptSliceImage(img) {
            rawSliceImg = img;
            document.getElementById('btnRecropSlice').style.display = 'flex';
        }

        function openSliceCrop(img) {
            const { w, h } = sliceBoxSize();
            const { totalW, totalH } = gridMetrics();
            openCropModal(img, w, h, (src) => {
                adoptSliceImage(img);
                const out = new Image();
                out.onload = () => { currentSlicedImage = out; renderGrid(); };
                out.src = src;
            }, () => { adoptSliceImage(img); currentSlicedImage = img; renderGrid(); }, {
                // 出图按导出像素来，不按框来。这张图在导出里是铺满整个网格的
                // （totalW × totalH 个 CSS 像素，再乘 EXPORT_SCALE），3×3 就是 736px，
                // 而框只有 320 —— 照框出图等于把 320 拉成 736，糊在这一步。
                // 源图不够大时 renderCropOut 里那道 1/cropZoom 会兜住，最多到源图 1:1；
                // 只有源图比框还小（源图短边不足 320）时，那里还有一道下限顶着，
                // 存下来仍是框那么大 —— 那是三个导入口共用的老规矩，本想改
                // （存源图真像素、让浏览器只放大一次反而更清楚），先记在这儿。
                // 用 JPEG 不用 PNG：这张图会以 data URL 塞进导出的 SVG，1200px 级的
                // PNG 一张就几 MB，两张就顶到 img.src 的天花板了。
                size: Math.round(Math.max(totalW, totalH) * EXPORT_SCALE),
                type: 'image/jpeg', quality: 0.9,
            });
        }

        document.getElementById('fileInput').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            e.target.value = '';                 // 清掉，同一个文件再选一次也能触发 change
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                // 照片先别记到 rawSliceImg 上、按钮也别亮 —— 等裁剪弹窗真被确认了
                // 再说（adoptSliceImage）。搁在这儿的话，按 × 取消就等于没取消。
                img.onload = () => openSliceCrop(img);
                img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
        });

        document.getElementById('btnRecropSlice').addEventListener('click', () => {
            if (rawSliceImg) openSliceCrop(rawSliceImg);
        });

        // =====================================================================
        // 导出背景（舞台那层的底：透明 / 纯色 / 图片，后两档叠一层纸纹）
        // =====================================================================
        // 铺的是「舞台」不是「画布」：导出取的是 .stage-container 整个盒子
        // （画布 368×368 加上四周那圈 70px 边距），背景自然得盖满这一整个盒子。
        // 照片底座是上面另一层、只有画布那么大，所以它只挡住中间那块，外面一圈
        // 露出来的就是这个背景 —— 两层各管各的，谁也不覆盖谁。
        //
        // 「透明」档屏幕上仍然是灰的：那是给你看清舞台边界的衬底，不是作品的一
        // 部分。导出时由 buildStageImage 把它压成真透明。
        // 「透明」档屏幕上衬的灰 —— 拿舞台本来的底色当衬底，导出时压掉。
        // 跟 .stage-container 那条 CSS 的兜底值已经不是一回事了：那条现在兜的是
        // 默认的纯色底，这里纯粹是「透明档在屏幕上该长什么样」。
        const STAGE_BG_FALLBACK = '#dcd7ce';

        let bgMode = 'color';     // 'none' | 'color' | 'image'，默认纯色
        let bgColor = '#9aa4bc';  // rgb(154, 164, 188)
        let bgImage = null;       // data URL。file:// 下必须是 data:，理由同纸纹那两条注释

        const stageTex = document.querySelector('.stage-tex');
        const btnBg = document.getElementById('btnBg');
        const bgSwatch = document.getElementById('bgSwatch');
        const bgModeName = document.getElementById('bgModeName');
        const bgPanel = document.getElementById('bgPanel');
        const bgColorInput = document.getElementById('bgColorInput');
        const bgThumb = document.getElementById('bgThumb');
        const bgHint = document.getElementById('bgHint');
        const bgRecrop = document.getElementById('btnBgRecrop');
        const bgFileInput = document.getElementById('bgFileInput');

        // 选了「图片」但还没挑文件时，别把舞台变成一片透明 —— 当透明档处理，
        // 面板里给一句提示。这样取消选文件也不用去检测，状态自己是对的。
        function effBgMode() {
            return (bgMode === 'image' && !bgImage) ? 'none' : bgMode;
        }

        function applyStageBg() {
            const mode = effBgMode();
            // 变量写在舞台自己身上而不是 :root —— 克隆舞台时行内样式跟着走，
            // 导出那份不用再补一遍
            stageContainer.style.setProperty('--stage-bg-color',
                mode === 'color' ? bgColor : mode === 'image' ? 'transparent' : STAGE_BG_FALLBACK);
            stageContainer.style.setProperty('--stage-bg-image',
                mode === 'image' ? `url("${bgImage}")` : 'none');
            // 透明档底下没东西可铺，纸纹一起收了 —— 留着就是一层灰扑扑的颗粒浮在空气里
            stageTex.style.display = mode === 'none' ? 'none' : 'block';
            syncBgUI();
        }

        function syncBgUI() {
            document.querySelectorAll('input[name="bgMode"]').forEach((r) => { r.checked = r.value === bgMode; });
            bgColorInput.disabled = bgMode !== 'color';
            bgThumb.hidden = !bgImage;
            if (bgImage) bgThumb.src = bgImage;
            // 裁过一次之后才谈得上「重新裁剪」—— 没选过图的时候手上没有原图
            bgRecrop.hidden = !bgRaw;

            // 按钮上那个小色块，一眼看出当前选的是什么底
            bgSwatch.className = 'bg-swatch';
            bgSwatch.style.background = '';
            if (bgMode === 'color') {
                bgSwatch.style.background = bgColor;
            } else if (effBgMode() === 'image') {
                bgSwatch.style.background = `#fff url("${bgImage}") center/cover no-repeat`;
            } else {
                bgSwatch.classList.add('is-none');   // 虚线空框：没有颜色可显示
            }
            // 色块旁边再把这一档的名字写出来。色块是给已经知道「哪个颜色是哪档」的人
            // 看的，第一次用的人得看见字。认 effBgMode：选了图片却还没挑文件时
            // 舞台上铺的就是透明，这里写「图片」会跟看到的不一致。
            const effMode = effBgMode();
            bgModeName.textContent = effMode === 'color' ? '纯色' : effMode === 'image' ? '图片' : '透明';

            bgHint.textContent = (bgMode === 'image' && !bgImage) ? '还没选图片' : '';
        }

        btnBg.addEventListener('click', (e) => {
            e.stopPropagation();      // 不然这一下会冒到 document，被「点外面收起来」当场关掉
            bgPanel.hidden = !bgPanel.hidden;
        });
        document.addEventListener('click', (e) => {
            // 裁剪弹窗也算「里面」：它是从这块面板里点出来的，在弹窗上拖一下
            // 就把面板收了的话，裁完还得再点一次背景按钮才回得来
            if (bgPanel.hidden || bgPanel.contains(e.target)
                || cropModal.contains(e.target) || freeCropModal.contains(e.target)) return;
            bgPanel.hidden = true;
        });
        // Esc 关掉最上面那层。裁剪弹窗是 2000、浮在背景面板上面，所以先轮到它；
        // 该先应谁就 return，一次 Esc 只关一层。
        document.addEventListener('keydown', (e) => {
            if (e.key !== 'Escape') return;
            if (cropModal.style.display === 'flex') { cancelCrop(); return; }
            if (freeCropModal.style.display === 'flex') { cancelFreeCrop(); return; }
            // 背景面板这里必须补一个 return：原来是最后一句、不 return 也无所谓，
            // 现在它后面还有别人，不 return 就会一次 Esc 关掉两层。
            if (!bgPanel.hidden) { bgPanel.hidden = true; return; }
            // 横条排最后：它不是弹窗，只是可以收起来腾地方。收起不 clear，随时能再点开。
            // 走 setStripOpen，别直接改 hidden —— 按钮上那颗蓝色也跟着它一起灭。
            if (!shotStripEl.hidden) setStripOpen(false);
        });

        document.querySelectorAll('input[name="bgMode"]').forEach((r) => {
            r.addEventListener('change', () => {
                bgMode = r.value;
                applyStageBg();
                // 选「图片」但手上还没图 —— 直接把选文件那步顶上来，省一次点击。
                // 取消了也不要紧，effBgMode 会把没图的图片档当透明
                if (bgMode === 'image' && !bgImage) bgFileInput.click();
            });
        });

        // 这个按钮在 <label> 里，不拦一下的话点它顺带还会去切那个单选
        document.getElementById('btnBgPick').addEventListener('click', (e) => {
            e.preventDefault();
            bgFileInput.click();
        });

        // 同上：拦一下别让它去切单选。手里还留着原图，重开一次裁剪框就行，
        // 不用再走一遍选文件
        bgRecrop.addEventListener('click', (e) => {
            e.preventDefault();
            openBgCrop();
        });

        bgColorInput.addEventListener('input', () => {
            bgColor = bgColorInput.value;
            bgMode = 'color';         // 动色板就是想用纯色，顺手切过去
            applyStageBg();
        });

        // 选完文件先进裁剪弹窗，裁出来的那块才铺到舞台上 —— 舞台那边是 cover，
        // 框又是照舞台比例开的，所以裁完严丝合缝，不会有第二次裁切。
        // 「不裁剪直接拉伸」= 整张铺上去（cover 之下等于居中裁），也就是加这一步
        // 之前的老样子，留个后路。
        let bgRaw = null;          // 原图（解码好的 Image + 原始 data URL），留给「重新裁剪」

        // raw 只有「刚选完文件」那一趟会传进来：那时候还不能写进 bgRaw —— 按 × 取消
        // 就等于这张图没选过，bgRaw 得留在原来那张上（syncBgUI 拿它决定「重新裁剪」
        // 显不显示，记早了会冒出一个指向没被采用的图的按钮）。「重新裁剪」按钮不传参，
        // 用的就是已经采用过的那张。
        function openBgCrop(raw) {
            const picked = raw || bgRaw;
            if (!picked) return;
            const im = picked.im;
            // 框照舞台的比例开（舞台是 368 的画布加四周 70px 边距，正好方正，
            // 但别写死）。长边 320，跟切片那个框一个口径。
            const sw = stageContainer.offsetWidth || 1;
            const sh = stageContainer.offsetHeight || 1;
            const long = 320;
            const box = (sw >= sh)
                ? { w: long, h: Math.max(1, Math.round(long * sh / sw)) }
                : { w: Math.max(1, Math.round(long * sw / sh)), h: long };
            // 输出分辨率照着导出的像素来（舞台 508 CSS px × EXPORT_SCALE = 1016），
            // 并且压成 JPEG：这张 data URL 会写进舞台的行内样式、跟着克隆体进 SVG，
            // 而整份 SVG 塞进 img.src 那边 8MB 封顶（实测），PNG 能顶穿它。
            openCropModal(im, box.w, box.h, (src) => {
                bgRaw = picked; setBgImage(src);
            }, () => {
                bgRaw = picked; setBgImage(shrinkBgImage(picked));
            }, {
                size: Math.round(Math.max(sw, sh) * EXPORT_SCALE),
                type: 'image/jpeg', quality: 0.88,
            });
        }

        function setBgImage(src) {
            bgImage = src;
            bgMode = 'image';
            applyStageBg();
        }

        bgFileInput.addEventListener('change', async () => {
            const file = bgFileInput.files && bgFileInput.files[0];
            if (!file) return;
            bgFileInput.value = '';   // 清掉，同一张图再选一次还能触发 change
            try {
                openBgCrop(await readBgFile(file));
            } catch (err) {
                showToast('背景图读取失败：' + err.message);
            }
        });

        // 读成 data URL 顺手把图也解码出来 —— file:// 下磁盘路径的图画进 canvas
        // 会污染，而且 SVG 是从 data: URL 加载的，它也够不着磁盘上的文件，两条
        // 都跟纸纹那边同理。解码出来的 Image 给裁剪弹窗用，data URL 留给
        // 「不裁剪直接拉伸」。
        function readBgFile(file) {
            return new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onerror = () => reject(new Error('读不出这个文件'));
                fr.onload = () => {
                    const im = new Image();
                    im.onerror = () => reject(new Error('不是有效的图片'));
                    im.onload = () => resolve({ im, dataURL: fr.result });
                    im.src = fr.result;
                };
                fr.readAsDataURL(file);
            });
        }

        // 大图先降采样：整份 SVG 最后要塞进 img.src，那边 8MB 封顶（实测），
        // 一张几 MB 的照片 base64 之后能顶穿它，导出会直接失败。
        const BG_IMG_MAX = 2000;
        function shrinkBgImage({ im, dataURL }) {
            const scale = Math.min(1, BG_IMG_MAX / Math.max(im.naturalWidth, im.naturalHeight));
            if (scale >= 1) return dataURL;   // 本来就不大，原样用
            const cvs = document.createElement('canvas');
            cvs.width = Math.round(im.naturalWidth * scale);
            cvs.height = Math.round(im.naturalHeight * scale);
            cvs.getContext('2d').drawImage(im, 0, 0, cvs.width, cvs.height);
            // 缩过的走 JPEG：背景图不指望有透明通道，q88 够看且小得多
            return cvs.toDataURL('image/jpeg', 0.88);
        }

        applyStageBg();   // 初值就是默认的纯色底，把行内变量和开关上的色块对齐

        // =====================================================================
        // 导出舞台（PNG · 按舞台外框裁切 · 底由上面的背景设置决定）
        // =====================================================================
        // 舞台上没有一张现成的「整幅画」可以 toDataURL：网格便签是 DOM + CSS 变换，
        // 3D 便签是各自一块 WebGL 画布，别针是带变换的 <img>。所以走 foreignObject —
        // 把舞台整个克隆一份塞进 SVG 交给浏览器按同一套 CSS 重画，再光栅化成图。
        // 这样投影、翘角暗部、底图抠洞（mask）、纸纹的 multiply 全都照旧，不用手抄一遍。
        const EXPORT_SCALE = 2;      // 舞台上 1px 出 2px，导出放大看不糊
        // 整份 SVG 要塞进 img.src，那边 8MB 封顶（实测）。内联的别针素材会把它撑大，
        // 超了就在这儿拦下来报错，别让它跑到 loadImageEl 里变成一句没头没脑的
        // 「光栅化失败」。留一点余量。
        const SVG_URL_MAX = 7.5 * 1024 * 1024;

        // 只加在导出那份 SVG 里的 CSS。编辑态的东西（选中框、删除按钮、别针控件、
        // 幽灵便签）是工具不是作品，一律不出现；舞台自己的灰底和内侧阴影同理。
        const EXPORT_CSS = `
            .sticky-note.deleted { visibility: hidden !important; }
            .sticky-note.selected { outline: none !important; }
            .action-btn, .node-action-btn, .pin-ui { display: none !important; }
            /* 舞台：底色/底图不在这儿管，它写在舞台的行内变量上、跟着克隆过来了。
               这里只管两件编辑界面的事 —— 内侧阴影是给你看的暗角，不是作品的一部分；
               圆角同理，有底色之后圆角会切进画面，导出的该是方正的整块（.stage-tex
               是 border-radius: inherit，跟着一起归零）。 */
            .stage-container { box-shadow: none !important; border-radius: 0 !important; }
            .export-text-img { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
            .export-canvas-img { display: block; }
        `;

        // foreignObject 里认不出页面用 FontFace 注册的手写字体：SVG 图片是独立文档，
        // 页面的 @font-face 跟不过去，写相对路径的外链字体它也不加载（两条都实测过），
        // 字会掉回系统楷体。所以便签上的字先在主文档里画成图 —— 主文档的 canvas 认得
        // 那个字体 —— 再当 <img> 塞回克隆体。断行/行距/垂直居中三条对齐 .note-text，
        // 跟 buildFusedTextureCanvas 里烘 3D 贴图用的是同一套算法。
        //
        // bend 只有「预览」会传：弯了的字在 DOM 里本来就是张图，导出的换图那一趟
        // 认的是 textContent，根本轮不到这儿（传不传都是 0）。
        function renderNoteTextImage(textEl, w, h, bend) {
            bend = bend || 0;
            const cvs = document.createElement('canvas');
            cvs.width = Math.max(1, Math.round(w * EXPORT_SCALE));
            cvs.height = Math.max(1, Math.round(h * EXPORT_SCALE));
            const ctx = cvs.getContext('2d');
            const pad = 6 * EXPORT_SCALE;                       // .note-text 的 padding: 6px
            const fpx = (parseFloat(textEl.style.fontSize) || 24) * EXPORT_SCALE;

            ctx.font = `bold ${fpx}px ${textEl.style.fontFamily || fontStack()}`;
            ctx.fillStyle = textEl.style.color || '#545454';
            ctx.textAlign = 'center';
            // 不能用 textBaseline='middle'：它按 em 盒居中，CSS 是按行盒（1.25em）居中、
            // 行盒里再按字体自己的 ascent/descent 排 —— 两者差着一个半行距，字会整体偏下
            // 一个像素（30px 字号下量出来的）。照 CSS 的算法写：块垂直居中，行内让开半行距。
            ctx.textBaseline = 'alphabetic';
            const fm = ctx.measureText('Hg');                   // 量的是 strut 那个字体，和 .note-text 一致
            const ascent = fm.fontBoundingBoxAscent;
            const descent = fm.fontBoundingBoxDescent;

            const lines = wrapCanvasText(ctx, textEl.textContent, cvs.width - pad * 2);
            const lh = fpx * 1.25;                              // .note-text 的 line-height: 1.25
            const blockTop = (cvs.height - lines.length * lh) / 2;
            lines.forEach((line, i) => {
                const baseY = blockTop + i * lh + (lh - ascent - descent) / 2 + ascent;
                drawTextLine(ctx, line, cvs.width / 2, baseY, bend, fpx);   // 空行也要占一行的高度
            });
            return cvs.toDataURL('image/png');
        }

        function loadImageEl(src) {
            return new Promise((resolve, reject) => {
                const im = new Image();
                im.onload = () => resolve(im);
                im.onerror = () => reject(new Error('光栅化失败'));
                im.src = src;
            });
        }

        // =====================================================================
        // 导出前的准备
        // =====================================================================
        // 手机上经常「图还没解码完就点了导出」：第一张缺贴纸、缺纹理，第二张才好
        // —— 那时它们已经进了缓存。与其去猜时机，不如把「没好就等」做成看得见的事：
        // 没好就挡一层转圈，好了自己消失，再往下走。
        //
        // 每一项都带兜底，任何一处卡住都不能把导出卡死：等不到就照原样往下走，
        // 大不了退回「第一张缺东西」（也就是现在的行为），不会更糟。
        const EXPORT_READY_MAX = 8000;    // 一共最多等这么久
        const EXPORT_READY_PROBE = 120;   // 先给这么久看它能不能立刻就好
        const EXPORT_READY_STEP = 60;
        const EXPORT_READY_MIN_SHOW = 260; // 亮了至少停这么久，别闪一帧
        let exportedOnce = false;         // 导出成功过没有 —— 决定那次预热还要不要做

        // 舞台上所有 <img>。已经解好的立刻 resolve；裂图 reject —— 两样都得接住。
        function imgDecoded(el) {
            const done = el.complete ? Promise.resolve() : new Promise((res) => {
                el.addEventListener('load', res, { once: true });
                el.addEventListener('error', res, { once: true });
            });
            return done.then(() => (el.decode ? el.decode().catch(() => {}) : null));
        }

        // CSS 背景图没有元素可以 decode，只能把 url 抠出来单独加载一遍。
        // 纸纹（--paper-tex / --bg-tex）、切图、导入的底图全在这一类里 ——
        // 它们正是「第一次导出纹理没有」的那几张。
        function bgImageUrls(root) {
            const out = new Set();
            [root, ...root.querySelectorAll('*')].forEach((el) => {
                let bg;
                try { bg = getComputedStyle(el).backgroundImage; } catch (e) { return; }
                if (!bg || bg === 'none') return;
                for (const m of bg.matchAll(/url\((["']?)(.*?)\1\)/g)) if (m[2]) out.add(m[2]);
            });
            return [...out];
        }

        function warmImage(u) {
            const im = new Image();
            const done = new Promise((res) => {
                im.addEventListener('load', res, { once: true });
                im.addEventListener('error', res, { once: true });
            });
            im.src = u;
            return done.then(() => (im.decode ? im.decode().catch(() => {}) : null));
        }

        // 先问一句「舞台上这些东西都就位了吗」，返回「有没有真等」。
        //
        // 说清楚它能管什么、不能管什么：它管的是**主文档**这半边 —— 字体没落定、
        // 刚加进去的照片还没解码完。它**管不了**「第一次导出丢纹理/丢贴纸」那件事，
        // 那是 SVG 子文档的竞速（实测：同一份 data URI 在屏幕上早就解码过，
        // 第一次导出照样缺）—— 主文档的解码喂不到那条路上。那件事由下面的预热光栅解决。
        //
        // 但两件事的**判据是同一个**：缓存热不热。所以这里等过 ⇒ 冷 ⇒ 预热该做。
        async function ensureExportReady() {
            const work = (async () => {
                // 手写字体还在 loading 时，字那儿是个转圈，量出来的尺寸不对，
                // 字换的图会跟着错位。给它设个上限，别为它无限等。
                const t0 = Date.now();
                while (fontState === 'loading' && Date.now() - t0 < 5000) {
                    await new Promise((r) => setTimeout(r, EXPORT_READY_STEP));
                }
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await Promise.all([...stageContainer.querySelectorAll('img')].map(imgDecoded));
                await Promise.all(bgImageUrls(stageContainer).map(warmImage));
            })();

            let settled = false;
            work.then(() => { settled = true; }, () => { settled = true; });
            // 绝大多数时候东西都在缓存里，这种情况不该闪一下浮层
            await Promise.race([work, new Promise((r) => setTimeout(r, EXPORT_READY_PROBE))]);
            if (settled) return false;
            // 还没好：再给它一个上限，等不到就照原样往下走，不能把导出卡死
            await Promise.race([work, new Promise((r) => setTimeout(r, EXPORT_READY_MAX))]);
            return true;
        }

        // ---- 浮层：点亮 / 撤掉 --------------------------------------------------
        // 单独拎出来，是因为它要盖的比 buildStageImage 这一个函数长：从「等素材
        // 就位」一直罩到「图烤好了、马上交给浏览器下载」。
        //
        // 原先它盖在 buildStageImage 里面，撤得早 —— 后面还剩一记 toBlob（大图上
        // 要小半秒），那半秒是空档，手机上看着就像「没准备就弹下载框了」。
        // 而且原先只在「冷场」才亮，冷热是猜的；猜错一次这一整晚就都看不见它。
        // 现在不猜了：按导出就亮，一直到图烤好。
        let exportWaitOn = false;
        let exportWaitAt = 0;
        let exportWaitGuard = 0;

        function setExportWaitText(s) {
            const el = document.getElementById('exportWaitText');
            if (el && el.textContent !== s) el.textContent = s;
        }

        async function beginExportWait() {
            const box = document.getElementById('exportWait');
            if (!box || exportWaitOn) return;
            exportWaitOn = true;
            exportWaitAt = Date.now();
            setExportWaitText('请稍等，正在准备…');
            box.classList.add('on');
            // 硬保险：万一哪条路抛在了 finally 够不着的地方，浮层绝不能留在屏幕上
            // 把整个页面挡死 —— 那比没有浮层糟得多。
            clearTimeout(exportWaitGuard);
            exportWaitGuard = setTimeout(() => {
                exportWaitOn = false;
                box.classList.remove('on');
            }, 30000);
            // 点亮之后必须让出两帧，浏览器才真的把它画上屏 —— 再往下走就是同步
            // 光栅，主线程一口气占住，浮层要等干完才第一次出现（那就等于没有）。
            await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        }

        // 不 async：不等它，免得白白推迟下载。撤的动作挂在定时器里，
        // 「既然亮了就多停一下」由 EXPORT_READY_MIN_SHOW 兜着，别闪一帧。
        // 调用点一律放 finally —— 成功路上撤、失败路上也得撤。
        function endExportWait() {
            if (!exportWaitOn) return;
            exportWaitOn = false;
            clearTimeout(exportWaitGuard);
            const rest = Math.max(0, EXPORT_READY_MIN_SHOW - (Date.now() - exportWaitAt));
            setTimeout(() => {
                // 这中间要是又开了一次导出，就别把人家的浮层撤了
                if (exportWaitOn) return;
                const box = document.getElementById('exportWait');
                if (box) box.classList.remove('on');
            }, rest);
        }

        // onStep 是给浮层报阶段用的，可以不传（面板里调它就不传）。
        async function buildStageImage(onStep) {
            // 先等素材就位（字体、舞台上还没解码的图），再出图。浮层不在这儿管 ——
            // 由调用它的那几处点亮，见上面的 beginExportWait。
            if (onStep) onStep('请稍等，正在准备…');
            const waited = await ensureExportReady();
            if (onStep) onStep('请稍等，正在出图…');

            const W = stageContainer.clientWidth;      // 含 70px 的内边距 —— 那就是画布
            const H = stageContainer.clientHeight;

            // 3D 便签的 WebGL 画布没开 preserveDrawingBuffer，合成之后绘制缓冲就清了，
            // 直接 toDataURL 抓到的是空白。当场重绘一次再抓，同一个任务里来得及。
            freeNotes.forEach((n) => n.noteObj.updateMesh());
            const shots = freeNotes.map((n) => n.noteObj.renderer.domElement.toDataURL('image/png'));

            const clone = stageContainer.cloneNode(true);

            // 选中态整条撤掉 —— 只撤 outline 是不够的。
            // .sticky-note.selected 还带着 transform: … scale(1.1) 和 z-index: 9999
            // （见上面那条触屏段落），那等于在一个混合组里凭空立起一个层叠上下文；
            // 真机上 WebKit 会因此把整组的 mix-blend-mode 一起放弃 —— 背景纹理
            // （.stage-tex）和切片纸纹（.texture-layer）同时没了，别针也陪葬。
            // 放大本身更是不该出现在成品里。
            // 为什么只有选中才坏、悬停不坏：:hover 是实时状态，不会被序列化进克隆体；
            // .selected 是个类名，会原样写进 SVG 并在那边继续命中。
            clone.querySelectorAll('.selected').forEach((el) => el.classList.remove('selected'));

            // 两份纸纹都是挂在 :root 上的变量，SVG 里没有 :root（根是 <svg>），得补到克隆体上
            ['--paper-tex', '--bg-tex'].forEach((v) => {
                clone.style.setProperty(v, document.documentElement.style.getPropertyValue(v));
            });
            // 透明档：屏幕上那层灰底只是衬底，导出要真透明。--stage-bg-color
            // 写在舞台行内样式上、已经跟着克隆过来了，这里把它压掉
            if (effBgMode() === 'none') {
                clone.style.setProperty('--stage-bg-color', 'transparent');
                const t = clone.querySelector('.stage-tex');
                if (t) t.style.display = 'none';
            }

            // 画布换图。cloneNode 保序，两边下标一一对应
            [...clone.querySelectorAll('canvas')].forEach((cv, i) => {
                if (!shots[i]) return;
                const im = document.createElement('img');
                im.className = 'export-canvas-img';
                im.setAttribute('style', cv.getAttribute('style') || '');
                im.src = shots[i];
                cv.replaceWith(im);
            });

            // ── 便签整层：连影带纸，自己画成图 ──
            // 【为什么】真机（iPhone / WebKit）把这份 DOM 序列化成 SVG、再当图片光栅化时，
            // 走的是一条跟屏幕预览不同的、近似实现的旧路。便签身上凡是「跟坐标空间有关」
            // 的 CSS，在那条路上都靠不住。这个项目已经撞过三处，全是同一类：
            //   · box-shadow —— 模糊半径跟着 zoom:2 放大，偏移量却不跟，本该只落在下方的
            //     那道影绕着便签围了一圈，上面那圈最扎眼（那儿本来一片干净）。
            //     2026-10-04 真机八变体实测（面板「阴影定位」）：只有「抹掉 box-shadow」
            //     那一张把便签上方那道影去掉了（近带 155.7 / 远带 159.3，差 3.6；
            //     其余七张差 19~32，全没动）。
            //   · background-size / background-position —— 拼图便签靠这两个数从整张切图
            //     里取自己那一格，错一点就是整整一格的错位。
            //   · mix-blend-mode: multiply（纸纹层）配 radial-gradient（四角暗部）。
            // 与其一条一条去猜 WebKit 认哪条不认哪条，不如把便签整个从那条路上摘下来：
            // 三层都在这儿用 canvas 画成图，克隆体里只留 <img>。
            // 「把一张 PNG 摆到指定位置」是那条路上最不可能出错的操作。
            //
            // 【怎么画的】按 .sticky-img-inner / .corner-shadow / .texture-layer 三层的
            // 语义逐条复刻。底色/底图/纸纹从**活元素的行内样式**上读 —— 便签长什么样是
            // JS 写在行内样式里的（paint2DNote），读它就不会跟屏幕上那份跑偏；
            // 四角暗部直接读 p2，省得去解析自己刚写出去的 CSS 字符串。
            //
            // 【字为什么不一起画】字那张图（见下面的「字换图」）是按 1× 导出分辨率画的，
            // 画进这张放大了 影倍 倍的画布等于把它放大，反而糊；而且它本来就不碰上面
            // 那三个属性 —— 它自己就是一张 PNG。所以字照旧单独一张，叠在最上面。
            //
            // 【为什么出两张图】影那张必须带透明（便签框外是透明的），纸身那张是不透明的
            // —— 分开出，纸身就能走 JPEG，同样的画面小一个量级。SVG 有 7.5MB 的天花板
            // （SVG_URL_MAX），36 张便签全走 PNG 会顶穿。纸身要是本来半透明（面板上调过
            // 透明度），分开画反而更对：它就该半透明地叠在自己的影上。
            //
            // 【影图为什么比最终尺寸多一倍像素】画布按 S = EXPORT_SCALE * 影倍，CSS 尺寸
            // 照旧。图是落在被 3D 变换过的便签里的，等尺寸贴上去会被那层采样糊掉，便签
            // 下沿就变得不清晰不明确；多这一倍是给 GPU 缩小采样留的余量。
            const 阴影层 = (css) => {
                // inset 这边不重现，宁可整个不动（本文件没有 inset 便签影）
                if (!css || /\binset\b/i.test(css)) return null;
                // 颜色和「偏移/模糊/扩散」两组分开抓再按序配对 —— box-shadow 简写里
                // 颜色写在前面还是后面都合法，本文件两种写法都有
                const ns = css.match(/-?[\d.]+(?:px)?\s+-?[\d.]+px\s+-?[\d.]+px(?:\s+-?[\d.]+px)?/g) || [];
                const cs = css.match(/rgba?\([^)]*\)/g) || [];
                if (ns.length !== cs.length) return null;
                return ns.map((n, i) => {
                    const v = n.trim().split(/\s+/).map((s) => parseFloat(s) || 0);
                    return { color: cs[i], x: v[0], y: v[1], blur: v[2], spread: v[3] || 0 };
                });
            };
            // 便签纸纹：屏幕上 .texture-layer 用的那一份（--paper-tex），配方逐条照抄
            //   mix-blend-mode: multiply  -> globalCompositeOperation = 'multiply'
            //   filter: grayscale(100%)    -> 自己按 luma 算一遍
            //   opacity: 0.7               -> globalAlpha
            //   background-size: 100% 100% -> 每张便签上拉满
            // 灰度为什么不用 ctx.filter：那又是引擎差异。3D 那条路
            // （buildFusedTextureCanvas）用的是它、注释写着「贴图本身已纯灰，空转」。
            // 这边不赌它灰不灰，512² 算一遍也就几毫秒，所有便签共用这一份。
            // 两张图都比最终尺寸多一倍像素（S影 / S身 = EXPORT_SCALE * 2），CSS 尺寸照旧。
            // 便签身上压着 3D 变换（rotateZ/rotateX/rotateY/translateZ），合成器会把它
            // 当成一块纹理重新采样一遍；正正好好的 1:1 源在这一步是放大，看着就糊。
            // 实测（Edge 6×6，全图横向梯度能量）：身倍 1 → 掉 27%，身倍 2 → 掉 9.5%，
            // 身倍 3 → 不更好而 SVG 涨到 6.9MB。所以 2 是这一步的顶。
            // 再往里看一层：这 9.5% 几乎全在便签边界那一像素上（见下面挖空那段），
            // 纸纹颗粒本身是逐像素对得上的（改前 242/246/242/246，改后 242/247/240/247）。
            const 影倍 = 2;
            const 身倍 = 2;
            const S影 = EXPORT_SCALE * 影倍;
            const S身 = EXPORT_SCALE * 身倍;
            const 纸身质量 = 0.92;      // 纸身走 JPEG：它不透明，照片和纸纹最吃这个格式
            const 纸纹 = await (async () => {
                let im = (paperTexImg && paperTexImg.complete && paperTexImg.naturalWidth)
                    ? paperTexImg : null;
                if (!im) {
                    const sv = document.documentElement.style.getPropertyValue('--paper-tex').trim();
                    const m = /^url\((["']?)([\s\S]*)\1\)$/.exec(sv);
                    try { im = await loadImageEl(m ? m[2] : sv); } catch (e) { return null; }
                }
                try {
                    const c = document.createElement('canvas');
                    c.width = im.naturalWidth; c.height = im.naturalHeight;
                    const x = c.getContext('2d', { willReadFrequently: true });
                    x.drawImage(im, 0, 0);
                    const d = x.getImageData(0, 0, c.width, c.height);
                    const p = d.data;
                    for (let i = 0; i < p.length; i += 4) {
                        const l = (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114) | 0;
                        p[i] = p[i + 1] = p[i + 2] = l;
                    }
                    x.putImageData(d, 0, 0);
                    return c;
                } catch (e) { return null; }    // 拿不到纸纹就不铺，别的照旧
            })();
            // 切片底图所有拼图便签共用同一张；自定义图按 src 各缓存一份
            const 图缓存 = new Map();
            const 取图 = async (src) => {
                if (!src) return null;
                if (!图缓存.has(src)) 图缓存.set(src, await loadImageEl(src).catch(() => null));
                return 图缓存.get(src);
            };
            const 便签表 = new Map(gridNotes.map((n) => [n.el, n]));
            const liveNotes = [...stageContainer.querySelectorAll('.paper-note')];
            const cloneNotes = [...clone.querySelectorAll('.paper-note')];
            for (let i = 0; i < cloneNotes.length; i++) {
                const el = cloneNotes[i];
                const live = liveNotes[i];      // cloneNode 保序，两边下标一一对应
                // 那三层在克隆体里一律撤掉 —— 活都搬到图上做了，留着就是「图上画一份、
                // CSS 再画一份」地叠着。只找便签子树里的：舞台背景照片上那张纸纹
                // （#bgContainer 里的 .texture-layer）不归这儿管，动了就是另一处回归。
                el.querySelectorAll('.sticky-img-inner, .corner-shadow, .texture-layer')
                    .forEach((n) => n.remove());
                // 影在图上、纸身也在图上，CSS 那份 box-shadow 必须关掉 —— 它就是真机上
                // 绕着便签围一圈的那一道。行内的 none 压得过样式表里 .paper-note 那条。
                el.style.boxShadow = 'none';
                // 删掉的便签导出时本来就看不见（EXPORT_CSS 里 visibility: hidden），
                // 不必为它画图；但上面那三层还是得撤 —— 它们的底图是内联的 data URI，
                // 留着就是把一整张切图背进 SVG 里（原先靠 --slice-img 去重挡着）。
                if (!live || el.classList.contains('deleted')) continue;
                const w = live.clientWidth;
                const h = live.clientHeight;
                if (!w || !h) continue;

                // ① 影。参数从行内 --note-shadow 上读，兜底用 CSS 里那条默认值
                const 影列表 = 阴影层(live.style.getPropertyValue('--note-shadow')
                    || '0 2px 6px rgba(0,0,0,0.2)');
                let pad = 0;
                if (影列表) 影列表.forEach((L) => {
                    pad = Math.max(pad, Math.max(Math.abs(L.x), Math.abs(L.y))
                        + Math.abs(L.spread) + L.blur * 1.2);
                });
                pad = Math.ceil(pad) + 2;   // 宁可留宽一点：裁掉一条边比多占几 KB 难看得多
                let 影im = null;
                if (影列表) {
                    const cv = document.createElement('canvas');
                    cv.width = Math.round((w + pad * 2) * S影);
                    cv.height = Math.round((h + pad * 2) * S影);
                    const cx = cv.getContext('2d');
                    // 全程按设备像素算，不借 ctx.scale —— shadowBlur / shadowOffset 吃不吃
                    // 当前变换矩阵各家说法不一，绕开这个歧义
                    影列表.forEach((L) => {
                        cx.shadowColor = L.color;
                        cx.shadowBlur = L.blur * S影;
                        cx.shadowOffsetX = L.x * S影;
                        cx.shadowOffsetY = L.y * S影;
                        cx.fillStyle = '#000';
                        cx.fillRect((pad - L.spread) * S影, (pad - L.spread) * S影,
                            (w + L.spread * 2) * S影, (h + L.spread * 2) * S影);
                    });
                    // canvas 的影是连着形状本身一起画的，上面那几块实心黑得挖掉。
                    // 两个理由：
                    // ① 便签一旦不是全不透明（面板上有透明度滑块），那块黑会从纸身底下
                    //    透出来把便签染脏；
                    // ② 便签是转过角度的，四条边都带抗锯齿，边界那一像素纸身只盖住一半，
                    //    没挖干净的黑就从那儿透出来，给每张便签描一圈黑边。实测跨下沿的
                    //    剖面（便签外侧第一像素的亮度）：不挖空 122、旧版 135、挖空 145
                    //    —— 旧版那条黑边是它一半的浓度。屏幕上没有黑底，所以 145 才是
                    //    跟画布一致的那个。
                    // 挖掉的正好是纸身盖住的那块，露在外面的影一点不少。
                    cx.globalCompositeOperation = 'destination-out';
                    cx.fillStyle = '#000';
                    cx.fillRect(pad * S影, pad * S影, w * S影, h * S影);
                    cx.globalCompositeOperation = 'source-over';

                    影im = document.createElement('img');
                    影im.className = 'export-note-shadow-img';
                    影im.setAttribute('style', 'position: absolute; pointer-events: none;'
                        + ` left: ${-pad}px; top: ${-pad}px;`
                        + ` width: ${w + pad * 2}px; height: ${h + pad * 2}px;`);
                    影im.src = cv.toDataURL('image/png');
                    el.insertBefore(影im, el.firstChild);       // 垫在最底下
                }

                // ② 纸身：底 → 四角暗部 → 纸纹，顺序就是那三层 CSS 的 z-index 顺序
                //    （.sticky-img-inner 在下、.corner-shadow z-index:1、.texture-layer z-index:2）
                const body = document.createElement('canvas');
                body.width = Math.round(w * S身);
                body.height = Math.round(h * S身);
                const bx = body.getContext('2d');
                const 内层 = live.querySelector('.sticky-img-inner');
                bx.fillStyle = (内层 && 内层.style.backgroundColor) || '#ffffff';
                bx.fillRect(0, 0, body.width, body.height);
                const 底 = 内层 ? /url\((["']?)([\s\S]*?)\1\)/.exec(内层.style.backgroundImage || '') : null;
                const 底图 = 底 ? await 取图(底[2]) : null;
                if (底图) {
                    // 画布自己就把越界的地方裁了，等于 .sticky-img-inner 的 overflow: hidden
                    const 尺寸 = (内层.style.backgroundSize || '').trim();
                    const m = /(-?[\d.]+)px\s+(-?[\d.]+)px/.exec(尺寸);
                    if (尺寸 === 'cover') {
                        // background-size: cover + background-position: center
                        const k = Math.max(w / 底图.naturalWidth, h / 底图.naturalHeight);
                        const dw = 底图.naturalWidth * k, dh = 底图.naturalHeight * k;
                        bx.drawImage(底图, (w - dw) / 2 * S身, (h - dh) / 2 * S身, dw * S身, dh * S身);
                    } else if (m) {
                        // 拼图切片：整图按网格总尺寸铺开，再按行列偏移（paint2DNote 写的就是这两个数）
                        const pm = /(-?[\d.]+)px\s+(-?[\d.]+)px/.exec(内层.style.backgroundPosition || '');
                        bx.drawImage(底图, (pm ? +pm[1] : 0) * S身, (pm ? +pm[2] : 0) * S身,
                            +m[1] * S身, +m[2] * S身);
                    } else {
                        bx.drawImage(底图, 0, 0, body.width, body.height);
                    }
                }
                const g = 便签表.get(live);
                if (g) {
                    // 跟 buildCornerGradient 逐条对应：同一个角、同一个 α（p.K * 0.015）、
                    // 同样 0% → 60% 的衰减。它 push 的次序是 BR/BL/TR/TL，而 CSS 的多重
                    // 背景是**后写的先画**，所以下面倒着画。
                    const 角 = [['BR', 1, 1], ['BL', 0, 1], ['TR', 1, 0], ['TL', 0, 0]]
                        .map(([k, x, y]) => ({ x, y, a: (g.p2[k] || 0) * 0.015 }))
                        .filter((o) => o.a > 0);
                    for (let j = 角.length - 1; j >= 0; j--) {
                        const o = 角[j];
                        const cxp = o.x * body.width, cyp = o.y * body.height;
                        // circle 不写尺寸时按 farthest-corner 定半径，跟 CSS 一致
                        let R = 0;
                        [[0, 0], [body.width, 0], [0, body.height], [body.width, body.height]]
                            .forEach(([qx, qy]) => { R = Math.max(R, Math.hypot(qx - cxp, qy - cyp)); });
                        const rg = bx.createRadialGradient(cxp, cyp, 0, cxp, cyp, R);
                        rg.addColorStop(0, `rgba(0,0,0,${o.a})`);
                        rg.addColorStop(0.6, 'rgba(0,0,0,0)');
                        bx.fillStyle = rg;
                        bx.fillRect(0, 0, body.width, body.height);
                    }
                }
                if (纸纹) {
                    bx.globalCompositeOperation = 'multiply';
                    bx.globalAlpha = 0.7;
                    bx.drawImage(纸纹, 0, 0, body.width, body.height);
                    bx.globalAlpha = 1;
                    bx.globalCompositeOperation = 'source-over';
                }
                const 身 = document.createElement('img');
                身.className = 'export-note-img';
                身.setAttribute('style', 'position: absolute; pointer-events: none;'
                    + ' left: 0px; top: 0px;'
                    + ` width: ${w}px; height: ${h}px;`);
                身.src = body.toDataURL('image/jpeg', 纸身质量);
                // 排在影图之上 —— 影图中间那块挖空了，但真正盖住便签位置的是这一张
                el.insertBefore(身, 影im ? 影im.nextSibling : el.firstChild);
            }

            // 字换图。空字、以及手写签名（本来就是 <img>）不用换
            const cloneTexts = [...clone.querySelectorAll('.note-text')];
            [...stageContainer.querySelectorAll('.note-text')].forEach((live, i) => {
                if (!cloneTexts[i] || !live.textContent.trim()) return;
                const im = document.createElement('img');
                im.className = 'export-text-img';
                if (live.style.transform) im.style.transform = live.style.transform;   // 字也是能倾的
                im.src = renderNoteTextImage(live, live.clientWidth, live.clientHeight);
                cloneTexts[i].replaceWith(im);
            });

            // blob: 换 data:。上面两轮只顾到了画布和字，别针的 <img> 漏了 —— 内置那 4 个
            // 是 data: URI 所以看不出来，导入的素材是 createObjectURL 出来的 blob:，
            // 而这份 SVG 是当 data: URL 加载的（理由见下面那段注释），不透明源的文档
            // 根本查不到这个 blob，图就加载失败，浏览器退回去画 <img alt> —— 也就是素材的
            // 文件名，还跟着贴纸的 transform 一起摆位置、缩放、旋转。
            //
            // 内联尺寸按「贴纸在屏幕上的实际大小 × EXPORT_SCALE」，不按原图尺寸：一张
            // 1400px 的抠图直接内联 base64 就是好几 MB，两三张就顶穿 SVG 那个 8MB 天花板；
            // 而别针平时也就 PIN_BASE 那么大，多出来的像素只是把插值糊点存成更大的糊点
            // （同一个道理见 renderCropOut 里的 k）。内联成 JPEG 还是 PNG 看这张图有没有
            // 透明像素，见下面那段。
            const blobSrcs = new Set();
            [...clone.querySelectorAll('img')].forEach((im) => {
                const s = im.getAttribute('src') || '';
                if (s.startsWith('blob:')) blobSrcs.add(s);
            });
            if (blobSrcs.size) {
                // 缩到多小只从 CSS 尺寸和 transform 上算，绝不读 live.naturalWidth ——
                // 那个要等图解码完才有值。刚贴上去、图还在解码，这里读到 0，整张就被当成
                // 「没尺寸」跳过，于是原样复现「导出的是文件名」。解码是下面 loadImageEl
                // 的事，它 resolve 出来的 naturalWidth 一定是好的。
                //
                // 同一份素材可以贴好几处、各自缩放到不一样大：按 src 合并，取最费像素的
                // 那一处定内联尺寸，一张只光栅化一次。
                const livesBySrc = new Map();
                [...stageContainer.querySelectorAll('img')].forEach((el) => {
                    const s = el.getAttribute('src') || '';
                    if (!blobSrcs.has(s)) return;
                    if (!livesBySrc.has(s)) livesBySrc.set(s, []);
                    livesBySrc.get(s).push(el);
                });
                const dataBySrc = new Map();
                for (const src of blobSrcs) {
                    try {
                        const natural = await loadImageEl(src);
                        let k = 0;
                        (livesBySrc.get(src) || []).forEach((live) => {
                            // getComputedStyle 给的是解算过的矩阵，直接从里面抠缩放量，
                            // 比去 parse 我们自己写的那串 transform 稳
                            let sc = 1;
                            const tf = getComputedStyle(live).transform;
                            if (tf && tf !== 'none') sc = Math.hypot(new DOMMatrix(tf).a, new DOMMatrix(tf).b) || 1;
                            k = Math.max(k, Math.min(1,
                                (live.clientWidth * sc * EXPORT_SCALE) / natural.naturalWidth,
                                (live.clientHeight * sc * EXPORT_SCALE) / natural.naturalHeight));
                        });
                        if (!k) k = 1;      // 舞台上没找到对应元素（不该发生），按原尺寸
                        const w = Math.max(1, Math.round(natural.naturalWidth * k));
                        const h = Math.max(1, Math.round(natural.naturalHeight * k));
                        const cv = document.createElement('canvas');
                        cv.width = w; cv.height = h;
                        const cx = cv.getContext('2d');
                        cx.drawImage(natural, 0, 0, w, h);
                        // 内联的形式按「这张图需不需要透明」定，不看它抠没抠过：
                        // 只要有一处像素不是全不透明，就得 PNG 保透明；整张都不透的
                        // （没抠过图的原图，多半还是 JPEG 照片）出 JPEG，同样的画面
                        // 能小一个量级 —— 这个天花板见 SVG_URL_MAX。画布是干净的：
                        // blob: 画进来不染画布，实测过（染画布的是把 blob: 当 SVG 的
                        // src 那条路，见下面那段注释）。
                        const px = cx.getImageData(0, 0, w, h).data;
                        let clear = false;
                        for (let p = 3; p < px.length; p += 4) {
                            if (px[p] !== 255) { clear = true; break; }
                        }
                        dataBySrc.set(src, clear ? cv.toDataURL('image/png')
                                                 : cv.toDataURL('image/jpeg', 0.92));
                    } catch (err) {
                        // 转不出来就维持原样，宁可跟以前一样显示 alt 文字，也别把整次导出搞挂
                        console.warn('别针素材内联失败：', err);
                    }
                }
                [...clone.querySelectorAll('img')].forEach((im) => {
                    const d = dataBySrc.get(im.getAttribute('src') || '');
                    if (d) im.setAttribute('src', d);
                });
            }

            // 同步解码的提示：引擎认它就在解析期解码、不留到绘制期，不认也无害。
            // 跟上面那次预热是同一件事的两个方向 —— 一个催它快，一个给它铺好缓存。
            clone.querySelectorAll('img').forEach((el) => el.setAttribute('decoding', 'sync'));

            // 页面 CSS 原样抄进去（克隆体没有样式表就什么都不是），再缀上导出专用的那几条。
            // CSS 里的 & 和 < 在 XML 里是特殊字符，得转义 —— 不然整份 SVG 直接解析失败
            //
            // ── 这段几何是两轮真机实测打下来的，别随手改 ──
            //
            // 第一轮：原来是 width=W*2 配 viewBox=W，靠 viewBox 放大两倍。桌面 Chromium
            // 认那个 width 属性，所以一直是好的；真机 WebKit（iPhone Safari）退回取 viewBox，
            // 光栅出来是 W，于是整张舞台按 1× 落在 W*2 画布的左上角，只占四分之一面积。
            // 真机实测：导出 1016 的画布，内容框 58,52 → 451,448，桌面正常是 112,128 → 909,935，
            // 正好是它的一半。于是让 width / height / viewBox 三个数完全相等 ——
            // 「该光栅成多大」就没有第二种解释。
            //
            // 第二轮：三数一致之后尺寸对了，但真机上纸纹和阴影全毁。真机 A/B 四份对撞
            // （同一张舞台、同一份 CSS，只换「2× 由谁做」）查出来：
            //   · 2× 走 viewBox（丙）、走 foreignObject 的 SVG transform 属性（乙）——
            //     WebKit 两条都不认，内容一律按 1 CSS px = 1 设备 px 光栅，仍是左上角 1/4。
            //     乙和丙逐字节相同，这条是铁证。
            //   · 2× 走 CSS transform: scale()（甲）—— 尺寸对，纸纹阴影全毁。因为 CSS
            //     transform 会在 .stage-container 上建立 stacking context，而全文唯二的两条
            //     mix-blend-mode: multiply（.stage-tex 背景纹理、.texture-layer 纸纹）正好
            //     在它后代上 —— 相乘的底被换掉了。
            //   · 2× 走 CSS zoom（丁）—— 尺寸对，纹理阴影也对。zoom 是布局期等比放大，
            //     不是绘制期变换，不建立 stacking context。真机认定「丁的效果是完美的」。
            //
            // 所以只能用 zoom。顺带把宽高写死：这条 div 在 foreignObject 里是个普通块盒，
            // width:auto 会去填满外框（W*2），不写死它就成两倍宽了。
            const OUT_W = W * EXPORT_SCALE;
            const OUT_H = H * EXPORT_SCALE;
            const SCALE_CSS = `
        .stage-container {
            width: ${W}px !important; height: ${H}px !important;
            zoom: ${EXPORT_SCALE};
        }`;
            const css = [...document.querySelectorAll('style')].map((s) => s.textContent).join('\n')
                + EXPORT_CSS + SCALE_CSS;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${OUT_W}" height="${OUT_H}" viewBox="0 0 ${OUT_W} ${OUT_H}">`
                + `<style>${css.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</style>`
                + `<foreignObject x="0" y="0" width="${OUT_W}" height="${OUT_H}">`
                // 用 XMLSerializer 而不是 outerHTML：后者把 <img> 写成没有收尾的标签，
                // 那份 XML 是坏的，浏览器连解析都过不去
                + new XMLSerializer().serializeToString(clone)
                + `</foreignObject></svg>`;

            // 只能走 data: URL，不能走 createObjectURL：file:// 下页面是不透明源，
            // 它发出去的 blob: URL 画进画布算「跨源」，画布当场被染脏，toDataURL 直接抛
            // SecurityError（实测）。data: URL 不染画布；它那 2MB 的长度上限只管跳转，
            // img.src 这边 8MB 都照收（也实测过）。
            const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            // 顶穿了得说清楚是舞台上导入素材太多 —— 跟素材库存了多少无关（导出图里只有
            // 舞台上的东西），也跟贴了几处无关（同一份素材只内联一次）。
            if (svgUrl.length > SVG_URL_MAX) {
                throw new Error('舞台上的导入素材种类太多，导出图超出了浏览器能处理的长度，'
                    + '删掉几种再导出');
            }
            // WebKit 光栅「SVG 当图片」时，不等里面的子资源解码完 —— 内置别针那几张
            // 50~104KB 的透明 PNG、CSS 里那两张纸纹、切图，冷的时候第一次光栅出来就是缺的。
            // 舞台上那些 <img> 明明早在主文档里解码过也没用：主文档的解码喂不到
            // SVG 子文档那条路上去。
            // 触发条件看整份 SVG，不只看 <img> —— 这条漏过一次：两个纸纹
            // （--paper-tex / --bg-tex）和切图也是子文档的子资源，同样会输这场竞速。
            // 只看 <img> 的话，舞台上没贴纸时预热不触发，「第一次导出纹理没有」照旧。
            // 门槛 20KB 只是把字换的那张（几 KB）排除掉，那张从来不输。
            // 这一倍代价只在「缓存是冷的」时候付：第一次导出，或者刚才真的等过
            // （ensureExportReady 返回 true）。缓存热着还再画一遍，纯是白等。
            // 宁可多付一次也别少付：判据是「刚等过」，不是「第几次」——
            // 中间要是换了网格、加了素材，缓存照样会冷，那时第 N 次也得预热。
            //
            // ── 预热必须真的「画」一次，这一条是命根子 ──
            // 从前这里只 loadImageEl 一把就算预热完了。不行：SVG 当图片时，
            // WebKit 的光栅化是**懒**的 —— 它发生在「画」的那一刻，不在「加载完」
            // 的那一刻。所以那一遍什么都没光栅化：SVG 文档解析了、onload 也触发了，
            // 里面的别针、两张纸纹、切图一个都没解码。真正的导出走到下面那次
            // drawImage，才是这个文档里**第一次真正的光栅化**；它冷着出来就是缺纹理
            // 的那张，而它一旦做完，子资源才算进了缓存 —— 于是第二次导出永远正常。
            // 「刷新后第一次必坏、第二次就好」就是这么来的：跟时间无关（干等不会
            // 触发「画」，等多久都没用），跟域名也无关（file:// 换到 https 照旧）。
            //
            // 真机实测（面板「A/B 对撞」，甲乙丙丁戊连着光栅五张）：只有**排第一**的
            // 甲缺纹理，乙丙丁戊全好；再点一遍，甲也好了。坏的是「本文档第一次真正的
            // 光栅化」这个名额，不是某一套几何。另外，刷新后先手动光栅一次再导出，
            // 第一次导出就是好的 —— 名额被消耗掉了。
            //
            // 所以预热要做的就是去当那个牺牲品：把图**画进 out 本身**。画进同一张
            // 画布、同一个尺寸，条件跟正式那次一模一样，也免得多开一块
            // 1016² / 2032² 的画布（iOS 上那是会出事的）。画完 clearRect 抹干净。
            //
            // 预热那条 URL 仍要跟正式那条不一样：同一个 URL 加载两次不等于光栅两次，
            // 第二次拿回来的是第一次那张光栅结果的缓存（实测：预热 292ms，紧接着的
            // 正式 17ms、两次哈希一模一样）。撞了缓存键，正式那次拿到的就是牺牲品。
            const heavy = /data:[^"')]{20000,}/.test(svg);
            const out = document.createElement('canvas');
            out.width = OUT_W;
            out.height = OUT_H;
            const octx = out.getContext('2d');
            if (heavy && (!exportedOnce || waited)) {
                const warmUrl = 'data:image/svg+xml;charset=utf-8,'
                    + encodeURIComponent(svg + '<!--warm-->');
                try {
                    const warm = await loadImageEl(warmUrl);
                    octx.drawImage(warm, 0, 0, out.width, out.height);
                    octx.clearRect(0, 0, out.width, out.height);
                } catch (e) { /* 预热失败就当没有，正式那次照走 */ }
            }
            const im = await loadImageEl(svgUrl);
            window.__expDiag = { 固有: im.naturalWidth + 'x' + im.naturalHeight };  // 临时诊断，跟页面底部那块面板一起删
            // 不铺底：画布本来就是透明的，SVG 里也没有背景色。
            // 目标尺寸照写：上面那个 svg 三个数已经一致，固有尺寸理应就是 OUT_W，
            // 这里等于 1:1 原样画；写明只是为了万一还有引擎在固有尺寸上抽风。
            octx.drawImage(im, 0, 0, out.width, out.height);
            exportedOnce = true;
            return out;
        }

        // =====================================================================
        // 下载的唯一出口
        // =====================================================================
        // 规矩只有一条，改动这块的人请守住：
        //
        //   **图没到手，不许调这个函数。**
        //
        // 手机上一按下下载，系统那条「你要下载 xxx 吗？」就弹出来盖住整页，
        // 页面这边说什么都晚了 —— 所以调用点必须排在自己那段 await 全都过了之后。
        // 从「按导出」到「图到手」中间那一程由 #exportWait 浮层盖着，它就是
        // 「下载指令还没发出去」的可视化：浮层在 = 还没下载，浮层一没 = 紧接着就下载。
        // 谁要是把 a.click() 提前，或者另开一条下载的路，这条对应关系就断了。
        //
        // 下面那个 if 是给这件事留的哨兵，不是装饰。
        //
        // 走 blob: URL 而不是 data: URL —— data: URL 会越过浏览器两兆的长度上限，
        // 大格子出图后下载下来是个坏文件。立刻 revoke 会把下载掐断，所以延后撤。
        function downloadBlob(blob, name) {
            if (!blob) throw new Error('图还没出来，不该在这里调下载');
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.download = name;
            a.href = url;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }

        document.getElementById('btnExport').addEventListener('click', async () => {
            // 光栅化那一下是同步的，主线程会僵住一秒多（6×6 要三秒出头），所以先把提示画出来。
            // 两个 rAF：第一个还在这一帧里，第二个说明这一帧已经上屏了，再去干重活。
            showToast('正在导出…', 60000);
            await beginExportWait();
            try {
                const cvs = await buildStageImage(setExportWaitText);
                // 下载走 blob: URL 而不是 data: URL —— 格子铺得大时（6×6 就是 2000px 见方）
                // 那张 PNG 的 data: URL 会越过 Chrome 两兆的长度上限，下载下来是个坏文件。
                // （上传那条路反过来只能走 data:，见 buildStageImage 末尾的注释。）
                setExportWaitText('请稍等，正在存图…');
                const blob = await new Promise((res) => cvs.toBlob(res, 'image/png'));
                // ← 到这一行，图才第一次到手里。上面任何一步没完成都走不到这儿。
                downloadBlob(blob, '便利贴拼图.png');
                showToast('已导出单图' + (effBgMode() === 'none' ? '（背景透明）' : ''), 2000);
            } catch (e) {
                showToast('导出失败：' + e.message);
            } finally {
                // 到这儿图已经交出去了。撤的定时器会把它压到下载框出来前后才消失，
                // 中间不留空档。
                endExportWait();
            }
        });

        // =====================================================================
        // 多图导出 · 状态
        // =====================================================================
        // 名字不叫 shots：buildStageImage() 内部已经有一个 const shots（装 3D 便签的
        // toDataURL 结果），而存图恰恰就是从这个函数里出来的 —— 在那个作用域里外层这个
        // 数组会被完全遮住，shots.filter 会静默地算错东西。换个名字，坑就不存在了。
        const MAX_SHOTS = 20;
        let shotSlots = new Array(MAX_SHOTS).fill(null);   // 有货的是 { blob, url, epoch }
        let canvasEpoch = 0;                               // 换一次画布 +1
        let canvasShape = '';                              // '行x列'，用来判「真的变了没有」

        // 「换画布」唯一判定口。只认「行 × 列这个二元组变了」，别的都不算 ——
        // 导入的照片变了、背景变了、便签样式变了，都不是新画布。
        //
        // 比的必须是**值**，不能是「谁调了我」：裁剪完、加一张便签都会走 renderGrid，
        // 把翻篇塞进 renderGrid 而按「调用次数」算，就会把好好的缩略图平白无故变灰。
        // 按值比还有个好处 —— 以后新加一条改行列的路径（比如恢复预设）也自动覆盖。
        function syncCanvasEpoch() {
            const { rows, cols } = gridMetrics();
            const key = rows + 'x' + cols;
            if (key === canvasShape) return false;
            canvasShape = key;
            canvasEpoch++;
            // 横条得跟着重画（灰/亮是按 epoch 现算的）。初始化时横条还没建好，
            // 用 optional call 兜一下，不额外加判断。
            if (typeof renderShotStrip === 'function') renderShotStrip();
            return true;
        }

        // =====================================================================
        // 多图导出 · 横条
        // =====================================================================
        // 每次整块重画。20 个格子而已，重建比「小心翼翼地就地更新」简单得多，
        // 也不会出现「数组改了、DOM 没跟上」这类对不上的问题。
        // 缩略图用的是同一个 blob URL，浏览器会复用解码结果，重建不吃亏。
        function renderShotStrip() {
            const grid = document.getElementById('shotGrid');
            grid.textContent = '';
            shotSlots.forEach((slot, i) => {
                const cell = document.createElement('div');
                cell.className = 'shot-slot' + (slot ? '' : ' is-empty');
                cell.dataset.i = String(i);
                if (slot) {
                    // 灰不灰是**现算**的，不存进 slot 里。存了就得在换画布时遍历 20 个
                    // 格子去改它，而且以后任何一处改行列的地方都得记得改 —— 现算没这负担。
                    if (slot.epoch !== canvasEpoch) cell.classList.add('is-stale');
                    const im = document.createElement('img');
                    im.src = slot.url;
                    im.alt = '';
                    cell.appendChild(im);
                } else {
                    const num = document.createElement('span');
                    num.className = 'shot-num';
                    num.textContent = String(i + 1);
                    cell.appendChild(num);
                }

                const del = document.createElement('button');
                del.className = 'shot-del';
                del.type = 'button';
                del.title = '删掉这张';
                del.setAttribute('aria-label', '删掉这张');
                del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" '
                    + 'stroke-width="2.6" stroke-linecap="round"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>';
                del.addEventListener('click', (ev) => { ev.stopPropagation(); deleteShot(i); });
                del.hidden = !slot;        // 空格子没什么好删的
                cell.appendChild(del);

                grid.appendChild(cell);
            });
            updateShotButtons();
        }

        // 「导出视频」只在**一张亮的都没有**时禁用 —— 不是「有灰格子就禁用」。
        // 一改行列，旧的全变灰、那一刻亮的 = 0，按钮自然变灰；在新画布上存下第一张，
        // 亮的 = 1，按钮立刻可用。写成「有灰就禁用」的话，一旦变过画布就永远导不出视频。
        function updateShotButtons() {
            const filled = shotSlots.filter(Boolean).length;
            const bright = shotSlots.filter((s) => s && s.epoch === canvasEpoch).length;
            const countEl = document.getElementById('shotCount');
            countEl.textContent = filled + '/' + MAX_SHOTS;
            countEl.classList.toggle('is-full', filled >= MAX_SHOTS);
            document.getElementById('btnShotZip').disabled = filled === 0;
            document.getElementById('btnShotVideo').disabled = bright === 0;
        }

        // 存图。走的是跟「单图导出」**同一条路**（buildStageImage），只是不下载 ——
        // 存的是那张 PNG 的 blob 本身：ZIP 直接拼它的字节（不重编码，逐字节相同），
        // 视频用它解一帧。灰格子里那些出自旧画布，画布已经变了、重建不出来，
        // 所以只能存图，「导出时重新生成」这条路根本走不通。
        let shotSaving = false;
        async function saveCurrentShot() {
            if (shotSlots.indexOf(null) < 0) {
                showToast('最大次数已满（' + MAX_SHOTS + '/' + MAX_SHOTS + '），请先导出或按刷新');
                return;
            }
            // buildStageImage 是异步的，连点会存进两张一模一样的图。在途标志挡住。
            if (shotSaving) return;
            shotSaving = true;
            showToast('正在保存…', 60000);
            await beginExportWait();
            try {
                const cvs = await buildStageImage(setExportWaitText);
                setExportWaitText('请稍等，正在存图…');
                const blob = await new Promise((res) => cvs.toBlob(res, 'image/png'));
                if (!blob) throw new Error('出图失败');
                // 索引在 await 之后再取一次：这一秒里格子可能被删过
                const idx = shotSlots.indexOf(null);
                if (idx < 0) { showToast('最大次数已满，请先导出或按刷新'); return; }
                // epoch 记下「这张是哪个画布上存的」。之后行列一变，它就变灰。
                shotSlots[idx] = { blob, url: URL.createObjectURL(blob), epoch: canvasEpoch };
                renderShotStrip();
                showToast('已存入第 ' + (idx + 1) + ' 格（' + shotSlots.filter(Boolean).length + '/' + MAX_SHOTS + '）', 2000);
            } catch (e) {
                showToast('保存失败：' + e.message);
            } finally {
                shotSaving = false;
                endExportWait();
            }
        }
        document.getElementById('btnShotSave').addEventListener('click', saveCurrentShot);

        // 删一张。objectURL 一定要撤 —— 不撤的话那个 blob 一直挂在内存里，
        // 20 张删干净了内存也没还回去。
        function deleteShot(i) {
            const slot = shotSlots[i];
            if (!slot) return;
            URL.revokeObjectURL(slot.url);
            shotSlots[i] = null;
            renderShotStrip();
        }

        // 刷新：不管导没导出过，一点就全部清空、计数归零。**舞台内容不动**。
        // 用系统 confirm 而不是自己搭弹窗：这是个一步就能复原的动作（重新存就行），
        // 不值得为它再写一套模态。样式上确实跟页面其它地方不一路，忍了。
        function resetShots() {
            if (!shotSlots.some(Boolean)) return;      // 本来就是空的，别弹框烦人
            if (!confirm('清空 20 个格子和计数？舞台上的内容不受影响。')) return;
            shotSlots.forEach((s) => { if (s) URL.revokeObjectURL(s.url); });
            shotSlots = new Array(MAX_SHOTS).fill(null);
            // 只清槽位，**不动** canvasEpoch / canvasShape：舞台没换，形状还是那个形状，
            // 留着它们，下一次同形状的 renderGrid（加便签、换一张导入照片的异步回调）
            // 才能按值比对出「没变」、正确走 return false。槽位已经清空，没什么可灰的；
            // 要是把 canvasShape 清成 ''，用户刷新后立刻再存、再触发一次同形状的
            // renderGrid，epoch 会被顶上去、刚存的那张就被误标灰了。
            renderShotStrip();
        }
        document.getElementById('btnShotReset').addEventListener('click', resetShots);

        renderShotStrip();      // 页面一加载就把 20 个空格子建好，之后只改内容

        // 窄屏布局：窗口尺寸一变，「并排还装不装得下 / 舞台要缩多少」都得重算。
        // 行列变化那条路由 executeRenderGrid 自己调 layout()，这里只管窗口。
        // 拖动窗口时 resize 会连发，用 rAF 合并一下 —— layout() 要读 offsetWidth，
        // 每次都强制一次布局，不合并会白算很多遍。
        let layoutRaf = 0;
        window.addEventListener('resize', () => {
            if (layoutRaf) return;
            layoutRaf = requestAnimationFrame(() => { layoutRaf = 0; layout(); });
        });
        layout();

        // 横条的开合只有这一个出口：横条显不显、按钮亮不亮，永远一起变。
        // 分成两处写的话，Esc 那条路会漏掉按钮的亮灭，横条收起来了按钮还蓝着。
        const btnMulti = document.getElementById('btnMulti');
        const shotStripEl = document.getElementById('shotStrip');
        function setStripOpen(open) {
            shotStripEl.hidden = !open;
            btnMulti.classList.toggle('is-on', open);
            if (open) renderShotStrip();   // 收起再打开，格子原样还在
        }
        btnMulti.addEventListener('click', () => setStripOpen(shotStripEl.hidden));

        // =====================================================================
        // 多图导出 · ZIP 打包（只用 STORE，不压缩）
        // =====================================================================
        // PNG 本身已经是压过的，再 deflate 一遍基本不会变小，为它引一个库不划算。
        // 所以按 ZIP 格式自己拼字节 —— local file header + 原样数据，最后是
        // central directory 和 EOCD，全部小端。一百来行，零依赖。
        // 文件名是纯 ASCII 的数字，所以用不着置 UTF-8 标志位（bit 11）。

        let CRC_TABLE = null;
        function crc32Table() {
            if (CRC_TABLE) return CRC_TABLE;
            const t = new Uint32Array(256);
            for (let n = 0; n < 256; n++) {
                let c = n;
                for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
                t[n] = c >>> 0;
            }
            CRC_TABLE = t;
            return t;
        }
        function crc32(bytes) {
            const t = crc32Table();
            let c = 0xFFFFFFFF;
            for (let i = 0; i < bytes.length; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
            return (c ^ 0xFFFFFFFF) >>> 0;
        }

        // DOS 日期时间。写 0 的话月份和日子都是 0，是个非法日期 —— 实测 Expand-Archive
        // 会挑刺。固定成 2024-01-01 00:00:00：合法、而且每次打包都一样（可复现）。
        const DOS_DATE = ((2024 - 1980) << 9) | (1 << 5) | 1;

        function buildZip(entries) {
            const enc = new TextEncoder();
            const u16 = (v) => [v & 0xFF, (v >>> 8) & 0xFF];
            const u32 = (v) => [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF];
            const parts = [];        // 直接喂给 Blob，不先拼成一个几十兆的 Uint8Array
            const central = [];
            let offset = 0;

            for (const e of entries) {
                const name = enc.encode(e.name);
                const crc = crc32(e.bytes);
                const size = e.bytes.length;

                const local = new Uint8Array([
                    0x50, 0x4B, 0x03, 0x04,      // 签名 PK\x03\x04
                    ...u16(20),                  // 解压所需版本 2.0
                    ...u16(0),                   // 标志位
                    ...u16(0),                   // 压缩方法 0 = STORE
                    ...u16(0), ...u16(DOS_DATE), // 修改时间、日期
                    ...u32(crc),
                    ...u32(size),                // 压缩后大小 == 原始大小（STORE）
                    ...u32(size),
                    ...u16(name.length),
                    ...u16(0),                   // 扩展字段长度
                ]);
                parts.push(local, name, e.bytes);

                central.push(new Uint8Array([
                    0x50, 0x4B, 0x01, 0x02,      // 签名 PK\x01\x02
                    ...u16(20), ...u16(20),      // 创建版本、所需版本
                    ...u16(0), ...u16(0),        // 标志位、方法
                    ...u16(0), ...u16(DOS_DATE), // 时间、日期
                    ...u32(crc), ...u32(size), ...u32(size),
                    ...u16(name.length),
                    ...u16(0), ...u16(0),        // 扩展、注释长度
                    ...u16(0),                   // 起始磁盘号
                    ...u16(0),                   // 内部属性
                    ...u32(0),                   // 外部属性
                    ...u32(offset),              // 本条 local header 的偏移
                ]), name);

                offset += local.length + name.length + size;
            }

            const cdStart = offset;
            let cdSize = 0;
            for (const p of central) cdSize += p.length;

            const eocd = new Uint8Array([
                0x50, 0x4B, 0x05, 0x06,          // 签名 PK\x05\x06
                ...u16(0), ...u16(0),            // 本磁盘号、central directory 起始磁盘号
                ...u16(entries.length), ...u16(entries.length),
                ...u32(cdSize), ...u32(cdStart),
                ...u16(0),                       // 注释长度
            ]);

            return new Blob([...parts, ...central, eocd], { type: 'application/zip' });
        }

        // 导出全部。顺序就是格子的顺序（拖拽改的就是它）；空格子跳过，
        // 但编号连续 —— 中间删过一张不会让后面的名字跟着乱。
        // 灰的亮的混着打完全没问题：不同画布出图尺寸本来就不同，
        // ZIP 里各管各的，互不影响。
        async function exportZip() {
            const filled = shotSlots.filter(Boolean).length;
            if (!filled) return;
            showToast('正在导出…', 60000);
            await beginExportWait();
            try {
                setExportWaitText('请稍等，正在打包…');
                const entries = [];
                for (const slot of shotSlots) {
                    if (!slot) continue;
                    entries.push({
                        name: String(entries.length + 1).padStart(2, '0') + '.png',
                        bytes: new Uint8Array(await slot.blob.arrayBuffer()),
                    });
                }
                const zip = buildZip(entries);
                // ← 到这一行，整包才第一次成形。上面任何一步没完成都走不到这儿。
                downloadBlob(zip, '便利贴拼图.zip');
                showToast('已导出 ZIP', 2500);
            } catch (e) {
                showToast('导出失败：' + e.message);
            } finally {
                endExportWait();
            }
        }
        document.getElementById('btnShotZip').addEventListener('click', exportZip);

        // =====================================================================
        // 多图导出 · MP4（WebCodecs 离线编码 + CDN 上的 mp4-muxer）
        // =====================================================================
        // 为什么不用 MediaRecorder：它是实时有损管线、按墙上时钟打时间戳，实测大约
        // 每 3 次录制就有 1 次丢掉至少一张图（20 张里少 1~5 张），跟画面尺寸无关，
        // 真窗口下比无头还差。离线编码不赶时间、帧由调用方逐张喂，丢不了。
        //
        // 时间戳是调用方指定的（MediaRecorder 那边是浏览器按墙上时钟给的）——
        // 这是两者最本质的区别，也是「每张正好 0.2 秒」能成立的唯一原因。
        const SHOT_HOLD_MS = 200;

        // H.264 每个 level 有 max coded area 的硬上限，超了编码器**直接抛错**（不是降级）。
        // 4.2 的上限是 2228224 像素：3×3(1016²) 和 4×4(1264²) 都在里面，
        // 5×5(1512²=2286144) 和 6×6(1760²=3097600) 都超。日常那几个留在 4.2 就好 ——
        // 那是兼容性最好的档次，没必要一律抬到 5.0。
        const AVC_AREA_42 = 2228224;
        function pickAvcCodec(w, h) {
            return (w * h) <= AVC_AREA_42 ? 'avc1.4D002A' : 'avc1.4D0032';
        }

        // 约 8 Mbps / 百万像素。这个量级下成片只有几百 KB，没有省的必要。
        function mp4Bitrate(w, h) {
            return Math.round(w * h / 1e6 * 8e6);
        }

        // file:// 下动态 import 一个 https 的 ESM 是可以的（页面本来就靠 CDN 拉 three.js）。
        // 取一次就存住，别每次导出都下一个。
        let muxerModPromise = null;
        function loadMuxer() {
            if (!muxerModPromise) {
                muxerModPromise = import('https://cdn.jsdelivr.net/npm/mp4-muxer@5/+esm')
                    .catch((e) => { muxerModPromise = null; throw new Error('装载 MP4 封装库失败，检查一下网络：' + e.message); });
            }
            return muxerModPromise;
        }

        async function encodeShotsToMp4(blobs, onProgress) {
            const { Muxer, ArrayBufferTarget } = await loadMuxer();

            // 亮的那些必然出自同一次画布，尺寸必然一样 —— 按第一张定，
            // 一份 config 正好够。（这也是「视频只能导亮的」在技术上的另一个理由：
            // VideoEncoder 一份 config 只能出一个尺寸，混着不同画布根本编不了。）
            const first = await createImageBitmap(blobs[0]);
            const W = first.width, H = first.height;
            const codec = pickAvcCodec(W, H);
            const bitrate = mp4Bitrate(W, H);

            const cfg = { codec, width: W, height: H, bitrate, framerate: 1000 / SHOT_HOLD_MS };
            const support = await VideoEncoder.isConfigSupported(cfg).catch(() => ({ supported: false }));
            if (!support.supported) throw new Error('这个浏览器编不了 H.264（' + codec + ' @ ' + W + '×' + H + '）');

            const muxer = new Muxer({
                target: new ArrayBufferTarget(),
                video: { codec: 'avc', width: W, height: H },
                fastStart: 'in-memory',
            });
            let encErr = null;
            const enc = new VideoEncoder({
                output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
                error: (e) => { encErr = String(e); },
            });
            // avc.format 必须是 'avc'（长度前缀的 AVCC）—— MP4 要的是这个，
            // 不是 Annex-B。写错了封装器会吐一个解不开的包。
            enc.configure({ ...cfg, avc: { format: 'avc' } });

            const cvs = document.createElement('canvas');
            cvs.width = W; cvs.height = H;
            const ctx = cvs.getContext('2d', { alpha: false });

            for (let i = 0; i < blobs.length; i++) {
                const bmp = i === 0 ? first : await createImageBitmap(blobs[i]);
                // 铺一层白底：H.264 没有透明通道，「透明背景」导出的图直接进编码器
                // 会把透明部分变成黑的。纸张类的东西衬白底最自然。
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, W, H);
                // 尺寸一致时这就是 1:1 直贴、不缩放；万一不一致（理论上到不了）
                // 也走等比拉伸而不是整个失败。
