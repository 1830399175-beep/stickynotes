                ctx.drawImage(bmp, 0, 0, bmp.width, bmp.height, 0, 0, W, H);
                bmp.close();
                const vf = new VideoFrame(cvs, {
                    timestamp: i * SHOT_HOLD_MS * 1000,     // 微秒
                    duration: SHOT_HOLD_MS * 1000,
                });
                enc.encode(vf, { keyFrame: i === 0 });
                vf.close();
                if (onProgress) onProgress(i + 1, blobs.length);
                // 每 4 帧让一次主线程，进度提示才画得出来（不然 3 秒里界面是死的）
                if (i % 4 === 3) await new Promise((r) => setTimeout(r, 0));
            }

            await enc.flush();
            enc.close();
            if (encErr) throw new Error(encErr);
            muxer.finalize();
            return new Blob([muxer.target.buffer], { type: 'video/mp4' });
        }

        // =====================================================================
        // 启动
        // =====================================================================
        rebuildMatTypeOptions('2D');
        // 选框是要有东西亮着的。以前这里是个 <select>，浏览器自己默认选第一项，
        // 看着对；换成按钮后没人点就一个都不亮，所以必须显式同步一次。
        syncMatTypeUI();
        updateMatRows();
        setTab('look');          // 起步停在「外观」；此时没选中便签，「翘角」标签是藏着的
        loadHandFont();          // 异步，加载完会自己把字重画一遍
        renderGrid();
    </script>

<!-- ===================== 手机端诊断面板（临时，查完就整块删） =====================
     手机上没有 console，所以把要看的数直接画在页面上，还能全选复制发出来。
     整块是自包含的：一个 <style>、一个 <div>、一个 <script>，删的时候从这行注释
     删到下面「诊断面板 结束」那一行即可，不碰别的任何东西。

     面板挂在 <body> 下、不在 .stage-container 里 —— 导出图只克隆 .stage-container，
     所以诊断面板不会跑进导出图里。

     它回答一个问题：这台手机的引擎，会不会把 viewBox 的缩放带进 foreignObject
     里的 HTML？导出那条路正是靠这个缩放把画面放大两倍的。
     探针用两张 40×40 的小图各测一次：
       探针A：viewBox 是像素的一半（跟现在导出用的写法一样）
       探针B：viewBox 跟像素 1:1，2× 改用 CSS transform 加在内容上
     两张都铺满 → 引擎没问题，得往别处找；A 只有 1/4、B 铺满 → 病因确认，改法也对。 -->
<style>
    #diagBtn {
        position: fixed; left: 10px; bottom: 10px; z-index: 99999;
        width: 42px; height: 42px; border-radius: 50%; border: 1px solid #e6e2dc;
        background: rgba(255, 255, 255, 0.97); color: #333; font-size: 18px;
        line-height: 1; cursor: pointer; padding: 0;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.14);
    }
    #diagPanel {
        position: fixed; left: 8px; right: 8px; bottom: 60px; z-index: 99999;
        display: none; background: rgba(255, 255, 255, 0.98); color: #333;
        border: 1px solid #e6e2dc; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.16);
        border-radius: 12px; padding: 10px;
        /* 日志 + 四张小图比一屏高，整块钉在视口里会顶出屏幕、上面那几张永远够不着。
           所以面板本身限高、内部滚动，按钮那行留在滚动区外面永远点得到。
           100dvh 在后、100vh 在前：老引擎不认 dvh 时退回 vh。 */
        max-height: calc(100vh - 84px);
        max-height: calc(100dvh - 84px);
        flex-direction: column;
    }
    #diagPanel.open { display: flex; }
    /* 唯一的滚动区：日志和小图一起滚，滑到哪看到哪 */
    #diagScroll {
        flex: 1 1 auto; min-height: 0; overflow-y: auto;
        -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
    }
    #diagOut {
        width: 100%; height: 24vh; min-height: 120px; box-sizing: border-box; resize: none;
        background: #fff; color: #2c4a2c; border: 1px solid #ddd;
        border-radius: 8px; padding: 8px; font-size: 11px; line-height: 1.55;
        font-family: ui-monospace, Menlo, Consolas, monospace;
        /* 必须换行：手机屏幕窄，UA 那种长串不折行就被切掉，正好切在最要紧的数上 */
        white-space: pre-wrap; overflow-wrap: anywhere;
        -webkit-user-select: text; user-select: text;
    }
    #diagPreview { margin-top: 8px; }
    #diagPreview figure { margin: 0 0 6px; }
    #diagPreview img { width: 100%; display: block; border-radius: 6px; background: #fff; }
    #diagPreview figcaption { font-size: 11px; color: #2a6ea8; padding: 2px 0; }
    /* 四个按钮，手机上排成 2×2；一行四个字会挤成一团 */
    #diagPanel .diag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; flex: 0 0 auto; }
    #diagPanel button {
        flex: 1 1 44%; height: 36px; border-radius: 9px; border: 1px solid #ccc;
        background: #fff; color: #333; font-size: 12px; font-weight: 600;
    }
    #diagPanel button:hover { background: #f2f2f2; border-color: #999; }
</style>
<div id="diagBtn" role="button" aria-label="诊断面板">🔍</div>
<div id="diagPanel">
    <div id="diagScroll">
        <textarea id="diagOut" readonly>点「跑一遍诊断」</textarea>
        <div id="diagPreview"></div>
    </div>
    <div class="diag-row">
        <button id="diagRun">跑一遍诊断</button>
        <button id="diagAB">A/B 对撞</button>
        <button id="diagSvg">数元素</button>
        <button id="diagShadow">阴影定位</button>
        <button id="diagClear">清空</button>
    </div>
</div>
<script>
    (function () {
        const panel = document.getElementById('diagPanel');
        const out = document.getElementById('diagOut');
        let lines = [];
        const log = (s) => { lines.push(s); out.value = lines.join('\n'); out.scrollTop = out.scrollHeight; };

        document.getElementById('diagBtn').addEventListener('click', () => panel.classList.toggle('open'));
        document.getElementById('diagClear').addEventListener('click', () => { lines = []; out.value = '点「跑一遍诊断」'; });
        window.addEventListener('error', (e) => log('【页面错误】' + e.message));

        // 把导出真正用掉的那份 SVG 截下来。buildStageImage 里写的是 loadImageEl(svgUrl)，
        // 而 loadImageEl 是顶层的 function 声明、就挂在 window 上 —— 在这儿换掉它，
        // 那边调到的就是这一层。生产代码一个字不用改。
        let lastSvg = '';
        const origLoad = window.loadImageEl;
        window.loadImageEl = async (u) => {
            // 只认这一种。buildStageImage 中途还会拿 loadImageEl 去解 blob: 素材
            // （内联别针那条路），那种 URL 里没有逗号，不拦的话会被整条记成 lastSvg，
            // 把真正的导出 SVG 顶掉。最后那次调用是 SVG，所以只要拦得住就一定是对的。
            if (u.startsWith('data:image/svg+xml')) {
                try { lastSvg = decodeURIComponent(u.slice(u.indexOf(',') + 1)); } catch (e) { lastSvg = ''; }
            }
            return origLoad(u);
        };

        // 一张 40×40 的小图，纯色块铺满 foreignObject。返回不透明像素占整张画布的百分比。
        // 引擎把 viewBox 缩放带进了 foreignObject，色块就铺满 → 100%；没带 → 只剩 1/4。
        function probe(inner, vb, px) {
            const U = 40;
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${U * px}" height="${U * px}" viewBox="0 0 ${vb} ${vb}">`
                + `<foreignObject x="0" y="0" width="${vb}" height="${vb}">`
                + `<div xmlns="http://www.w3.org/1999/xhtml" style="${inner}"></div>`
                + `</foreignObject></svg>`;
            const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            return new Promise((resolve) => {
                const im = new Image();
                im.onerror = () => resolve({ err: '图没加载出来' });
                im.onload = () => {
                    const c = document.createElement('canvas');
                    c.width = U * px; c.height = U * px;
                    const cx = c.getContext('2d');
                    cx.drawImage(im, 0, 0, c.width, c.height);
                    let d;
                    try { d = cx.getImageData(0, 0, c.width, c.height).data; }
                    catch (e) { return resolve({ err: '画布读不出来：' + e.message }); }
                    let n = 0, maxX = -1, maxY = -1;
                    for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
                        if (d[(y * c.width + x) * 4 + 3] > 8) { n++; if (x > maxX) maxX = x; if (y > maxY) maxY = y; }
                    }
                    resolve({ cov: (n / (c.width * c.height) * 100).toFixed(1),
                              nat: im.naturalWidth + 'x' + im.naturalHeight,
                              外框: (maxX + 1) + 'x' + (maxY + 1) });
                };
                im.src = url;
            });
        }

        // 真导出一遍（背景临时切「透明」，不然整张都是底色的不透明像素，看不出内容在哪）
        async function exportProbe() {
            const saved = bgMode;
            bgMode = 'none'; applyStageBg();
            await new Promise((r) => setTimeout(r, 80));
            let c;
            try { c = await buildStageImage(); }
            finally { bgMode = saved; applyStageBg(); }
            const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
            let minX = 1e9, minY = 1e9, maxX = -1, maxY = -1, n = 0;
            for (let y = 0; y < c.height; y++) for (let x = 0; x < c.width; x++) {
                if (d[(y * c.width + x) * 4 + 3] > 8) {
                    n++;
                    if (x < minX) minX = x; if (x > maxX) maxX = x;
                    if (y < minY) minY = y; if (y > maxY) maxY = y;
                }
            }
            return { 画布: c.width + 'x' + c.height, 固有: (window.__expDiag || {}).固有,
                     内容框: `${minX},${minY} → ${maxX},${maxY}`,
                     覆盖: (n / (c.width * c.height) * 100).toFixed(1) + '%' };
        }

        // 四份同一张舞台、同一份 CSS，只换「2× 由谁做」，各画一张 1016 的图对撞。
        //
        // 真机（iOS WebKit）已测出来的结论，记在这儿免得再走一遍：
        //   甲 尺寸对、样式坏；乙 和丙 逐字节相同，样式对、只占左上角 1/4。
        // 乙丙相同这一条最值钱 —— 它说明 WebKit 对 foreignObject 里的 HTML 既不认
        // viewBox 缩放、也不认 SVG transform 属性，一律按 1 CSS px = 1 设备 px 光栅。
        // 唯一认的是挂在 HTML 元素自己身上的 CSS transform，而那会建立 stacking context，
        // 全文唯二的两条 mix-blend-mode: multiply（.stage-tex / .texture-layer）正好在它后代上
        // —— 于是「尺寸对」和「样式对」在 WebKit 上由同一个开关控制，方向相反。
        //
        // 丁 就是去拆这个死结：换成布局期的 zoom，看能不能既铺满又不建 stacking context。
        //
        // 桌面 Chromium 上这四种写法全都一样，别拿它证伪任何一条 —— 这个 bug 只在 WebKit 现形。
        async function abScale() {
            const W = stageContainer.clientWidth, H = stageContainer.clientHeight, S = EXPORT_SCALE;
            const OUT = W * S;
            const base = [...document.querySelectorAll('style')].map((s) => s.textContent).join('\n') + EXPORT_CSS;
            const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
            const mkClone = () => {
                const c = stageContainer.cloneNode(true);
                ['--paper-tex', '--bg-tex'].forEach((v) =>
                    c.style.setProperty(v, document.documentElement.style.getPropertyValue(v)));
                return c;
            };
            const raster = (svg, force) => new Promise((res, rej) => {
                const im = new Image();
                // force=true 时，在 src 之前把 <img> 自己的宽高属性钉成 OUT —— 对 SVG 图片来说
                // 这是「指定尺寸」，引擎该按它光栅化，而不是去猜固有尺寸
                if (force) { im.width = OUT; im.height = OUT; }
                im.onerror = () => rej(new Error('图没加载出来'));
                im.onload = () => {
                    const cv = document.createElement('canvas');
                    cv.width = OUT; cv.height = OUT;
                    cv.getContext('2d').drawImage(im, 0, 0, OUT, OUT);
                    res({ cv, nat: im.naturalWidth + 'x' + im.naturalHeight });
                };
                im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
            });
            const box = (css, fo) => `<svg xmlns="http://www.w3.org/2000/svg" width="${OUT}" height="${OUT}" viewBox="0 0 ${OUT} ${OUT}">`
                + `<style>${esc(css)}</style>` + fo + `</svg>`;
            // 甲：三数一致 + CSS transform 挂在 .stage-container 上（现在生产的写法）
            const A = await raster(box(base + `.stage-container{width:${W}px !important;height:${H}px !important;`
                + `transform:scale(${S}) !important;transform-origin:0 0 !important;}`,
                `<foreignObject x="0" y="0" width="${OUT}" height="${OUT}">`
                + new XMLSerializer().serializeToString(mkClone()) + `</foreignObject>`));
            // 乙：三数一致 + SVG 几何 transform 挂在 foreignObject 上（.stage-container 上没有任何
            //     CSS transform ⇒ 不是 stacking context，混合环境跟你验证过忠实的那套一模一样）
            const B = await raster(box(base + `.stage-container{width:${W}px !important;height:${H}px !important;}`,
                `<foreignObject x="0" y="0" width="${W}" height="${H}" transform="scale(${S})">`
                + new XMLSerializer().serializeToString(mkClone()) + `</foreignObject>`));
            // 丙：几何完全退回老写法（viewBox=W，2× 全靠 viewBox），只在 <img> 上把光栅尺寸钉死
            const C = await raster(`<svg xmlns="http://www.w3.org/2000/svg" width="${OUT}" height="${OUT}" viewBox="0 0 ${W} ${H}">`
                + `<style>${esc(base)}</style>`
                + `<foreignObject x="0" y="0" width="${W}" height="${H}">`
                + new XMLSerializer().serializeToString(mkClone()) + `</foreignObject></svg>`, true);
            // 丁：几何跟甲一模一样（三数一致、foreignObject 铺满），只把 2× 从 CSS transform
            //     换成 CSS zoom。zoom 是布局期等比放大、不是绘制期变换，理论上不建立
            //     stacking context —— 而那条 transform 正是甲丢纹理、丢阴影的嫌疑所在。
            //     若 丁 铺满（均值从 49 跳回 200 上下）且纹理阴影回来，就是解；
            //     若 丁 跟丙一模一样，说明 WebKit 在 foreignObject 里根本不认 zoom。
            const D = await raster(box(base + `.stage-container{width:${W}px !important;height:${H}px !important;`
                + `zoom:${S};}`,
                `<foreignObject x="0" y="0" width="${OUT}" height="${OUT}">`
                + new XMLSerializer().serializeToString(mkClone()) + `</foreignObject>`));

            const lum = (d, i) => d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
            // 锐度 = 相邻像素平均绝对差。纹理是一层细颗粒，混不上就整片变平 —— 锐度会掉下来。
            // 这是「纹理还在不在」唯一能自动量出来的指标。
            // 按画布自己的尺寸量，不写死 OUT —— 戊那份的尺寸由网格决定（5×3 就是
            // 1016×1512），跟甲乙丙丁那个正方形不是一回事。
            const stat = (cv) => {
                const w = cv.width, h = cv.height;
                const d = cv.getContext('2d').getImageData(0, 0, w, h).data;
                let g = 0, s = 0;
                for (let y = 0; y < h; y++) for (let x = 0; x + 1 < w; x++) {
                    const i = (y * w + x) * 4;
                    g += Math.abs(lum(d, i) - lum(d, i + 4)); s += lum(d, i);
                }
                const n = w * (w - 1);
                return { 锐度: +(g / n).toFixed(3), 均值: +(s / n).toFixed(2), d, w, h };
            };
            const sa = stat(A.cv), sb = stat(B.cv), sc = stat(C.cv), sd = stat(D.cv);
            const cmp = (s) => {
                if (s.w !== sa.w || s.h !== sa.h) return '尺寸跟甲不同，逐像素比不了';
                let diff = 0, maxd = 0;
                for (let i = 0; i < sa.d.length; i += 4) {
                    const v = Math.max(Math.abs(sa.d[i] - s.d[i]), Math.abs(sa.d[i + 1] - s.d[i + 1]),
                                       Math.abs(sa.d[i + 2] - s.d[i + 2]), Math.abs(sa.d[i + 3] - s.d[i + 3]));
                    if (v > 8) { diff++; if (v > maxd) maxd = v; }
                }
                return (diff / (sa.w * sa.h) * 100).toFixed(2) + '%';
            };
            const row = (name, nat, s) => `${name}  固有 ${nat}  锐度 ${s.锐度}  均值 ${s.均值}  与甲差异 ${cmp(s)}`;

            // ── 戊：生产真正导出的那一份 ──
            // 甲乙丙丁都是拿「原始克隆体」拼的：mkClone 只搬了纸纹变量，没换画布、没做
            // --slice-img 去重、没把字换成图、没内联 blob: 素材。屏幕上那个导出走的是全套。
            // 所以「丁 完美」是在一个跟生产不同的克隆体上量出来的 —— 戊 就是这个差值本身。
            // 戊 好看、丁 也好看而生产难看 ⇒ 锅在那几段克隆处理里；两个都难看 ⇒ zoom 本身不行。
            if (!lastSvg) await buildStageImage();
            const E = !lastSvg ? null : await new Promise((res) => {
                const im = new Image();
                im.onerror = () => res(null);
                im.onload = () => {
                    const cv = document.createElement('canvas');
                    cv.width = im.naturalWidth; cv.height = im.naturalHeight;
                    cv.getContext('2d').drawImage(im, 0, 0);
                    res({ cv, nat: im.naturalWidth + 'x' + im.naturalHeight });
                };
                im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(lastSvg);
            });
            const se = E ? stat(E.cv) : null;

            // 缩到 320px 的小图直接显示出来。数只能说明「不一样」，眼睛才能说明「哪个对」——
            // 到底哪张跟你屏幕上那个舞台像，你自己一看就知道，不用我在这边推。
            // 等比缩放进 320×320 的方框（戊可能是长条，不能拉扁）。
            const thumb = (cv) => {
                const t = document.createElement('canvas');
                t.width = 320; t.height = 320;
                const tc = t.getContext('2d');
                tc.fillStyle = '#fff'; tc.fillRect(0, 0, 320, 320);   // 透明的地方垫白，不然看不出内容
                const k = Math.min(320 / cv.width, 320 / cv.height);
                const w = cv.width * k, h = cv.height * k;
                tc.drawImage(cv, (320 - w) / 2, (320 - h) / 2, w, h);
                return t.toDataURL('image/jpeg', 0.85);
            };
            const 行 = [row('甲 CSS transform  ', A.nat, sa), row('乙 SVG transform  ', B.nat, sb),
                        row('丙 退回老几何+钉死尺寸', C.nat, sc), row('丁 CSS zoom       ', D.nat, sd)];
            const 图 = [{ 名: '甲（2× 走 CSS transform）', src: thumb(A.cv) },
                        { 名: '乙（2× 走 SVG transform）', src: thumb(B.cv) },
                        { 名: '丙（2× 全靠 viewBox）', src: thumb(C.cv) },
                        { 名: '丁（2× 走 CSS zoom · 原始克隆体）', src: thumb(D.cv) }];
            if (E) {
                行.push(row('戊 生产真正导出的  ', E.nat, se));
                图.push({ 名: '戊（生产真正导出的那份 · 完整克隆处理）', src: thumb(E.cv) });
            }
            return { 舞台: W + 'x' + H, 行, 图 };
        }

        // 导出一次，把克隆体里各类元素的**个数**数出来，跟此刻舞台上实时 DOM 的个数对一遍。
        // 要分清的正是这两件事：「克隆那一步就丢了」（克隆体数少），还是
        // 「元素在、但画不出来」（两个数一样、图上是空的）。桌面查不出这个 bug，
        // 但桌面能证明克隆体是齐的 —— 所以这条必须在出问题的那台机器上量。
        async function svgProbe() {
            const c = await buildStageImage();
            const svg = lastSvg;
            if (!svg) return { err: '没截到 SVG —— buildStageImage 没走 loadImageEl？' };
            // 数元素，不是数字符串：<style> 里抄了一整份页面 CSS，按纯文本数会把
            // 「.pin-sticker { … }」这类选择器也算成一个元素，数出来全是虚的。
            // 而且得按 class 里的**词**数，不能按子串：`\bsticky-note\b` 会命中
            // `sticky-note-3d`（`-` 也是词边界），切片那一行会把自由便签一起算进去。
            const clsAll = [...svg.matchAll(/class="([^"]*)"/g)]
                .map((m) => m[1].split(/\s+/).filter(Boolean));
            const el = (cls) => clsAll.filter((toks) => toks.includes(cls)).length;
            // 两个纸纹变量是挂在克隆体根节点的**行内 style 属性**上的（buildStageImage 里
            // 用 clone.style.setProperty 写的）。生产那份还会往同一个属性里再塞一个
            // --slice-img（一整份切图，可能几百 KB）。要是那个属性或声明块超了引擎的上限，
            // 被丢掉的会是**整条属性** —— 两个纸纹变量跟着一起没，而便利贴的纹理是烘进
            // WebGL 像素的、不走 CSS，所以它没事。这正好对上「只有背景和切片的纹理没生效」。
            // 只看带冒号的声明写法：CSS 里的 var(--paper-tex) 不带冒号，不会误计。
            const decl = (v) => (svg.match(new RegExp('--' + v + ':', 'g')) || []).length;
            // 克隆体根节点那一整条标签有多长（属性值也在这条里）
            let 根标签 = '';
            const at = svg.indexOf('class="stage-container');
            if (at >= 0) 根标签 = svg.slice(svg.lastIndexOf('<', at), svg.indexOf('>', at) + 1);
            const live = (sel) => document.querySelectorAll('.stage-container ' + sel).length;
            return {
                画布: c.width + 'x' + c.height,
                SVG: (svg.length / 1024).toFixed(0) + 'KB',
                行: [
                    ['背景纹理层 .stage-tex  ', el('stage-tex'), live('.stage-tex')],
                    ['纸纹层 .texture-layer   ', el('texture-layer'), live('.texture-layer')],
                    ['切片 .sticky-note       ', el('sticky-note'), live('.sticky-note')],
                    ['自由便签 .sticky-node-3d', el('sticky-node-3d'), live('.sticky-node-3d')],
                    ['贴纸 .pin-sticker       ', el('pin-sticker'), live('.pin-sticker')],
                    ['贴纸图 .pin-img         ', el('pin-img'), live('.pin-img')],
                    ['换过图的 .export-canvas-img', el('export-canvas-img'), '—'],
                    ['没换掉的裸 <canvas>     ', (svg.match(/<canvas[\s>]/g) || []).length, live('canvas')],
                ],
                附: [
                    // 这一条是拿来判「手机上那份文件是不是最新的」：修复之后导出里
                    // 一个 selected 类名都不该有。是 0 而画面仍被放大 ⇒ 另有来源；
                    // 大于 0 ⇒ 那份文件还是改之前的。
                    `选中态泄漏：selected 类名 ${el('selected')} 个   （必须为 0）`,
                    `克隆体根标签长度 ${(根标签.length / 1024).toFixed(0)}KB`,
                    `行内声明 --paper-tex ${decl('paper-tex')} 个  --bg-tex ${decl('bg-tex')} 个`
                        + `  --slice-img ${decl('slice-img')} 个   （三个都该 ≥ 1）`,
                    `根标签里还有没有纸纹变量：paper-tex=${根标签.includes('--paper-tex')}`
                        + `  bg-tex=${根标签.includes('--bg-tex')}`,
                ],
            };
        }

        document.getElementById('diagSvg').addEventListener('click', async () => {
            lines = [];
            log('导出一次，数一数克隆体里各类元素还在不在。');
            log('「克隆体」= 真正拿去光栅的那份 SVG 里的元素个数；「实时」= 此刻舞台上 DOM 的个数。');
            log('两个数一样 ⇒ 元素在，是画不出来；克隆体少 ⇒ 克隆那一步就丢了。');
            log('');
            try {
                const r = await svgProbe();
                if (r.err) { log(r.err); return; }
                log('画布 ' + r.画布 + '    SVG ' + r.SVG);
                r.行.forEach(([n, a, b]) => log('  ' + n + '  克隆体 ' + a + ' / 实时 ' + b));
                log('');
                r.附.forEach((s) => log('  ' + s));
            } catch (e) { log('数元素炸了：' + e.message); }
            log('');
            log('把上面这几行原样发我。');
        });

        // ── 阴影定位 ──
        // 回答一个问题：手机导出里「每张便签上方都有一道很生硬的影」，屏幕上却没有。
        // 只在「SVG 当图片」这条光栅化路径上才会分家的东西，全文只有四处：
        //   便签自己的 box-shadow、便签纸纹层 .texture-layer（压在便签所有内容之上、
        //   靠 multiply 混色，乘算一丢就变成直接盖上去的一层）、四角暗部 .corner-shadow、
        //   舞台背景纹理层 .stage-tex。
        //
        // 做法：拿生产真正导出的那份 SVG（上面截下来的 lastSvg）出八张图 ——
        // 一张上一版写法、一张原样、六张各抹掉一条规则。
        //
        // 上一轮给的是整幅缩略图，300px 里那 4px 的缝根本看不见，六张全都「不对」
        // 多半是这么来的。这一轮每张给的是左上角 420×420 的**原尺寸裁切**：
        // 第一排便签的上边缘、以及它上面那圈舞台底都在画面里，
        // 「上方那道影」在不在，不用眯眼睛。另配一条数：便签正上方那条带的亮度
        // 跟再往上 50px 那条带比 —— 上面真有一道影，近带就会明显更暗。
        async function shadowProbe() {
            if (!lastSvg) await buildStageImage();
            if (!lastSvg) return { err: '没截到 SVG —— buildStageImage 没走 loadImageEl？' };
            const W = stageContainer.clientWidth, H = stageContainer.clientHeight, S = EXPORT_SCALE;
            const OW = W * S, OH = H * S;

            // 便签在导出图里的位置。舞台是 transform: scale(--stage-scale) 缩着显示的，
            // getBoundingClientRect 拿到的也是缩过的，得按 clientWidth 反算回来 ——
            // 导出那边取的是 clientWidth（布局度量），不认那个 transform。
            const stR = stageContainer.getBoundingClientRect();
            const k = stR.width ? stageContainer.clientWidth / stR.width : 1;
            const 框 = [...stageContainer.querySelectorAll('.paper-note')].map((el) => {
                const r = el.getBoundingClientRect();
                return { x: (r.left - stR.left) * k * S, y: (r.top - stR.top) * k * S,
                         w: r.width * k * S, h: r.height * k * S };
            }).filter((r) => r.w > 1 && r.h > 1);
            const 便签数 = 框.length;
            const 顶 = 便签数 ? Math.min(...框.map((r) => r.y)) : 0;
            const 左 = 便签数 ? Math.min(...框.map((r) => r.x)) : 0;
            const 右 = 便签数 ? Math.max(...框.map((r) => r.x + r.w)) : 0;

            // 上一版：旋转便签的影还是 box-shadow 画的。现在这版把它的 box-shadow 写成了
            // 行内 none，所以要用 !important 盖回去（行内的普通声明压不过样式表里的 !important），
            // 再把新加的那张影图藏掉。
            const 旧法 = '.paper-note{box-shadow:var(--note-shadow,0 2px 6px rgba(0,0,0,.2)) !important}'
                + '.export-note-shadow-img{display:none !important}';

            const 变体 = [
                ['① 上一版（box-shadow 照旧）', 旧法],
                ['② 现在这版（原样）', ''],
                ['③ 抹掉便签投影 box-shadow', '.paper-note{box-shadow:none !important}'],
                ['④ 抹掉便签纸纹层 .texture-layer', '.texture-layer{display:none !important}'],
                ['⑤ 纸纹层改不混合 normal', '.texture-layer{mix-blend-mode:normal !important}'],
                ['⑥ 抹掉四角暗部 .corner-shadow', '.corner-shadow{display:none !important}'],
                ['⑦ 抹掉新加的影图', '.export-note-shadow-img{display:none !important}'],
                ['⑧ 抹掉背景纹理层 .stage-tex', '.stage-tex{display:none !important}'],
            ];

            const 裁 = { x: Math.max(0, Math.round(左 - 110)), y: Math.max(0, Math.round(顶 - 110)), w: 420, h: 420 };
            const cv = document.createElement('canvas');
            cv.width = OW; cv.height = OH;
            const cx = cv.getContext('2d', { willReadFrequently: true });
            const 小 = document.createElement('canvas');
            const 图 = [], 行 = [];
            let 基准 = null;
            const 总 = OH * (OW - 1);
            const lum = (d, i) => d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
            // 便签正上方那两条带。近带贴着实拍边缘，远带再往上 50px；
            // 上面真有一道影，近带就会比远带暗。
            const 带 = (d, y0, y1) => {
                let s = 0, n = 0;
                for (let y = Math.max(0, Math.round(y0)); y < Math.min(OH, Math.round(y1)); y++) {
                    for (let x = Math.max(0, Math.round(左 + 20)); x < Math.min(OW, Math.round(右 - 20)); x++) {
                        const i = (y * OW + x) * 4;
                        if (d[i + 3] < 8) continue;
                        s += lum(d, i); n++;
                    }
                }
                return n ? s / n : NaN;
            };

            for (let v = 0; v < 变体.length; v++) {
                const [名, extra] = 变体[v];
                const svg = extra ? lastSvg.replace('</style>', extra + '</style>') : lastSvg;
                const im = await new Promise((res) => {
                    const i = new Image();
                    i.onerror = () => res(null);
                    i.onload = () => res(i);
                    i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
                });
                if (!im) { 行.push(名 + '   ✗ 图没加载出来'); continue; }
                // 连画两次、取第二次：「本文档第一次真正的光栅化」会缺子资源，
                // 见 buildStageImage 里那段长注释。每张变体都是一份新文档，都得躲一次。
                cx.clearRect(0, 0, OW, OH);
                cx.drawImage(im, 0, 0, OW, OH);
                cx.clearRect(0, 0, OW, OH);
                cx.drawImage(im, 0, 0, OW, OH);
                const d = cx.getImageData(0, 0, OW, OH).data;
                let s = 0;
                for (let y = 0; y < OH; y++) {
                    for (let x = 0; x + 1 < OW; x++) s += lum(d, (y * OW + x) * 4);
                }
                let 差异 = '—';
                if (v === 1) 基准 = d;                     // ② 原样 是差异基准
                else if (基准) {
                    let n = 0;
                    for (let i = 0; i < d.length; i += 4) {
                        if (Math.abs(基准[i] - d[i]) > 8 || Math.abs(基准[i + 1] - d[i + 1]) > 8
                            || Math.abs(基准[i + 2] - d[i + 2]) > 8) n++;
                    }
                    差异 = (n / (OW * OH) * 100).toFixed(2) + '%';
                } else 差异 = '基准';

                // 原尺寸裁切，不是缩略图
                小.width = 裁.w; 小.height = 裁.h;
                const 小c = 小.getContext('2d');
                小c.fillStyle = '#fff'; 小c.fillRect(0, 0, 裁.w, 裁.h);
                小c.drawImage(cv, 裁.x, 裁.y, 裁.w, 裁.h, 0, 0, 裁.w, 裁.h);
                图.push({ 名, src: 小.toDataURL('image/jpeg', 0.92) });

                const 近 = 便签数 ? 带(d, 顶 - 14, 顶 - 4) : NaN;
                const 远 = 便签数 ? 带(d, 顶 - 70, 顶 - 50) : NaN;
                行.push(名.padEnd(22, ' ')
                    + '  全图 ' + (s / 总).toFixed(2)
                    + '  便签上方 近' + (isNaN(近) ? '—' : 近.toFixed(1))
                    + '/远' + (isNaN(远) ? '—' : 远.toFixed(1))
                    + (isNaN(近) || isNaN(远) ? '' : (近 < 远 - 4 ? ' ⚠有影' : ' 平'))
                    + '  与②差异 ' + 差异);
            }
            return { 舞台: W + 'x' + H, 导出: OW + 'x' + OH,
                     裁切: `左上角 ${裁.w}×${裁.h} 原尺寸（便签 ${便签数} 张，第一排顶边 y=${Math.round(顶)}）`,
                     行, 图 };
        }

        document.getElementById('diagShadow').addEventListener('click', async () => {
            lines = [];
            log('拿生产真正导出的那份 SVG 出八张图。每张是左上角的原尺寸裁切，不是缩略图。');
            log('① = 上一版写法（box-shadow 照旧）；② = 现在这版原样；③~⑧ 各抹掉一条规则。');
            log('看哪一张里「便签上方那道影」没了 —— 那条规则就是凶手。');
            log('');
            log('「便签上方 近/远」= 便签正上方那条带的亮度 / 再往上 50px 那条带。');
            log('近 明显比 远 暗 ⇒ 上面真有一道影（会标 ⚠有影）。两边都平才是对的。');
            log('');
            log('正在出图，八张，手机上要十几秒…');
            const prev = document.getElementById('diagPreview');
            prev.innerHTML = '';
            try {
                const r = await shadowProbe();
                if (r.err) { log(r.err); return; }
                lines = lines.slice(0, 7);
                log('舞台 ' + r.舞台 + '   导出 ' + r.导出);
                log(r.裁切);
                r.行.forEach((s) => log('  ' + s));
                r.图.forEach((t) => {
                    const f = document.createElement('figure');
                    const im = document.createElement('img');
                    im.src = t.src;
                    const cap = document.createElement('figcaption');
                    cap.textContent = t.名;
                    f.append(im, cap);
                    prev.append(f);
                });
            } catch (e) { log('阴影定位炸了：' + e.message); }
        });

        document.getElementById('diagAB').addEventListener('click', async () => {
            lines = [];
            log('前四份是同一张舞台、同一份 CSS，只换 2× 由谁做：');
            log('甲 = 2× 走 CSS transform（第一轮生产的写法）');
            log('乙 = 2× 走 SVG 几何 transform，挂 foreignObject（.stage-container 上无 CSS transform）');
            log('丙 = 几何整个退回老写法（2× 全靠 viewBox），只把光栅尺寸钉死');
            log('丁 = 几何跟甲一样，只把 2× 从 transform 换成 zoom（现在生产的写法）');
            log('');
            log('戊 = 生产真正导出的那一份，原样光栅。前四份都是用「原始克隆体」拼的 ——');
            log('     没换画布、没做 --slice-img 去重、没把字换成图、没内联 blob: 素材；');
            log('     戊 走的是屏幕那个导出用的全套处理。这是唯一能看出「丁 跟生产到底差在哪」的一张。');
            log('     戊 对、丁 也对 ⇒ 锅在克隆处理那几段；两个都烂 ⇒ zoom 本身不行。');
            log('');
            const prev = document.getElementById('diagPreview');
            prev.innerHTML = '';
            try {
                const r = await abScale();
                log('舞台 ' + r.舞台);
                r.行.forEach((s) => log('  ' + s));
                r.图.forEach((t) => {
                    const f = document.createElement('figure');
                    const im = document.createElement('img');
                    im.src = t.src;
                    const cap = document.createElement('figcaption');
                    cap.textContent = t.名;
                    f.append(im, cap);
                    prev.append(f);
                });
            } catch (e) { log('对撞炸了：' + e.message); }
            log('');
            log('上面这几张小图就是各种写法的成品，跟屏幕上那个舞台比。');
            log('先看「均值」判铺没铺满：200 上下 = 铺满；49 上下 = 只占左上角 1/4。');
            log('');
            log('最要紧的是最后两张：丁（原始克隆体 + zoom）对 戊（生产那份 + 完整克隆处理）。');
            log('· 戊 的纹理/贴纸/便利贴都跟舞台一样，而丁 也对 ⇒ 锅在克隆处理那几段，不在 zoom。');
            log('· 戊 和丁 都丢了纹理 ⇒ zoom 在真机 foreignObject 里也建了 stacking context，');
            log('  这条得否掉，回去另找 2× 的做法。');
            log('· 戊 比丁 好 ⇒ 差别就在克隆处理里，接着一条一条剥。');
            log('光看数不够，哪张跟舞台像只有你能判 —— 告诉我丁和戊各是上面哪种。');
        });

        document.getElementById('diagRun').addEventListener('click', async () => {
            lines = [];
            log('—— 环境 ——');
            log('UA: ' + navigator.userAgent);
            log('屏幕 ' + innerWidth + 'x' + innerHeight + '  DPR ' + devicePixelRatio);
            log('舞台 ' + stageContainer.clientWidth + 'x' + stageContainer.clientHeight
                + '  EXPORT_SCALE ' + EXPORT_SCALE
                + '  → 导出应为 ' + stageContainer.clientWidth * EXPORT_SCALE + 'x'
                + stageContainer.clientHeight * EXPORT_SCALE);
            log('视口 meta: ' + (document.querySelector('meta[name="viewport"]') || {}).content);
            log('');
            log('—— 引擎探针 ——');
            log('两张都是 40×40 的小图，看纯色块铺满了多少');
            const U = 40;
            const A = await probe(`width:${U}px;height:${U}px;background:#ff0000`, U, 2);
            log('A 旧写法 viewBox=一半 : ' + JSON.stringify(A) + '   （该 100%；约 25% 就是老病灶）');
            const B = await probe(`width:${U}px;height:${U}px;background:#00aa00;transform:scale(2);transform-origin:0 0`, U * 2, 2);
            log('B 现写法 viewBox=1:1  : ' + JSON.stringify(B) + '   （该 100%，这就是现在导出用的写法）');
            log('');
            log('—— 真导出一遍 ——');
            try { log(JSON.stringify(await exportProbe())); }
            catch (e) { log('导出炸了：' + e.message); }
            log('');
            log('（「固有」应当是舞台的两倍；内容框从 100 出头起、覆盖约 59% = 好了；'
                + '内容框 58,52 → 451,448、覆盖 14.7% = 还是老样子）');
        });
    })();
</script>
